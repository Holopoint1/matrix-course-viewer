<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Course Viewer</title>
  <meta name="description" content="Matrix TSL Course Viewer - browser-based courses for engineering education.">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-no-sidebar>
  <section class="catalog-hero">
    <div class="hero-inner">
      <span class="eyebrow">Matrix Learning</span>
      <h1>Matrix Learning Platform</h1>
      <p>Choose a course to get started. Your progress is saved separately for each course.</p>
      <div class="hero-stats" id="hero-stats" aria-hidden="true">
        <div class="stat"><span class="stat-num" data-stat="courses">—</span><span class="stat-label">Courses</span></div>
        <div class="stat"><span class="stat-num" data-stat="time">—</span><span class="stat-label">Time logged</span></div>
        <div class="stat"><span class="stat-num" data-stat="streak">—</span><span class="stat-label">Day streak</span></div>
      </div>
    </div>
  </section>

  <main class="catalog-section">
    <div class="catalog-heading">
      <h2>Courses</h2>
      <p>Four learner-facing courses on the Flowcode &amp; E-blocks 3 curriculum.</p>
    </div>
    <div class="catalog-filter" id="catalog-filter" aria-label="Filter courses by category"></div>
    <div class="catalog" id="catalog">
      <p class="stage-loading">Loading courses&hellip;</p>
    </div>
    <p class="catalog-empty" id="catalog-empty" hidden>No courses match this filter.</p>
  </main>

  <script src="assets/chrome.js"></script>
  <script src="assets/gamify.js"></script>
  <script src="assets/cms-overrides.js"></script>
  <script src="assets/sidebar.js"></script>
  <script>
    (async function () {
      const root = document.getElementById('catalog');
      const stats = document.getElementById('hero-stats');

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      try {
        await window.Gamify.init();
        const res = await fetch('data/courses.json');
        const data = await res.json();
        /* Apply CMS overrides so admin edits show up live across the site. */
        if (window.MatrixCMS) {
          data.courses = data.courses.map((c) => window.MatrixCMS.applyOverrides(c));
        }

        /* ---------- Build category filter pills ----------
           Pills are derived from the actual `categories` arrays on each course.
           A category only appears as a pill if at least one course is tagged
           with it — no dead links possible. */
        const filterRoot = document.getElementById('catalog-filter');
        const emptyEl = document.getElementById('catalog-empty');
        const counts = new Map(); /* category -> course count */
        for (const c of data.courses) {
          for (const cat of (c.categories || [])) {
            counts.set(cat, (counts.get(cat) || 0) + 1);
          }
        }
        const orderedCats = Array.from(counts.entries())
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

        const urlParams = new URLSearchParams(location.search);
        let activeCategory = urlParams.get('category') || '';

        function renderPills() {
          let html = '<button type="button" class="catalog-filter-pill' +
            (activeCategory === '' ? ' active' : '') +
            '" data-cat="">All <span class="pill-count">' + data.courses.length + '</span></button>';
          for (const [cat, n] of orderedCats) {
            html += '<button type="button" class="catalog-filter-pill' +
              (cat === activeCategory ? ' active' : '') +
              '" data-cat="' + escapeHtml(cat) + '">' +
              escapeHtml(cat) + ' <span class="pill-count">' + n + '</span></button>';
          }
          filterRoot.innerHTML = html;
          filterRoot.querySelectorAll('[data-cat]').forEach((btn) => {
            btn.addEventListener('click', () => {
              activeCategory = btn.dataset.cat;
              const u = new URL(location.href);
              if (activeCategory) u.searchParams.set('category', activeCategory);
              else u.searchParams.delete('category');
              history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + u.hash);
              renderPills();
              renderCards();
            });
          });
        }

        function renderCards() {
          root.innerHTML = '';
          /* Only show top-level CO* courses in the main grid; CP* packs
             render in their own section below. */
          const allCourses = data.courses.filter((c) => c.kind !== 'pack');
          const visible = activeCategory
            ? allCourses.filter((c) => (c.categories || []).indexOf(activeCategory) >= 0)
            : allCourses;
          if (visible.length === 0) {
            emptyEl.hidden = false;
            return;
          }
          emptyEl.hidden = true;
          for (const course of visible) renderCard(course, root);
        }

        renderPills();

        let totalScreens = 0;
        for (const c of data.courses.filter((c) => c.kind !== 'pack')) totalScreens += c.screens.length;

        function renderCard(course, mount, opts) {
          opts = opts || {};
          const isPack = course.kind === 'pack';
          const screenCount = course.screens.length;
          const courseHours = course.screens.reduce((sum, s) => sum + (Number(s.hours) || 0), 0);
          const missing = course.screens.filter((s) => s.missing).length;
          const ready = screenCount - missing;
          const progress = JSON.parse(localStorage.getItem('matrix-lms:progress:' + course.id) || '{}');
          const completed = course.screens.filter((s) => progress[s.id]).length;
          const pct = screenCount ? Math.round((completed / screenCount) * 100) : 0;
          const hasCert = course.certificate && course.certificate.enabled;
          const cats = course.categories || [];

          const card = document.createElement('article');
          card.className = 'course-card' + (isPack ? ' course-card-pack' : '');
          const firstImage = course.screens.find((s) => s.type === 'image');
          const thumbSrc = (firstImage && (firstImage.thumbnail || (!firstImage.missing && firstImage.src))) || ('content/' + course.id + '/opening.svg');
          /* SCORM filename: courses use SC* prefix, packs use their own CP* id */
          const scormName = isPack
            ? course.id + '-' + course.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
            : course.id.replace('CO', 'SC') + '-' + course.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

          const continueLabel = isPack
            ? (completed ? 'Open pack' : 'Browse pack')
            : (completed ? 'Continue course' : 'Start course');

          card.innerHTML = `
            <a class="thumb" href="dashboard.html?id=${course.id}" style="background-image:url('${thumbSrc}')" aria-label="Open ${escapeHtml(course.title)}">
              ${isPack ? '<span class="thumb-tag thumb-tag-pack">Pack</span>' : (hasCert ? '<span class="thumb-tag" title="Includes certificate of completion">★ Certificate</span>' : '')}
            </a>
            <div class="body">
              <span class="code">${escapeHtml(course.code)}</span>
              <h3>${escapeHtml(course.title)}</h3>
              <p>${escapeHtml(course.shortDescription)}</p>
              ${cats.length ? `<div class="card-cats">${cats.map((c) => `<span class="card-cat">${escapeHtml(c)}</span>`).join('')}</div>` : ''}
              <div class="meta">
                ${screenCount > 0 ? `<span class="chip"><strong>${ready}</strong>/${screenCount} ${isPack ? 'worksheets' : 'ready'}</span>` : '<span class="chip chip-warn">Not yet split</span>'}
                ${courseHours > 0 ? `<span class="chip"><strong>${courseHours.toFixed(0)}</strong>h</span>` : ''}
                ${missing ? `<span class="chip chip-warn"><strong>${missing}</strong> missing</span>` : ''}
              </div>
              <div class="card-progress">
                <div class="card-progress-bar"><span style="width:${pct}%;"></span></div>
                <div class="card-progress-label"><strong>${completed}</strong> of ${screenCount} complete · ${pct}%</div>
              </div>
              <div class="actions">
                <a class="btn btn-primary" href="dashboard.html?id=${course.id}">
                  ${continueLabel}
                  <span class="btn-arrow" aria-hidden="true">→</span>
                </a>
              </div>
              <div class="card-extras">
                <a class="btn btn-secondary" href="dist/${scormName}.zip" download title="SCORM 1.2 package — drop into any SCORM-compliant LMS">↓ SCORM</a>
              </div>
            </div>`;
          (mount || root).appendChild(card);
        }

        renderCards();

        const streak = window.Gamify.getStreak();
        const totalTime = window.Gamify.getTotalSecondsAllCourses();
        /* Hero counter shows full courses, not packs. */
        stats.querySelector('[data-stat="courses"]').textContent = data.courses.filter((c) => c.kind !== 'pack').length;
        stats.querySelector('[data-stat="time"]').textContent = totalTime > 0 ? window.Gamify.formatDuration(totalTime) : '0m';
        stats.querySelector('[data-stat="streak"]').textContent = streak.days || 0;
        /* Missing-resources summary moved to the TOOLS screen — the catalog
           stays clean and learner-facing. */
      } catch (err) {
        root.innerHTML = '<p class="stage-loading">Could not load courses. ' + err.message + '</p>';
      }
    })();
  </script>
</body>
</html>
