<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Matrix Course Viewer</title>
  <meta name="description" content="Matrix TSL Course Viewer - browser-based courses for engineering education.">
  <link rel="stylesheet" href="assets/styles.css?v=20260702a">
</head>
<body data-no-sidebar>
  <section class="catalog-hero">
    <div class="hero-inner">
      <span class="eyebrow">Matrix Learning</span>
      <h1>Matrix Learning Platform</h1>
      <p>Choose a course to get started. Your progress is saved separately for each course.</p>
      <div class="hero-stats" id="hero-stats" aria-hidden="true">
        <div class="stat"><span class="stat-num" data-stat="courses">—</span><span class="stat-label">Courses</span></div>
        <div class="stat"><span class="stat-num" data-stat="time">—</span><span class="stat-label">Time logged</span></div>
        <div class="stat"><span class="stat-num" data-stat="streak">—</span><span class="stat-label">Day streak</span></div>
      </div>
    </div>
  </section>

  <main class="catalog-section">
    <div class="catalog-heading">
      <h2>Courses</h2>
      <p>Browse the Flowcode &amp; E-blocks 3 curriculum.</p>
    </div>
    <div class="catalog-controls">
      <div class="catalog-search">
        <span class="catalog-search-icon" aria-hidden="true">&#128269;</span>
        <input type="search" id="catalog-search" class="catalog-search-input"
               placeholder="Search by code, title, keyword or topic&hellip;" aria-label="Search courses"
               autocomplete="off" spellcheck="false">
        <button type="button" class="catalog-search-clear" id="catalog-search-clear" hidden aria-label="Clear search">&times;</button>
      </div>
      <div class="catalog-type">
        <label class="catalog-type-label" for="catalog-type-select">Course type</label>
        <select id="catalog-type-select" class="catalog-type-select" aria-label="Filter by course type">
          <option value="">All courses</option>
        </select>
      </div>
    </div>
    <div class="catalog" id="catalog">
      <p class="stage-loading">Loading courses&hellip;</p>
    </div>
    <p class="catalog-empty" id="catalog-empty" hidden>No courses match this filter.</p>
  </main>

  <script src="assets/chrome.js?v=20260703a"></script>
  <script src="assets/gamify.js?v=20260617"></script>
  <script src="assets/cms-overrides.js?v=20260623"></script>
  <script src="assets/sheet-loader.js?v=20260617"></script>
  <script src="assets/sidebar.js?v=20260629c"></script>
  <script>
    (async function () {
      const root = document.getElementById('catalog');
      const stats = document.getElementById('hero-stats');

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      try {
        await window.Gamify.init();
        const res = await fetch('data/courses.json?t=' + Date.now());
        const data = await res.json();
        /* Include Supabase-only courses (added via Admin), then apply overrides. */
        if (window.MatrixCMS) {
          if (window.MatrixCMS.mergeCourses) data.courses = window.MatrixCMS.mergeCourses(data.courses);
          data.courses = data.courses.map((c) => window.MatrixCMS.applyOverrides(c));
        }
        /* Catalogue metadata from the Course_structure sheet (published to
           data/course-structure.json by the sync). Adds per-course keywords +
           a display type, which power the search box below. Non-fatal: if it's
           missing, search still works on code/title/description/categories. */
        let structure = {};
        try {
          const sr = await fetch('data/course-structure.json?t=' + Date.now());
          if (sr.ok) { const sj = await sr.json(); structure = (sj && sj.courses) || {}; }
        } catch (_) {}
        for (const c of data.courses) {
          const meta = structure[c.id] || structure[c.code] || {};
          c.keywords = Array.isArray(meta.keywords) ? meta.keywords : [];
          c.structureType = meta.type || (c.kind === 'pack' ? 'Worksheet pack' : 'Course');
          /* The sheet drives the card: Title, Description and Hours when set.
             (Type/keywords above; the sync also folds these into courses.json so
             the dashboard/viewer get them too.) */
          if (meta.title) c.title = meta.title;
          if (meta.description) c.shortDescription = meta.description;
          c.structureHours = (meta.hours != null && meta.hours !== '') ? Number(meta.hours) : null;
          /* Pre-build a lowercase search haystack so filtering is a cheap
             substring test: code, title, description, categories, keywords, type. */
          c._search = [
            c.code, c.id, c.title, c.shortDescription,
            (c.categories || []).join(' '), c.keywords.join(' '), c.structureType
          ].filter(Boolean).join('  ').toLowerCase();
        }
        /* Catalogue order: by course code (CO0001 first) so it never drifts when
           the sync re-adds a course at the end of courses.json. */
        data.courses.sort((a, b) => String(a.id || a.code || '').localeCompare(String(b.id || b.code || '')));

        const emptyEl = document.getElementById('catalog-empty');
        const urlParams = new URLSearchParams(location.search);
        let activeQuery = (urlParams.get('q') || '').trim();
        let activeType = urlParams.get('type') || '';

        /* ---------- Course groupings (headings) ----------
           Four sections, shown in this fixed order. A course's group comes from the
           Course_structure sheet's "Course type" column (c.structureType). We also
           fall back gracefully when the sheet still uses the old Course/Worksheet
           pack values, so nothing is ever left ungrouped:
             • a pack                         → Worksheet packs
             • CPD in type / categories / title → CPD courses
             • otherwise a full course        → Teacher centred courses (default)
           To put a course under "Student centred courses" (or move one between
           groups), set its Course type cell in the sheet to the heading text. */
        const GROUP_ORDER = ['Student centred courses', 'Teacher centred courses', 'CPD courses', 'Worksheet packs'];
        function courseGroup(c) {
          const st = (c.structureType || '').toLowerCase();
          if (/pack/.test(st)) return 'Worksheet packs';
          if (/student/.test(st)) return 'Student centred courses';
          if (/teacher/.test(st)) return 'Teacher centred courses';
          if (/cpd/.test(st)) return 'CPD courses';
          if (c.kind === 'pack') return 'Worksheet packs';
          if ((c.categories || []).some((x) => /cpd/i.test(x)) || /\bcpd\b/i.test(c.title || '')) return 'CPD courses';
          return 'Teacher centred courses';
        }

        function renderCards() {
          root.innerHTML = '';
          /* Each search term must appear somewhere in the course's haystack
             (code/title/description/categories/keywords/type). */
          const terms = activeQuery.toLowerCase().split(/\s+/).filter(Boolean);
          const visible = data.courses.filter((c) => !c.draft)
            .filter((c) => !activeType || courseGroup(c) === activeType)
            .filter((c) => !terms.length || terms.every((t) => (c._search || '').indexOf(t) >= 0));
          if (!visible.length) {
            emptyEl.textContent = activeQuery ? 'No courses match “' + activeQuery + '”.' : 'No courses yet.';
            emptyEl.hidden = false;
            return;
          }
          emptyEl.hidden = true;
          /* Bucket the (already code-sorted) courses, then emit groups in
             GROUP_ORDER, skipping any that are empty. */
          const buckets = {};
          for (const c of visible) { const g = courseGroup(c); (buckets[g] = buckets[g] || []).push(c); }
          const extra = Object.keys(buckets).filter((g) => GROUP_ORDER.indexOf(g) < 0).sort();
          for (const g of GROUP_ORDER.concat(extra)) {
            const list = buckets[g];
            if (!list || !list.length) continue;
            const section = document.createElement('section');
            section.className = 'catalog-group';
            section.innerHTML = '<h2 class="catalog-group-title">' + escapeHtml(g) +
              ' <span class="catalog-group-count">' + list.length + '</span></h2>' +
              '<div class="catalog-grid"></div>';
            const grid = section.querySelector('.catalog-grid');
            for (const course of list) renderCard(course, grid);
            root.appendChild(section);
          }
        }

        /* ---------- Live text search ---------- */
        const searchInput = document.getElementById('catalog-search');
        const searchClear = document.getElementById('catalog-search-clear');
        if (searchInput) {
          searchInput.value = activeQuery;
          searchClear.hidden = !activeQuery;
          const applyQuery = () => {
            activeQuery = searchInput.value.trim();
            searchClear.hidden = !activeQuery;
            const u = new URL(location.href);
            if (activeQuery) u.searchParams.set('q', activeQuery); else u.searchParams.delete('q');
            history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + u.hash);
            renderCards();
          };
          searchInput.addEventListener('input', applyQuery);
          searchClear.addEventListener('click', () => { searchInput.value = ''; applyQuery(); searchInput.focus(); });
        }

        /* ---------- Course-type dropdown ----------
           The four groups (Student/Teacher/CPD/Worksheet packs), in order, each
           with a live count. Picking one shows just that group's section; "All
           courses" shows every section. Empty groups never appear as choices. */
        const typeSelect = document.getElementById('catalog-type-select');
        if (typeSelect) {
          const counts = {};
          for (const c of data.courses.filter((c) => !c.draft)) { const g = courseGroup(c); counts[g] = (counts[g] || 0) + 1; }
          const extra = Object.keys(counts).filter((g) => GROUP_ORDER.indexOf(g) < 0).sort();
          let opts = '<option value="">All courses</option>';
          for (const g of GROUP_ORDER.concat(extra)) {
            if (!counts[g]) continue;
            opts += '<option value="' + escapeHtml(g) + '"' + (g === activeType ? ' selected' : '') + '>' +
              escapeHtml(g) + ' (' + counts[g] + ')</option>';
          }
          typeSelect.innerHTML = opts;
          if (activeType && !counts[activeType]) activeType = '';   // a stale ?type= → All
          typeSelect.value = activeType;
          typeSelect.addEventListener('change', () => {
            activeType = typeSelect.value;
            const u = new URL(location.href);
            if (activeType) u.searchParams.set('type', activeType); else u.searchParams.delete('type');
            history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + u.hash);
            renderCards();
          });
        }

        let totalScreens = 0;
        for (const c of data.courses.filter((c) => c.kind !== 'pack' && !c.draft)) totalScreens += c.screens.length;

        function renderCard(course, mount, opts) {
          opts = opts || {};
          const isPack = course.kind === 'pack';
          const screenCount = course.screens.length;
          /* Hours: the sheet's "Hours of learning" wins when set, else the sum
             computed from the actual screens. */
          const computedHours = course.screens.reduce((sum, s) => sum + (Number(s.hours) || 0), 0);
          const courseHours = (course.structureHours != null) ? course.structureHours : computedHours;
          const missing = course.screens.filter((s) => s.missing).length;
          const ready = screenCount - missing;
          const progress = JSON.parse(localStorage.getItem('matrix-lms:progress:' + course.id) || '{}');
          const completed = course.screens.filter((s) => progress[s.id]).length;
          const pct = screenCount ? Math.round((completed / screenCount) * 100) : 0;
          const hasCert = course.certificate && course.certificate.enabled;
          const cats = course.categories || [];

          const card = document.createElement('article');
          card.className = 'course-card course-card-textonly' + (isPack ? ' course-card-pack' : '');
          /* SCORM filename: courses use SC* prefix, packs use their own CP* id */
          const scormName = isPack
            ? course.id + '-' + course.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
            : course.id.replace('CO', 'SC') + '-' + course.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

          const continueLabel = isPack
            ? (completed ? 'Open pack' : 'Browse pack')
            : (completed ? 'Continue course' : 'Start course');

          card.innerHTML = `
            <div class="body">
              ${hasCert ? '<div class="card-tags"><span class="card-tag card-tag-cert" title="Includes certificate of completion">★ Certificate</span></div>' : ''}
              <span class="code">${escapeHtml(course.code)}</span>
              <h3><a class="card-title-link" href="dashboard.html?id=${course.id}">${escapeHtml(course.title)}</a></h3>
              <p>${escapeHtml(course.shortDescription)}</p>
              ${cats.length ? `<div class="card-cats">${cats.map((c) => `<span class="card-cat">${escapeHtml(c)}</span>`).join('')}</div>` : ''}
              <div class="meta">
                ${screenCount > 0 ? `<span class="chip"><strong>${ready}</strong>/${screenCount} ${isPack ? 'worksheets' : 'ready'}</span>` : '<span class="chip chip-warn">Not yet split</span>'}
                ${courseHours > 0 ? `<span class="chip"><strong>${Math.round(courseHours * 10) / 10}</strong>h</span>` : ''}
                ${missing ? `<span class="chip chip-warn"><strong>${missing}</strong> missing</span>` : ''}
              </div>
              <div class="card-progress">
                <div class="card-progress-bar"><span style="width:${pct}%;"></span></div>
                <div class="card-progress-label"><strong>${completed}</strong> of ${screenCount} complete · ${pct}%</div>
              </div>
              <div class="actions">
                <a class="btn btn-primary" href="dashboard.html?id=${course.id}">
                  ${continueLabel}
                  <span class="btn-arrow" aria-hidden="true">→</span>
                </a>
              </div>
              <div class="card-extras">
                <a class="btn btn-secondary" href="dist/${scormName}.zip" download title="SCORM 1.2 package — drop into any SCORM-compliant LMS">↓ SCORM</a>
              </div>
            </div>`;
          (mount || root).appendChild(card);
        }

        renderCards();

        const streak = window.Gamify.getStreak();
        const totalTime = window.Gamify.getTotalSecondsAllCourses();
        /* Hero counter matches the grid: every published course + pack. */
        stats.querySelector('[data-stat="courses"]').textContent = data.courses.filter((c) => !c.draft).length;
        stats.querySelector('[data-stat="time"]').textContent = totalTime > 0 ? window.Gamify.formatDuration(totalTime) : '0m';
        stats.querySelector('[data-stat="streak"]').textContent = streak.days || 0;
        /* Missing-resources summary moved to the TOOLS screen — the catalog
           stays clean and learner-facing. */
      } catch (err) {
        root.innerHTML = '<p class="stage-loading">Could not load courses. ' + err.message + '</p>';
      }
    })();
  </script>
</body>
</html>
