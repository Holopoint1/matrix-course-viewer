<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Course Viewer</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260526">
</head>
<body>
  <section class="viewer-main">
    <div class="screen-bar">
      <div>
        <h2 id="screen-title">&nbsp;</h2>
        <div class="meta" id="screen-meta">&nbsp;</div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="prev-btn">&larr; Previous</button>
        <button class="btn btn-secondary" id="next-btn">Next &rarr;</button>
        <button class="btn btn-primary" id="complete-btn">Mark complete &amp; next</button>
      </div>
    </div>
    <div class="screen-stage" id="screen-stage">
      <p class="stage-loading">Loading&hellip;</p>
    </div>
    <!-- Cert CTA lives here so app.js can still toggle it visible at 100% —
         hidden by default, no duplicate nav. -->
    <div class="certificate-cta" id="certificate-cta" hidden>
      <a class="btn btn-primary" id="certificate-link">Get your certificate</a>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="assets/sidebar.js?v=20260526"></script>
  <script src="assets/chrome.js?v=20260526"></script>
  <script src="assets/gamify.js?v=20260526"></script>
  <script src="assets/cms-overrides.js?v=20260526"></script>
  <script src="assets/app.js?v=20260526"></script>
</body>
</html>
