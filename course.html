<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Matrix Course Viewer</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260629d">
</head>
<body>
  <section class="viewer-main">
    <div class="screen-bar">
      <div>
        <h2 id="screen-title">&nbsp;</h2>
        <div class="meta" id="screen-meta">&nbsp;</div>
      </div>
      <div class="actions">
        <div class="options-menu">
          <button class="btn btn-secondary" id="options-btn" type="button" aria-haspopup="true" aria-expanded="false" title="More options">&#9776; Options &#9662;</button>
          <div class="options-dropdown" id="options-dropdown" role="menu" hidden>
            <a class="opt-item" id="open-google-btn" role="menuitem" target="_blank" rel="noopener" title="Open the original in Google" hidden>&#8599; Open in Google</a>
            <button class="opt-item" id="download-btn" role="menuitem" type="button" title="Download this file">&#11015; Download screen</button>
            <button class="opt-item" id="print-btn" role="menuitem" type="button" title="Print this screen">&#128424; Print</button>
            <button class="opt-item" id="download-course-btn" role="menuitem" type="button" title="Download the whole course as a ZIP">&#11015; Download course</button>
          </div>
        </div>
        <button class="btn btn-secondary" id="prev-btn" type="button">&larr; Previous</button>
        <button class="btn btn-secondary" id="next-btn" type="button">Next &rarr;</button>
        <button class="btn btn-primary" id="complete-btn" type="button">Mark complete &amp; next</button>
      </div>
    </div>
    <div class="screen-stage" id="screen-stage">
      <p class="stage-loading">Loading&hellip;</p>
    </div>
    <!-- Cert CTA lives here so app.js can still toggle it visible at 100% —
         hidden by default, no duplicate nav. -->
    <div class="certificate-cta" id="certificate-cta" hidden>
      <a class="btn btn-primary" id="certificate-link">Get your certificate</a>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- docx-preview: renders .docx with the document's OWN styles (tables,
       fonts, spacing) — verbatim, no conversion/restructuring. -->
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="assets/sidebar.js?v=20260629b"></script>
  <script src="assets/chrome.js?v=20260623"></script>
  <script src="assets/gamify.js?v=20260617"></script>
  <script src="assets/cms-overrides.js?v=20260623"></script>
  <script src="assets/sheet-loader.js?v=20260617"></script>
  <script src="assets/app.js?v=20260629e"></script>
</body>
</html>
