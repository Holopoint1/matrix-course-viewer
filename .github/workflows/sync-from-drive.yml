name: Sync content from Drive

on:
  workflow_dispatch:
    inputs:
      course:
        description: 'Course code to sync (blank = all)'
        required: false
        default: 'CO0001'
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — the "auto-refresh"
  push:
    branches: [main]
    paths:
      - 'tools/sync-drive.mjs'
      - 'data/sheets.json'
      - '.github/workflows/sync-from-drive.yml'

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install googleapis
        run: npm install --no-save googleapis

      - name: Pull from Drive
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
          COURSE: ${{ github.event.inputs.course }}
        run: node tools/sync-drive.mjs

      - name: Commit any changes
        run: |
          git config user.name "drive-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data/courses.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync from Drive (content + courses.json)"
            git push
          fi
