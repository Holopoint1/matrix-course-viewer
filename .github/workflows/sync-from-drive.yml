name: Sync content from Drive

on:
  workflow_dispatch:
    inputs:
      course:
        description: 'Course code to sync (blank = all — recommended)'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'    # every 5 min (GitHub's practical minimum; scheduled runs are best-effort and can lag a few min at busy times)
  push:
    branches: [main]
    paths:
      - 'tools/sync-drive.mjs'
      - 'data/sheets.json'
      - '.github/workflows/sync-from-drive.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Check out (and later push) using a Personal Access Token when one is
      # configured. GitHub deliberately does NOT rebuild Pages for commits made
      # with the built-in GITHUB_TOKEN, so a bot-only sync never reached the live
      # site. A push authenticated with a real PAT triggers the Pages build like a
      # normal commit. Falls back to GITHUB_TOKEN if DEPLOY_PAT isn't set, so this
      # is safe to merge before the secret exists (it just keeps the old behaviour).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install googleapis
        run: npm install --no-save googleapis

      - name: Pull from Drive
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
          COURSE: ${{ github.event.inputs.course }}
        run: node tools/sync-drive.mjs

      - name: Commit any changes
        id: commit
        run: |
          git config user.name "drive-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content data/courses.json data/course-structure.json   # -A so pruned/renamed files are committed as deletions
          # Commit whenever ANYTHING actually changed. The old churn sources are gone:
          # Google-native docs no longer re-export every run (modifiedTime manifest),
          # course-structure.json has no timestamp, and _sync-report.json keeps a
          # STABLE generatedAt unless its findings change — so an unchanged sync
          # produces no diff (no commit, so Pages isn't churned), while a real change
          # OR a new report finding (a naming issue / held-back folder) commits and
          # reaches the live admin.
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync from Drive (content + courses.json)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # NOTE: no manual Pages-build trigger here. This repo uses modern (Actions-
      # based) GitHub Pages, where every push to main — including the sync bot's —
      # already runs the "pages build and deployment" workflow automatically. The
      # old legacy POST /pages/builds call created a SECOND, competing build for the
      # same commit, and the two fought so the deploy step failed. Removing it (plus
      # skipping no-op commits above) lets each push produce a single clean deploy.
