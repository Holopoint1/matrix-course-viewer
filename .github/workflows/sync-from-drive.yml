name: Sync content from Drive

on:
  workflow_dispatch:
    inputs:
      course:
        description: 'Course code to sync (blank = all — recommended)'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'    # every 5 min (GitHub's practical minimum; scheduled runs are best-effort and can lag a few min at busy times)
  push:
    branches: [main]
    paths:
      - 'tools/sync-drive.mjs'
      - 'data/sheets.json'
      - '.github/workflows/sync-from-drive.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install googleapis
        run: npm install --no-save googleapis

      - name: Pull from Drive
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
          COURSE: ${{ github.event.inputs.course }}
        run: node tools/sync-drive.mjs

      - name: Commit any changes
        id: commit
        run: |
          git config user.name "drive-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content data/courses.json data/course-structure.json   # -A so pruned/renamed files are committed as deletions
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync from Drive (content + courses.json)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits pushed by the Actions token do NOT trigger the GitHub Pages build,
      # so a sync-only change would never reach the live site. Request the Pages
      # build explicitly (an API call isn't subject to that restriction). Best-effort.
      - name: Trigger GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          echo "Pages build request -> HTTP $code"; cat /tmp/pages.json 2>/dev/null || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::warning::Pages build trigger returned HTTP $code — the live site may lag; check Settings ▸ Pages."
          fi
