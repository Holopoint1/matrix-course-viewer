<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Certificate of Completion</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260570">
</head>
<body data-no-sidebar>
  <header class="site-header" id="site-header" data-extras-id="cert-nav-extras"></header>
  <template id="cert-nav-extras"><a id="back-link" href="#">Back to course</a></template>

  <main class="cert-shell">
    <div class="cert-controls">
      <input type="text" class="cert-input" id="name-input" placeholder="Enter your full name">
      <button class="btn btn-secondary" id="print-btn">🖨 Print</button>
      <button class="btn btn-primary" id="save-btn">⬇ Save as PDF</button>
    </div>

    <div class="cert" id="certificate">
      <div class="cert-top">
        <img class="cert-logo" src="assets/matrix-logo.svg?v=20260570" alt="Matrix TSL">
        <div class="cert-eyebrow">Matrix&nbsp;TSL · Engineering Education</div>
      </div>

      <div class="cert-mid">
        <div class="title">Certificate of Completion</div>
        <div class="subtitle">This is to certify that</div>
        <div class="recipient" id="cert-name">&nbsp;</div>
        <p class="body" id="cert-body">has successfully completed the course</p>
        <div class="cert-course"><span id="cert-code"></span> &nbsp;·&nbsp; <span id="cert-title"></span></div>
        <div class="subtitle cert-awarded">Awarded on <span id="cert-date"></span></div>
      </div>

      <div class="signoff">
        <div class="col">
          <div class="line"></div>
          <strong>Time spent</strong>
          <div id="cert-hours">—</div>
        </div>
        <div class="col">
          <div class="line"></div>
          <strong>Completion</strong>
          <div id="cert-completion">100%</div>
        </div>
        <div class="col">
          <div class="line"></div>
          <strong>Screens</strong>
          <div id="cert-screens">—</div>
        </div>
        <div class="col">
          <div class="line"></div>
          <strong>Awarded by</strong>
          <div>The Matrix&nbsp;TSL team</div>
        </div>
      </div>

      <div class="cert-foot">
        Certificate reference <span id="cert-ref">—</span> &nbsp;·&nbsp; Verify at matrixtsl.com
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/chrome.js?v=20260570"></script>
  <script src="assets/gamify.js?v=20260570"></script>
  <script src="assets/cms-overrides.js?v=20260570"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js?v=20260570"></script>
  <script src="assets/cms-supabase.js?v=20260570"></script>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var courseId = params.get('id');
      if (!courseId) { location.replace('index.html'); return; }

      /* ---- Critical UI wiring FIRST: this must work even if the async
              data load (Gamify / courses.json) fails or chrome.js hasn't
              injected the back link yet. The old single async IIFE put the
              print + name code AFTER an unguarded #back-link lookup, so any
              earlier error silently killed both. ---- */
      var backLink = document.getElementById('back-link');
      if (backLink) backLink.href = 'course.html?id=' + encodeURIComponent(courseId);

      var nameInput = document.getElementById('name-input');
      var nameSlot = document.getElementById('cert-name');
      var nameKey = 'matrix-lms:cert-name:' + courseId;
      var seeded = localStorage.getItem(nameKey) ||
                   localStorage.getItem('matrix-lms:account-name') || '';
      if (seeded) nameInput.value = seeded;
      function setName() {
        var v = nameInput.value.trim();
        nameSlot.textContent = v || ' ';
        try { localStorage.setItem(nameKey, v); } catch (e) {}
      }
      nameInput.addEventListener('input', setName);
      setName();

      document.getElementById('print-btn').addEventListener('click', function () {
        window.print();
      });

      /* Rasterise the SVG logo to a PNG data URL (jsPDF core can't embed
         SVG without a plugin). Same-origin, so the canvas isn't tainted.
         Resolves null if it can't — the PDF then uses a text wordmark. */
      function logoPng() {
        return new Promise(function (resolve) {
          var im = new Image();
          im.crossOrigin = 'anonymous';
          im.onload = function () {
            try {
              var w = 1000, h = Math.round(1000 * 131 / 721);
              var c = document.createElement('canvas');
              c.width = w; c.height = h;
              c.getContext('2d').drawImage(im, 0, 0, w, h);
              resolve({ data: c.toDataURL('image/png'), ratio: 721 / 131 });
            } catch (e) { resolve(null); }
          };
          im.onerror = function () { resolve(null); };
          im.src = 'assets/matrix-logo.svg?v=20260570';
        });
      }

      var saveBtn = document.getElementById('save-btn');
      saveBtn.addEventListener('click', async function () {
        var JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF ||
                    (window.html2pdf && window.html2pdf.jsPDF);
        if (!JsPDF) { alert('PDF engine still loading — opening the print dialog instead.'); window.print(); return; }
        var orig = saveBtn.textContent;
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        try {
          /* Pure vector render — no html2canvas (it kept failing on the
             aspect-ratio sized .cert / SVG logo). Deterministic: CSS can't
             break it. Values are read from the live DOM so the PDF matches
             exactly what's on screen. */
          var T = function (id) { var el = document.getElementById(id); return (el ? el.textContent : '').replace(/\s+/g, ' ').trim(); };
          var name = T('cert-name') || nameInput.value.trim();
          var body = T('cert-body') || 'has successfully completed the course';
          var courseLine = [T('cert-code'), T('cert-title')].filter(Boolean).join('  ·  ');
          var dateStr = T('cert-date');
          var cols = [
            ['TIME SPENT', T('cert-hours') || '—'],
            ['COMPLETION', T('cert-completion') || '100%'],
            ['SCREENS', T('cert-screens') || '—'],
            ['AWARDED BY', 'The Matrix TSL team']
          ];
          var ref = T('cert-ref');

          var logo = await logoPng();

          var doc = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
          var W = 297, H = 210, cx = W / 2;
          var PURPLE = [30, 27, 75], VIOLET = [124, 58, 237],
              MUTE = [93, 91, 120], SUBTLE = [138, 135, 166], GOLD = [212, 175, 55];

          doc.setFillColor(255, 255, 255); doc.rect(0, 0, W, H, 'F');
          doc.setDrawColor(PURPLE[0], PURPLE[1], PURPLE[2]); doc.setLineWidth(2.4);
          doc.rect(9, 9, W - 18, H - 18);
          doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]); doc.setLineWidth(0.5);
          doc.rect(15, 15, W - 30, H - 30);

          var y = 30;
          if (logo) {
            var lw = 70, lh = lw / logo.ratio;
            doc.addImage(logo.data, 'PNG', cx - lw / 2, y - 4, lw, lh);
            y += lh + 4;
          } else {
            doc.setFont('helvetica', 'bold'); doc.setFontSize(22);
            doc.setTextColor(PURPLE[0], PURPLE[1], PURPLE[2]);
            doc.text('MATRIX TSL', cx, y + 6, { align: 'center' });
            y += 14;
          }
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
          doc.setTextColor(MUTE[0], MUTE[1], MUTE[2]);
          doc.text('MATRIX TSL  ·  ENGINEERING EDUCATION', cx, y + 4, { align: 'center', charSpace: 0.6 });

          doc.setFont('times', 'bold'); doc.setFontSize(30);
          doc.setTextColor(PURPLE[0], PURPLE[1], PURPLE[2]);
          doc.text('Certificate of Completion', cx, 78, { align: 'center' });

          doc.setFont('helvetica', 'normal'); doc.setFontSize(11.5);
          doc.setTextColor(MUTE[0], MUTE[1], MUTE[2]);
          doc.text('This is to certify that', cx, 92, { align: 'center' });

          doc.setFont('times', 'italic'); doc.setFontSize(30);
          doc.setTextColor(VIOLET[0], VIOLET[1], VIOLET[2]);
          doc.text(name || ' ', cx, 108, { align: 'center', maxWidth: W - 70 });

          doc.setFont('helvetica', 'normal'); doc.setFontSize(11.5);
          doc.setTextColor(40, 38, 60);
          doc.text(doc.splitTextToSize(body, W - 80), cx, 122, { align: 'center' });

          doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
          doc.setTextColor(PURPLE[0], PURPLE[1], PURPLE[2]);
          doc.text(doc.splitTextToSize(courseLine, W - 70), cx, 136, { align: 'center' });

          doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
          doc.setTextColor(MUTE[0], MUTE[1], MUTE[2]);
          doc.text('Awarded on ' + dateStr, cx, 148, { align: 'center' });

          var n = cols.length, span = (W - 80) / n, x0 = 40;
          for (var i = 0; i < n; i++) {
            var colCx = x0 + span * i + span / 2;
            doc.setDrawColor(148, 152, 175); doc.setLineWidth(0.3);
            doc.line(colCx - span / 2 + 6, 168, colCx + span / 2 - 6, 168);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
            doc.setTextColor(PURPLE[0], PURPLE[1], PURPLE[2]);
            doc.text(cols[i][0], colCx, 174, { align: 'center', charSpace: 0.5 });
            doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
            doc.setTextColor(40, 38, 60);
            doc.text(doc.splitTextToSize(cols[i][1], span - 4), colCx, 180, { align: 'center' });
          }

          doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
          doc.setTextColor(SUBTLE[0], SUBTLE[1], SUBTLE[2]);
          doc.text('Certificate reference ' + ref + '   ·   Verify at matrixtsl.com', cx, 196, { align: 'center', charSpace: 0.4 });

          var who = (name || 'certificate').replace(/[^A-Za-z0-9._-]+/g, '-');
          doc.save(who + '-' + courseId + '-certificate.pdf');
        } catch (err) {
          console.error('Certificate PDF build failed:', err);
          alert('Could not build the PDF (' + ((err && err.message) || err) + '). Opening the print dialog — choose “Save as PDF” there.');
          window.print();
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = orig;
        }
      });

      var today = new Date();
      document.getElementById('cert-date').textContent =
        today.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
      var pad = function (n) { return ('0' + n).slice(-2); };
      document.getElementById('cert-ref').textContent =
        (courseId + '-' + today.getFullYear() + pad(today.getMonth() + 1) + pad(today.getDate())).toUpperCase();

      /* ---- Best-effort data population. Wrapped so nothing here can break
              the print button or the name field. ---- */
      (async function () {
        try {
          var course = null;
          try {
            var res = await fetch('data/courses.json');
            var data = await res.json();
            course = (data.courses || []).find(function (c) { return c.id === courseId; }) || null;
            if (course && window.MatrixCMS && window.MatrixCMS.applyOverrides) {
              course = window.MatrixCMS.applyOverrides(course);
            }
          } catch (e) {}

          if (course) {
            document.getElementById('cert-code').textContent = course.code || course.id;
            document.getElementById('cert-title').textContent = course.title || '';
            document.getElementById('cert-body').textContent = course.id === 'CO0001'
              ? 'has successfully completed a Continuing Professional Development course in E-blocks 3 and Flowcode'
              : 'has successfully completed the course';
            document.title = 'Certificate · ' + (course.title || course.id);
          }

          var total = course ? course.screens.length : 0;
          var completedCount = 0;
          try {
            var progress = JSON.parse(localStorage.getItem('matrix-lms:progress:' + courseId) || '{}');
            completedCount = course ? course.screens.filter(function (s) { return progress[s.id]; }).length : 0;
          } catch (e) {}

          var realSeconds = 0;
          try {
            if (window.Gamify) {
              await window.Gamify.init();
              realSeconds = window.Gamify.getCourseTotalSeconds(courseId) || 0;
            }
          } catch (e) {}

          var pct = total ? Math.round((completedCount / total) * 100) : 0;
          document.getElementById('cert-completion').textContent = pct + '%';
          document.getElementById('cert-screens').textContent = total ? (completedCount + ' of ' + total) : '—';
          document.getElementById('cert-hours').textContent = realSeconds > 0
            ? (window.Gamify && window.Gamify.formatDuration
                ? window.Gamify.formatDuration(realSeconds)
                : Math.round(realSeconds / 60) + ' min')
            : '—';
        } catch (e) { /* never let this break the page */ }
      })();
    })();
  </script>
</body>
</html>
