<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate of Completion</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260525">
</head>
<body data-no-sidebar>
  <header class="site-header" id="site-header" data-extras-id="cert-nav-extras"></header>
  <template id="cert-nav-extras"><a id="back-link" href="#">Back to course</a></template>

  <main class="cert-shell">
    <div class="cert-controls">
      <input type="text" class="cert-input" id="name-input" placeholder="Enter your full name">
      <button class="btn btn-secondary" id="print-btn">🖨 Print</button>
      <button class="btn btn-primary" id="save-btn">⬇ Save as PDF</button>
    </div>

    <div class="cert" id="certificate">
      <div class="cert-top">
        <img class="cert-logo" src="assets/matrix-logo.svg?v=20260525" alt="Matrix TSL">
        <div class="cert-eyebrow">Matrix&nbsp;TSL · Engineering Education</div>
      </div>

      <div class="cert-mid">
        <div class="title">Certificate of Completion</div>
        <div class="subtitle">This is to certify that</div>
        <div class="recipient" id="cert-name">&nbsp;</div>
        <p class="body" id="cert-body">has successfully completed the course</p>
        <div class="cert-course"><span id="cert-code"></span> &nbsp;·&nbsp; <span id="cert-title"></span></div>
        <div class="subtitle cert-awarded">Awarded on <span id="cert-date"></span></div>
      </div>

      <div class="signoff">
        <div class="col">
          <div class="line"></div>
          <strong>Time spent</strong>
          <div id="cert-hours">—</div>
        </div>
        <div class="col">
          <div class="line"></div>
          <strong>Completion</strong>
          <div id="cert-completion">100%</div>
        </div>
        <div class="col">
          <div class="line"></div>
          <strong>Screens</strong>
          <div id="cert-screens">—</div>
        </div>
        <div class="col">
          <div class="line"></div>
          <strong>Awarded by</strong>
          <div>The Matrix&nbsp;TSL team</div>
        </div>
      </div>

      <div class="cert-foot">
        Certificate reference <span id="cert-ref">—</span> &nbsp;·&nbsp; Verify at matrixtsl.com
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="assets/chrome.js?v=20260525"></script>
  <script src="assets/gamify.js?v=20260525"></script>
  <script src="assets/cms-overrides.js?v=20260525"></script>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var courseId = params.get('id');
      if (!courseId) { location.replace('index.html'); return; }

      /* ---- Critical UI wiring FIRST: this must work even if the async
              data load (Gamify / courses.json) fails or chrome.js hasn't
              injected the back link yet. The old single async IIFE put the
              print + name code AFTER an unguarded #back-link lookup, so any
              earlier error silently killed both. ---- */
      var backLink = document.getElementById('back-link');
      if (backLink) backLink.href = 'course.html?id=' + encodeURIComponent(courseId);

      var nameInput = document.getElementById('name-input');
      var nameSlot = document.getElementById('cert-name');
      var nameKey = 'matrix-lms:cert-name:' + courseId;
      var seeded = localStorage.getItem(nameKey) ||
                   localStorage.getItem('matrix-lms:account-name') || '';
      if (seeded) nameInput.value = seeded;
      function setName() {
        var v = nameInput.value.trim();
        nameSlot.textContent = v || ' ';
        try { localStorage.setItem(nameKey, v); } catch (e) {}
      }
      nameInput.addEventListener('input', setName);
      setName();

      document.getElementById('print-btn').addEventListener('click', function () {
        window.print();
      });

      var saveBtn = document.getElementById('save-btn');
      saveBtn.addEventListener('click', function () {
        if (!window.html2pdf) { alert('PDF library is still loading — try again in a moment.'); return; }
        var cert = document.getElementById('certificate');
        var who = (nameInput.value.trim() || 'certificate').replace(/[^A-Za-z0-9._-]+/g, '-');
        var orig = saveBtn.textContent;
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        window.html2pdf().set({
          margin: 0,
          filename: who + '-' + courseId + '-certificate.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        }).from(cert).save().then(
          function () { saveBtn.disabled = false; saveBtn.textContent = orig; },
          function () { saveBtn.disabled = false; saveBtn.textContent = orig; alert('Could not build the PDF — use Print and choose “Save as PDF” instead.'); }
        );
      });

      var today = new Date();
      document.getElementById('cert-date').textContent =
        today.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
      var pad = function (n) { return ('0' + n).slice(-2); };
      document.getElementById('cert-ref').textContent =
        (courseId + '-' + today.getFullYear() + pad(today.getMonth() + 1) + pad(today.getDate())).toUpperCase();

      /* ---- Best-effort data population. Wrapped so nothing here can break
              the print button or the name field. ---- */
      (async function () {
        try {
          var course = null;
          try {
            var res = await fetch('data/courses.json');
            var data = await res.json();
            course = (data.courses || []).find(function (c) { return c.id === courseId; }) || null;
            if (course && window.MatrixCMS && window.MatrixCMS.applyOverrides) {
              course = window.MatrixCMS.applyOverrides(course);
            }
          } catch (e) {}

          if (course) {
            document.getElementById('cert-code').textContent = course.code || course.id;
            document.getElementById('cert-title').textContent = course.title || '';
            document.getElementById('cert-body').textContent = course.id === 'CO0001'
              ? 'has successfully completed a Continuing Professional Development course in E-blocks 3 and Flowcode'
              : 'has successfully completed the course';
            document.title = 'Certificate · ' + (course.title || course.id);
          }

          var total = course ? course.screens.length : 0;
          var completedCount = 0;
          try {
            var progress = JSON.parse(localStorage.getItem('matrix-lms:progress:' + courseId) || '{}');
            completedCount = course ? course.screens.filter(function (s) { return progress[s.id]; }).length : 0;
          } catch (e) {}

          var realSeconds = 0;
          try {
            if (window.Gamify) {
              await window.Gamify.init();
              realSeconds = window.Gamify.getCourseTotalSeconds(courseId) || 0;
            }
          } catch (e) {}

          var pct = total ? Math.round((completedCount / total) * 100) : 0;
          document.getElementById('cert-completion').textContent = pct + '%';
          document.getElementById('cert-screens').textContent = total ? (completedCount + ' of ' + total) : '—';
          document.getElementById('cert-hours').textContent = realSeconds > 0
            ? (window.Gamify && window.Gamify.formatDuration
                ? window.Gamify.formatDuration(realSeconds)
                : Math.round(realSeconds / 60) + ' min')
            : '—';
        } catch (e) { /* never let this break the page */ }
      })();
    })();
  </script>
</body>
</html>
