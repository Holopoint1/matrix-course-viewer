<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2358"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0)"/>
      <stop offset="0.5" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Sensor-themed waveform decoration top right -->
  <g transform="translate(0,140)" opacity="0.35">
    <path d="M 0 60 Q 80 0 160 60 T 320 60 T 480 60 T 640 60 T 800 60 T 960 60 T 1120 60 T 1280 60"
          fill="none" stroke="url(#wave)" stroke-width="3"/>
    <path d="M 0 90 Q 60 30 120 90 T 240 90 T 360 90 T 480 90 T 600 90 T 720 90 T 840 90 T 960 90 T 1080 90 T 1200 90 T 1280 90"
          fill="none" stroke="url(#wave)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Sample-point dots bottom left (digital sensor reading style) -->
  <g transform="translate(80,540)" opacity="0.45" fill="#fff">
    <circle cx="0"   cy="0" r="4"/>
    <circle cx="40"  cy="-12" r="4"/>
    <circle cx="80"  cy="-30" r="4"/>
    <circle cx="120" cy="-48" r="4"/>
    <circle cx="160" cy="-40" r="4"/>
    <circle cx="200" cy="-20" r="4"/>
    <circle cx="240" cy="-5"  r="4"/>
    <circle cx="280" cy="-15" r="4"/>
    <circle cx="320" cy="-32" r="4"/>
    <circle cx="360" cy="-25" r="4"/>
    <path d="M 0 0 L 40 -12 L 80 -30 L 120 -48 L 160 -40 L 200 -20 L 240 -5 L 280 -15 L 320 -32 L 360 -25"
          fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  </g>

  <!-- Title block -->
  <g transform="translate(640,300)" text-anchor="middle" font-family="'Segoe UI', Calibri, Arial, sans-serif" fill="#fff">
    <text font-size="44" font-weight="300" opacity="0.7" y="-40">CP1972</text>
    <text font-size="72" font-weight="700" y="40">Sensors and</text>
    <text font-size="72" font-weight="700" y="120">Microcontrollers</text>
    <text font-size="28" font-weight="400" opacity="0.85" y="200">Flowcode &amp; E-blocks 3</text>
  </g>

  <!-- Footer brand -->
  <g transform="translate(640,640)" text-anchor="middle" font-family="'Segoe UI', Calibri, Arial, sans-serif" fill="#fff" opacity="0.6">
    <text font-size="22" font-weight="500" letter-spacing="4">MATRIX TSL</text>
  </g>
</svg>
