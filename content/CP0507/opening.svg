<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2358"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Top-right gear decoration (24-tooth) -->
  <g transform="translate(1100,150)" opacity="0.35" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="3">
    <circle r="74"/>
    <circle r="28"/>
    <g>
      <line x1="0" y1="-90" x2="0" y2="-74"/>
      <line x1="0" y1="74" x2="0" y2="90"/>
      <line x1="-90" y1="0" x2="-74" y2="0"/>
      <line x1="74" y1="0" x2="90" y2="0"/>
      <line x1="-63.6" y1="-63.6" x2="-52.3" y2="-52.3"/>
      <line x1="52.3" y1="52.3" x2="63.6" y2="63.6"/>
      <line x1="-63.6" y1="63.6" x2="-52.3" y2="52.3"/>
      <line x1="52.3" y1="-52.3" x2="63.6" y2="-63.6"/>
    </g>
  </g>

  <!-- Bottom-left motor + rotation arrow decoration -->
  <g transform="translate(160,560)" opacity="0.4" stroke="rgba(255,255,255,0.55)" fill="none" stroke-width="3">
    <!-- motor body -->
    <rect x="-44" y="-26" width="88" height="52" rx="6"/>
    <!-- shaft -->
    <line x1="44" y1="0" x2="84" y2="0"/>
    <line x1="-44" y1="0" x2="-66" y2="0"/>
    <!-- mounting feet -->
    <line x1="-30" y1="26" x2="-30" y2="36"/>
    <line x1="30" y1="26" x2="30" y2="36"/>
    <!-- coil rings on body -->
    <line x1="-20" y1="-26" x2="-20" y2="26" opacity="0.7"/>
    <line x1="0" y1="-26" x2="0" y2="26" opacity="0.7"/>
    <line x1="20" y1="-26" x2="20" y2="26" opacity="0.7"/>
    <!-- rotation arrow above -->
    <g transform="translate(0,-64)">
      <path d="M -30 8 A 28 28 0 1 1 30 8" stroke-linecap="round"/>
      <polygon points="30,8 22,2 24,14" fill="rgba(255,255,255,0.55)" stroke="none"/>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(640,300)" text-anchor="middle" font-family="'Segoe UI', Calibri, Arial, sans-serif" fill="#fff">
    <text font-size="44" font-weight="300" opacity="0.7" y="-40">CP0507</text>
    <text font-size="72" font-weight="700" y="40">Motors and</text>
    <text font-size="72" font-weight="700" y="120">Microcontrollers</text>
    <text font-size="28" font-weight="400" opacity="0.85" y="200">Flowcode &amp; E-blocks 3</text>
  </g>

  <!-- Footer brand -->
  <g transform="translate(640,640)" text-anchor="middle" font-family="'Segoe UI', Calibri, Arial, sans-serif" fill="#fff" opacity="0.6">
    <text font-size="22" font-weight="500" letter-spacing="4">MATRIX TSL</text>
  </g>
</svg>
