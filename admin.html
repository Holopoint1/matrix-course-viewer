<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Admin · CMS | Matrix Course Viewer</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260533">
</head>
<body data-no-sidebar>
  <header class="site-header" id="site-header"></header>

  <!-- Live save status (driven by cms-supabase.js `matrixcms:save` events) -->
  <div id="cms-savebar" aria-live="polite" style="position:fixed;right:14px;bottom:14px;z-index:9999;
       padding:0.5rem 0.9rem;border-radius:999px;font:600 0.82rem/1 'Segoe UI',Arial,sans-serif;
       color:#fff;background:#475569;box-shadow:0 6px 18px -6px rgba(0,0,0,.4);opacity:0;
       transition:opacity .2s ease;pointer-events:none;">Idle</div>

  <!-- Editor (open access — no login yet; logins come later) -->
  <div class="cms-shell" id="cms-shell">
    <aside class="cms-sidebar">
      <div class="cms-side-section">
        <span class="cms-side-eyebrow">Edit</span>
        <h2>Courses</h2>
      </div>
      <ul class="cms-course-list" id="cms-course-list"></ul>
      <div class="cms-side-foot">
        <p class="cms-side-note" style="font-size:0.8rem;color:var(--text-muted);line-height:1.5;margin:0;">
          Edits save <strong>live to the shared database</strong> for everyone — no publish step.
          Download copies any time from <a href="files.html#database">Tools → Database</a>.
        </p>
      </div>
    </aside>

    <main class="cms-main" id="cms-main">
      <p class="stage-loading">Pick a course on the left to start editing&hellip;</p>
    </main>
  </div>

  <script src="assets/chrome.js?v=20260533"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="assets/cms-overrides.js?v=20260533"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js?v=20260533"></script>
  <script src="assets/cms-supabase.js?v=20260533"></script>
  <script>
    (function () {
      'use strict';
      const shellEl = document.getElementById('cms-shell');
      const mainEl = () => document.getElementById('cms-main');

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }
      function showInitError(e) {
        console.error('Admin init failed:', e);
        mainEl().innerHTML = '<p style="color:var(--warn);padding:1rem;">Admin failed to load: ' +
          escapeHtml(e && e.message ? e.message : String(e)) + '</p>';
      }

      /* ---- Live save status pill (proves edits reach Supabase) ---- */
      const bar = document.getElementById('cms-savebar');
      let barHide;
      function setBar(text, color, sticky) {
        bar.textContent = text;
        bar.style.background = color;
        bar.style.opacity = '1';
        clearTimeout(barHide);
        if (!sticky) barHide = setTimeout(() => { bar.style.opacity = '0'; }, 2600);
      }
      window.addEventListener('matrixcms:save', (e) => {
        const d = e.detail || {};
        if (d.ok === null) setBar('Saving…', '#475569', true);
        else if (d.ok === true) setBar('Saved ✓ live to database', '#15803d');
        else if (d.reason === 'not-signed-in') setBar('Saved locally (DB write skipped)', '#a16207');
        else setBar('Save FAILED: ' + (d.error || 'unknown') + ' — not in database', '#b91c1c', true);
      });

      let originalCourses = null;
      let courses = null;

      async function loadAll() {
        const data = await fetch('data/courses.json').then((r) => r.json());
        originalCourses = data;
        courses = data.courses;
      }
      async function init() {
        if (!courses) await loadAll();
        renderCourseList();
      }

      function renderCourseList() {
        const root = document.getElementById('cms-course-list');
        root.innerHTML = courses.map((c) => `
          <li><button type="button" data-course="${escapeHtml(c.id)}" class="cms-course-pick">
            <strong>${escapeHtml(c.code)}</strong>
            <span>${escapeHtml(c.title)}</span>
          </button></li>
        `).join('');
        root.querySelectorAll('button[data-course]').forEach((btn) => {
          btn.addEventListener('click', () => editCourse(btn.dataset.course));
        });
      }

      /* ---------- Course editor ---------- */
      function editCourse(courseId) {
        const original = courses.find((c) => c.id === courseId);
        const merged = window.MatrixCMS.applyOverrides(original);
        const main = mainEl();
        const screensHtml = merged.screens.map((s, i) => screenRow(courseId, original.screens[i], s, i)).join('');
        main.innerHTML = `
          <header class="cms-page-head">
            <span class="cms-page-eyebrow">Editing</span>
            <h1>${escapeHtml(merged.code)} · ${escapeHtml(merged.title)}</h1>
            <p class="cms-page-hint">Every edit saves <strong>live to the shared database</strong> for everyone — instantly, no publish step. Watch the status pill (bottom-right) confirm each save.</p>
          </header>

          <section class="cms-section">
            <div class="cms-section-head">
              <h2 class="cms-section-title">Course details</h2>
              <div class="cms-section-actions">
                <button class="btn btn-primary" data-action="save-course">💾 Save course details</button>
                <span class="cms-saved-hint" data-saved hidden>Saved ✓</span>
              </div>
            </div>
            <div class="cms-grid-2">
              <label>Code
                <input type="text" data-field="code" value="${escapeHtml(merged.code || '')}">
              </label>
              <label>Title
                <input type="text" data-field="title" value="${escapeHtml(merged.title || '')}">
              </label>
              <label class="cms-grid-full">Short description
                <textarea data-field="shortDescription" rows="3">${escapeHtml(merged.shortDescription || '')}</textarea>
              </label>
              <label>Estimated hours
                <input type="number" step="0.1" data-field="estimatedHours" value="${escapeHtml(String(merged.estimatedHours || 0))}">
              </label>
              <label>Certificate enabled
                <select data-field="certificateEnabled">
                  <option value="true" ${merged.certificate && merged.certificate.enabled ? 'selected' : ''}>Yes</option>
                  <option value="false" ${merged.certificate && merged.certificate.enabled ? '' : 'selected'}>No</option>
                </select>
              </label>
            </div>
          </section>

          <section class="cms-section">
            <h2 class="cms-section-title">Screens (${merged.screens.length})</h2>
            <p class="cms-section-hint">The top row of each screen edits its <strong>heading &amp; settings</strong> (title, time, type, file). To change the <strong>actual content learners read</strong> on a Page or Worksheet, use <strong>“✎ Edit this screen's content”</strong> — it opens the real on-screen text with a live preview and saves straight to the database.</p>
            <div class="cms-screens">${screensHtml}</div>
          </section>
        `;

        function applyMeta(input) {
          const field = input.dataset.field;
          const value = input.type === 'number' ? Number(input.value) : input.value;
          if (field === 'certificateEnabled') {
            const orig = original.certificate || { enabled: false };
            window.MatrixCMS.setCourseOverride(courseId, { certificate: Object.assign({}, orig, { enabled: input.value === 'true' }) });
          } else {
            window.MatrixCMS.setCourseOverride(courseId, { [field]: value });
          }
        }
        main.querySelectorAll('[data-field]').forEach((input) => {
          input.addEventListener('input', () => applyMeta(input));
        });
        main.querySelector('[data-action="save-course"]').addEventListener('click', () => {
          main.querySelectorAll('[data-field]').forEach(applyMeta);
          flashSaved(main);
        });

        /* Screen-meta inputs — save live on edit */
        main.querySelectorAll('.cms-screen-row').forEach((row) => {
          const screenId = row.dataset.screenId;
          row.querySelectorAll('[data-screen-field]').forEach((input) => {
            input.addEventListener('input', () => {
              const field = input.dataset.screenField;
              let value;
              if (input.type === 'number') value = Number(input.value);
              else if (input.type === 'checkbox') value = input.checked;
              else value = input.value;
              window.MatrixCMS.setScreenOverride(courseId, screenId, { [field]: value });
            });
          });
          const editBtn = row.querySelector('[data-action="edit-text"]');
          if (editBtn) {
            editBtn.addEventListener('click', () => {
              const sc = merged.screens.find((x) => x.id === screenId);
              openTextEditor(courseId, sc, row);
            });
          }
        });
      }

      function isEditableText(s) {
        return (s.type === 'html' || s.type === 'document') &&
               s.src && !/^https?:/i.test(s.src) && !s.missing;
      }

      function screenRow(courseId, originalScreen, mergedScreen, idx) {
        const types = ['image', 'html', 'youtube', 'pdf', 'document', 'powerpoint', 'spreadsheet'];
        const typeOpts = types.map((t) => `<option value="${t}" ${mergedScreen.type === t ? 'selected' : ''}>${t}</option>`).join('');
        return `
          <div class="cms-screen-row" data-screen-id="${escapeHtml(mergedScreen.id)}">
            <div class="cms-screen-main">
              <span class="cms-screen-num">${idx + 1}</span>
              <input class="cms-screen-title" data-screen-field="title" value="${escapeHtml(mergedScreen.title || '')}" placeholder="Screen title (heading)">
              <select class="cms-screen-type" data-screen-field="type">${typeOpts}</select>
              <input class="cms-screen-hours" data-screen-field="hours" type="number" step="0.1" min="0" value="${escapeHtml(String(mergedScreen.hours || 0))}">
              <input class="cms-screen-src" data-screen-field="src" value="${escapeHtml(mergedScreen.src || '')}" placeholder="path or URL">
              <label class="cms-screen-missing"><input type="checkbox" data-screen-field="missing" ${mergedScreen.missing ? 'checked' : ''}> missing</label>
            </div>
            <div class="cms-screen-actions">
              ${isEditableText(mergedScreen)
                ? `<button type="button" class="btn btn-primary cms-edit-text-btn" data-action="edit-text">✎ Edit this screen's content</button>
                   <span class="cms-screen-actions-hint">The title above is just the heading — this edits the body text learners read on screen ${idx + 1}.</span>`
                : `<span class="cms-screen-noedit">No editable body text — ${escapeHtml(mergedScreen.type)} screen (image / video / PDF / slides are binary or external).</span>`}
            </div>
            <div class="cms-screen-editor" data-editor-for="${escapeHtml(mergedScreen.id)}" hidden></div>
          </div>
        `;
      }

      /* ---------- Per-screen text editor ----------
         Shows EXACTLY what the learner sees: existing DB/override (keyed by
         screen.src), else .html .page/body, else .docx mammoth render.
         Save writes a full HTML doc back under screen.src → that is what
         the viewer (app.js) renders, and cms-supabase pushes it live. */
      async function openTextEditor(courseId, screen, row) {
        const slot = row.querySelector('[data-editor-for="' + cssEscape(screen.id) + '"]');
        if (!slot) return;
        if (!slot.hidden) { slot.hidden = true; slot.innerHTML = ''; return; }
        slot.hidden = false;
        slot.innerHTML = '<p class="stage-loading">Loading current content&hellip;</p>';

        let bodyHtml = '';
        let templateHtml = null;
        try {
          const override = window.MatrixCMS.getHtmlOverride(screen.src);
          if (override != null) {
            templateHtml = override;
            bodyHtml = extractBody(override);
          } else if (screen.type === 'document') {
            const buf = await fetch(screen.src).then((r) => r.arrayBuffer());
            const res = await window.mammoth.convertToHtml({ arrayBuffer: buf });
            bodyHtml = res.value || '';
          } else {
            const txt = await fetch(screen.src).then((r) => r.text());
            templateHtml = txt;
            bodyHtml = extractBody(txt);
          }
        } catch (e) {
          slot.innerHTML = '<p style="color:var(--warn);padding:0.6rem;">Could not load this screen\'s content: ' + escapeHtml(e.message) + '</p>';
          return;
        }

        slot.innerHTML = `
          <div class="cms-text-edit">
            <div class="cms-text-edit-col">
              <label class="cms-html-edit-label">Content (HTML — formatting preserved)</label>
              <textarea class="cms-text-area" rows="16" spellcheck="false">${escapeHtml(bodyHtml.trim())}</textarea>
              <div class="cms-section-actions">
                <button type="button" class="btn btn-ghost" data-act="close">Close</button>
                <button type="button" class="btn btn-primary" data-act="save">💾 Save text</button>
                <span class="cms-saved-hint" data-saved hidden>Saved ✓ — live on the course</span>
              </div>
            </div>
            <div class="cms-text-edit-col">
              <span class="cms-html-edit-label">Live preview</span>
              <iframe class="cms-html-preview" data-preview></iframe>
            </div>
          </div>`;

        const ta = slot.querySelector('.cms-text-area');
        const iframe = slot.querySelector('[data-preview]');
        function previewDoc() {
          return `<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="assets/embedded.css"><style>body{margin:0;padding:1.2rem;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#1c1b30}</style></head><body><div class="page">${ta.value}</div></body></html>`;
        }
        function refreshPreview() {
          const blob = new Blob([previewDoc()], { type: 'text/html' });
          iframe.src = URL.createObjectURL(blob);
        }
        ta.addEventListener('input', refreshPreview);
        refreshPreview();

        slot.querySelector('[data-act="close"]').addEventListener('click', () => {
          slot.hidden = true; slot.innerHTML = '';
        });
        slot.querySelector('[data-act="save"]').addEventListener('click', () => {
          const full = wrapBody(ta.value, templateHtml);
          window.MatrixCMS.setHtmlOverride(screen.src, full);
          flashSaved(slot);
        });
      }

      function cssEscape(s) { return String(s).replace(/"/g, '\\"'); }

      function extractBody(fullHtml) {
        try {
          const doc = new DOMParser().parseFromString(fullHtml, 'text/html');
          const page = doc.querySelector('.page');
          if (page) return page.innerHTML.trim();
          if (doc.body) return doc.body.innerHTML.trim();
        } catch (_) {}
        return fullHtml;
      }
      function wrapBody(bodyHtml, originalFullHtml) {
        if (originalFullHtml) {
          try {
            const doc = new DOMParser().parseFromString(originalFullHtml, 'text/html');
            const page = doc.querySelector('.page');
            if (page) { page.innerHTML = bodyHtml; }
            else if (doc.body) { doc.body.innerHTML = bodyHtml; }
            return '<!DOCTYPE html>' + doc.documentElement.outerHTML;
          } catch (_) {}
        }
        return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="../../assets/embedded.css"></head><body><div class="page">${bodyHtml}</div></body></html>`;
      }

      function flashSaved(root) {
        root.querySelectorAll('[data-saved]').forEach((el) => {
          el.hidden = false;
          clearTimeout(el._t);
          el._t = setTimeout(() => { el.hidden = true; }, 1800);
        });
      }

      /* Open access (Phase: no login). The local engine's unlock flag is
         harmless to set; real logins / Cloudflare Access come later. */
      try { window.MatrixCMS.unlock('matrix'); } catch (_) {}
      init().catch(showInitError);
    })();
  </script>
</body>
</html>
