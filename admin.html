<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Admin · Content Manager | Matrix Course Viewer</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260538">
</head>
<body data-no-sidebar>
  <header class="site-header" id="site-header"></header>

  <main class="am-wrap">
    <section class="am-main" id="am-main">
      <p class="stage-loading">Loading courses&hellip;</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="assets/chrome.js?v=20260538"></script>
  <script src="assets/cms-overrides.js?v=20260538"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js?v=20260538"></script>
  <script src="assets/cms-supabase.js?v=20260538"></script>
  <script>
  (function () {
    'use strict';
    var CMS = window.MatrixCMS;
    try { CMS.unlock('matrix'); } catch (e) {}   /* Phase 1: open access */

    var main = document.getElementById('am-main');
    var courses = null;
    var cur = { courseId: null, screenId: null };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function wrapPage(bodyHtml) {
      return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +
        '<link rel="stylesheet" href="../../assets/embedded.css"></head><body>' +
        '<div class="page">' + bodyHtml + '</div></body></html>';
    }

    /* Screen type → badge class, label, icon, and editability. */
    var TYPES = {
      document:   { cls: 'document', label: 'Worksheet', icon: '📄', word: true,  img: false },
      html:       { cls: 'html',     label: 'Page',      icon: '📝', word: true,  img: false },
      youtube:    { cls: 'youtube',  label: 'Video',     icon: '▶',  word: false, img: false },
      pdf:        { cls: 'pdf',      label: 'PDF',       icon: '📕', word: false, img: false },
      powerpoint: { cls: 'powerpoint', label: 'Slides',  icon: '📊', word: false, img: false },
      image:      { cls: 'image',    label: 'Image',     icon: '🖼', word: false, img: true },
      spreadsheet:{ cls: 'document', label: 'Sheet',     icon: '📈', word: false, img: false }
    };
    function typeOf(t) { return TYPES[t] || { cls: 'document', label: t || 'Screen', icon: '📄', word: false, img: false }; }

    function getCourse(id) { return courses.find(function (c) { return c.id === id; }); }
    function merged(id) {
      var c = getCourse(id);
      return (c && CMS.applyOverrides) ? CMS.applyOverrides(c) : c;
    }
    function isEdited(s) { return !!(s && s.src && CMS.getHtmlOverride(s.src)); }

    /* ========== View 1: catalog — course containers side by side ========== */
    function renderCatalog() {
      cur.courseId = null; cur.screenId = null;
      var tiles = courses.map(function (c) {
        var scr = c.screens || [];
        var edited = scr.filter(function (s) { return isEdited(s); }).length;
        return '<button type="button" class="am-tile" data-course="' + esc(c.id) + '">' +
          '<span class="am-tile-thumb" style="background-image:url(\'content/' + esc(c.id) + '/opening.svg\')">' +
            '<span class="am-tile-code">' + esc(c.code || c.id) + '</span>' +
          '</span>' +
          '<span class="am-tile-body"><strong>' + esc(c.title || c.id) + '</strong>' +
            '<span class="am-tile-meta">' + scr.length + ' screens' +
              (edited ? ' · <em>' + edited + ' edited</em>' : '') + '</span>' +
          '</span></button>';
      }).join('');
      main.innerHTML =
        '<div class="am-head"><span class="am-head-eyebrow">Content manager</span>' +
          '<h1>Courses</h1>' +
          '<p>Pick a course — it opens with the same screen sidebar learners see. Click any screen to preview it, edit it like a document, or replace it with a Word file.</p></div>' +
        '<div class="am-catalog">' + tiles + '</div>';
      main.querySelectorAll('[data-course]').forEach(function (b) {
        b.addEventListener('click', function () { openCourse(b.dataset.course); });
      });
    }

    /* ========== View 2: course open — screen sidebar + content ========== */
    function openCourse(courseId, screenId) {
      cur.courseId = courseId;
      var c = merged(courseId);
      if (!c) { renderCatalog(); return; }
      main.innerHTML =
        '<div class="am-course-shell">' +
          '<aside class="am-side">' +
            '<div class="am-side-head">' +
              '<button type="button" class="am-back" data-back>‹ All courses</button>' +
              '<div class="am-side-code">' + esc(c.code || c.id) + '</div>' +
              '<div class="am-side-title">' + esc(c.title || '') + '</div>' +
            '</div>' +
            '<div class="ms-tier ms-tier-flat am-screenlist" id="am-screenlist"></div>' +
          '</aside>' +
          '<div class="am-content" id="am-content"></div>' +
        '</div>';
      main.querySelector('[data-back]').addEventListener('click', renderCatalog);
      renderScreenList(c);
      if (screenId) openScreen(courseId, screenId);
      else document.getElementById('am-content').innerHTML =
        '<div class="am-empty"><div class="am-empty-ico">👈</div><h1>Pick a screen</h1>' +
        '<p>Choose a screen in the sidebar to preview it as learners see it, edit it like a document, or replace it with a Word file.</p></div>';
    }

    /* Screen list — same visual language as the front-end course sidebar. */
    function renderScreenList(c) {
      var list = document.getElementById('am-screenlist');
      if (!list) return;
      list.innerHTML = (c.screens || []).map(function (s, i) {
        var t = typeOf(s.type);
        return '<a class="ms-ws-item' + (s.id === cur.screenId ? ' active' : '') +
          '" href="#" data-screen="' + esc(s.id) + '">' +
          '<span class="ms-ws-num">' + (i + 1) + '</span>' +
          '<span class="ms-ws-main"><span class="ms-ws-title">' + esc(s.title || '(untitled)') + '</span>' +
            '<span class="ms-ws-type-badge ' + t.cls + '">' + esc(t.label) +
              (isEdited(s) ? ' · edited' : '') + '</span></span></a>';
      }).join('');
      list.querySelectorAll('[data-screen]').forEach(function (a) {
        a.addEventListener('click', function (e) { e.preventDefault(); openScreen(cur.courseId, a.dataset.screen); });
      });
    }

    /* ========== Screen content pane ========== */
    function openScreen(courseId, screenId) {
      cur.screenId = screenId;
      var c = merged(courseId);
      var idx = (c.screens || []).findIndex(function (s) { return s.id === screenId; });
      var s = c.screens[idx];
      var t = typeOf(s.type);
      renderScreenList(c);

      var actions;
      if (t.word) {
        actions = '<div class="am-replace" id="am-zone">' +
          '<div class="am-replace-info"><strong>⤓ Replace with a Word document</strong>' +
          '<span>Drop a <code>.docx</code> here (or click) — its text copies in word-for-word and goes live immediately. Or edit it here like a document.</span></div>' +
          '<input type="file" id="am-file" accept=".docx" hidden>' +
          '<div class="am-replace-actions">' +
            '<button class="btn btn-primary" id="am-upload-btn" type="button">Upload Word file…</button>' +
            '<button class="btn btn-secondary" id="am-edit-btn" type="button">✎ Edit like a document</button>' +
            (s.type === 'document' ? '<a class="btn btn-secondary" id="am-dl-btn" href="' + esc(s.src) + '" download>⤓ Download Word</a>' : '') +
            (isEdited(s) ? '<button class="btn btn-ghost" id="am-revert-btn" type="button">↩ Revert</button>' : '') +
          '</div></div>';
      } else if (t.img) {
        actions = '<div class="am-replace" id="am-zone">' +
          '<div class="am-replace-info"><strong>🖼 Replace this image</strong>' +
          '<span>Drop an image here (or click) — PNG, JPG, GIF, SVG, WebP. It appears on the course straight away.</span></div>' +
          '<input type="file" id="am-imgfile" accept="image/*" hidden>' +
          '<div class="am-replace-actions">' +
            '<button class="btn btn-primary" id="am-img-btn" type="button">Upload image…</button>' +
            (isEdited(s) ? '<button class="btn btn-ghost" id="am-revert-btn" type="button">↩ Revert</button>' : '') +
          '</div></div>';
      } else {
        actions = '<div class="am-replace am-replace-readonly"><div class="am-replace-info">' +
          '<strong>' + t.icon + ' ' + esc(t.label) + ' screen</strong>' +
          '<span>This is ' + (s.type === 'youtube' ? 'a video' : 'a ' + esc(t.label).toLowerCase()) +
          ' — managed by its link / file path below.</span></div>' +
          '<code class="am-src">' + esc(s.src || '') + '</code></div>';
      }

      var pane = document.getElementById('am-content');
      pane.innerHTML =
        '<div class="am-screen-head"><span class="am-screen-ico">' + t.icon + '</span>' +
          '<div class="am-screen-headbody"><span class="am-screen-eyebrow">Screen ' + (idx + 1) + ' · ' + esc(t.label) + '</span>' +
            '<input class="am-screen-title" id="am-title" value="' + esc(s.title || '') + '"></div>' +
          '<a class="btn btn-secondary" href="course.html?id=' + esc(courseId) + '&screen=' + esc(s.id) + '" target="_blank" rel="noopener">↗ Open in course</a>' +
        '</div>' + actions +
        '<div class="am-status" id="am-status" hidden></div>' +
        '<div id="am-editor-host"></div>' +
        '<div class="am-preview-wrap"><div class="am-preview-label">Preview — exactly as learners see it</div>' +
          '<div class="am-preview" id="am-preview"><p class="stage-loading">Rendering&hellip;</p></div></div>';

      document.getElementById('am-title').addEventListener('change', function () {
        CMS.setScreenOverride(courseId, s.id, { title: this.value.trim() });
        flash('Title saved — live on the course.');
        renderScreenList(merged(courseId));
      });

      if (t.word) {
        var fileInput = document.getElementById('am-file');
        document.getElementById('am-upload-btn').addEventListener('click', function () { fileInput.click(); });
        fileInput.addEventListener('change', function () { if (fileInput.files[0]) uploadWord(fileInput.files[0], courseId, s); });
        document.getElementById('am-edit-btn').addEventListener('click', function () { openEditor(courseId, s); });
        wireDrop('am-zone', /\.docx$/i, function (f) { uploadWord(f, courseId, s); });
      } else if (t.img) {
        var imgInput = document.getElementById('am-imgfile');
        document.getElementById('am-img-btn').addEventListener('click', function () { imgInput.click(); });
        imgInput.addEventListener('change', function () { if (imgInput.files[0]) uploadImage(imgInput.files[0], courseId, s); });
        wireDrop('am-zone', /^image\//i, function (f) { uploadImage(f, courseId, s); }, true);
      }
      var rev = document.getElementById('am-revert-btn');
      if (rev) rev.addEventListener('click', function () { revert(courseId, s); });

      renderPreview(s, document.getElementById('am-preview'));
    }

    function wireDrop(id, accept, onFile, byMime) {
      var dz = document.getElementById(id);
      if (!dz) return;
      ['dragenter', 'dragover'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
      });
      dz.addEventListener('drop', function (e) {
        var f = e.dataTransfer && e.dataTransfer.files[0];
        if (f && accept.test(byMime ? f.type : f.name)) onFile(f);
        else if (f) flash('That file type is not accepted here.', 'err');
      });
    }

    function flash(msg, kind) {
      var el = document.getElementById('am-status');
      if (!el) return;
      el.hidden = false;
      el.className = 'am-status' + (kind ? ' ' + kind : ' ok');
      el.textContent = msg;
      clearTimeout(el._t);
      if (!kind || kind === 'ok') el._t = setTimeout(function () { el.hidden = true; }, 3500);
    }

    /* ---------- Preview — render as the front end shows it ---------- */
    async function renderPreview(s, box) {
      try {
        var ov = CMS.getHtmlOverride(s.src);
        if (s.type === 'document' || s.type === 'html') {
          var html;
          if (ov != null) html = bodyOf(ov);
          else if (s.type === 'document') {
            var buf = await fetch(s.src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
            html = (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
          } else {
            html = bodyOf(await fetch(s.src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }));
          }
          box.innerHTML = '<div class="stage-doc"><div class="stage-doc-inner">' + enhance(html) + '</div></div>';
        } else if (s.type === 'image') {
          var src = (ov && /^data:image\//.test(ov)) ? ov : s.src;
          box.innerHTML = '<div class="am-preview-img"><img src="' + esc(src) + '" alt="' + esc(s.title) + '"></div>';
        } else if (s.type === 'youtube') {
          var m = String(s.src || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/);
          box.innerHTML = m ? '<div class="inline-youtube"><iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen></iframe></div>'
                            : '<p class="stage-loading">Video: ' + esc(s.src) + '</p>';
        } else if (s.type === 'pdf') {
          box.innerHTML = '<iframe class="am-preview-frame" src="' + esc(s.src) + '"></iframe>';
        } else {
          box.innerHTML = '<p class="stage-loading">' + esc(typeOf(s.type).label) + ' — <a href="' + esc(s.src) + '" target="_blank" rel="noopener">open / download</a></p>';
        }
      } catch (err) {
        box.innerHTML = '<p class="stage-loading" style="color:var(--warn)">Could not render this screen: ' + esc(err.message) + '</p>';
      }
    }
    function bodyOf(fullHtml) {
      try {
        var d = new DOMParser().parseFromString(fullHtml, 'text/html');
        var page = d.querySelector('.page');
        if (page) return page.innerHTML;
        if (d.body) return d.body.innerHTML;
      } catch (e) {}
      return fullHtml;
    }
    function enhance(html) {
      try {
        var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
        d.body.querySelectorAll('a').forEach(function (a) {
          var m = (a.getAttribute('href') || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/);
          if (!m) return;
          var w = d.createElement('div');
          w.className = 'inline-youtube';
          w.innerHTML = '<iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen loading="lazy"></iframe>';
          a.replaceWith(w);
        });
        return d.body.innerHTML;
      } catch (e) { return html; }
    }

    /* ---------- Word upload → deterministic mammoth convert → save ---------- */
    async function uploadWord(file, courseId, s) {
      if (!/\.docx$/i.test(file.name)) { flash('Please choose a Word .docx file.', 'err'); return; }
      flash('Reading “' + file.name + '” and copying the text in word-for-word…');
      try {
        var buf = await file.arrayBuffer();
        var bodyHtml = (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
        if (!bodyHtml.trim()) { flash('That document looks empty — nothing to import.', 'err'); return; }
        CMS.setHtmlOverride(s.src, wrapPage(bodyHtml));
        flash('✓ Saved from “' + file.name + '” — live on the course now.');
        openScreen(courseId, s.id);
      } catch (err) {
        flash('Could not import that document: ' + (err && err.message ? err.message : err), 'err');
      }
    }

    /* ---------- Image upload → data URI → save ---------- */
    function uploadImage(file, courseId, s) {
      if (!/^image\//i.test(file.type)) { flash('Please choose an image file.', 'err'); return; }
      flash('Reading “' + file.name + '”…');
      var fr = new FileReader();
      fr.onload = function () {
        CMS.setHtmlOverride(s.src, String(fr.result));   /* data: URI */
        flash('✓ Image updated — live on the course now.');
        openScreen(courseId, s.id);
      };
      fr.onerror = function () { flash('Could not read that image.', 'err'); };
      fr.readAsDataURL(file);
    }

    /* ---------- WYSIWYG editor — looks like a Word page, no raw HTML ------ */
    var TOOLBAR = [
      ['bold', '<b>B</b>', 'Bold'], ['italic', '<i>I</i>', 'Italic'], ['underline', '<u>U</u>', 'Underline'],
      ['sep'],
      ['h2', 'H1', 'Big heading'], ['h3', 'H2', 'Sub-heading'], ['p', '¶', 'Normal text'],
      ['sep'],
      ['ul', '• List', 'Bulleted list'], ['ol', '1. List', 'Numbered list'],
      ['sep'],
      ['link', '🔗 Link', 'Insert a link'], ['image', '🖼 Image', 'Insert an image'],
      ['sep'],
      ['clear', '✗ Clear', 'Clear formatting']
    ];
    async function openEditor(courseId, s) {
      var host = document.getElementById('am-editor-host');
      if (host.dataset.open === '1') { host.dataset.open = '0'; host.innerHTML = ''; return; }
      host.dataset.open = '1';
      host.innerHTML = '<div class="am-editor"><p class="stage-loading" style="padding:1rem">Loading…</p></div>';

      var bodyHtml = '';
      try {
        var ov = CMS.getHtmlOverride(s.src);
        if (ov != null) bodyHtml = bodyOf(ov);
        else if (s.type === 'document') {
          var buf = await fetch(s.src).then(function (r) { return r.arrayBuffer(); });
          bodyHtml = (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
        } else {
          bodyHtml = bodyOf(await fetch(s.src).then(function (r) { return r.text(); }));
        }
      } catch (e) { bodyHtml = '<p>(could not load current text)</p>'; }

      var tb = TOOLBAR.map(function (b) {
        if (b[0] === 'sep') return '<span class="am-tool-sep"></span>';
        return '<button type="button" class="am-tool-btn" data-cmd="' + b[0] + '" title="' + b[2] + '">' + b[1] + '</button>';
      }).join('');
      host.innerHTML =
        '<div class="am-editor">' +
          '<div class="am-toolbar">' + tb + '</div>' +
          '<div class="am-doc" id="am-doc" contenteditable="true"></div>' +
          '<div class="am-editor-actions">' +
            '<button class="btn btn-ghost" id="am-ed-close" type="button">Close</button>' +
            '<button class="btn btn-primary" id="am-ed-save" type="button">💾 Save</button>' +
          '</div>' +
        '</div>' +
        '<input type="file" id="am-ed-img" accept="image/*" hidden>';
      var doc = document.getElementById('am-doc');
      doc.innerHTML = enhance(bodyHtml);

      /* Toolbar — mousedown preventDefault keeps the caret in the editor. */
      host.querySelectorAll('.am-tool-btn').forEach(function (btn) {
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btn.addEventListener('click', function () {
          doc.focus();
          var cmd = btn.dataset.cmd;
          if (cmd === 'bold' || cmd === 'italic' || cmd === 'underline') document.execCommand(cmd, false, null);
          else if (cmd === 'h2') document.execCommand('formatBlock', false, 'h1');
          else if (cmd === 'h3') document.execCommand('formatBlock', false, 'h2');
          else if (cmd === 'p') document.execCommand('formatBlock', false, 'p');
          else if (cmd === 'ul') document.execCommand('insertUnorderedList', false, null);
          else if (cmd === 'ol') document.execCommand('insertOrderedList', false, null);
          else if (cmd === 'clear') document.execCommand('removeFormat', false, null);
          else if (cmd === 'link') {
            var url = prompt('Link address (https://…):', 'https://');
            if (url) document.execCommand('createLink', false, url);
          } else if (cmd === 'image') {
            document.getElementById('am-ed-img').click();
          }
        });
      });
      document.getElementById('am-ed-img').addEventListener('change', function (e) {
        var f = e.target.files[0];
        if (!f) return;
        var fr = new FileReader();
        fr.onload = function () { doc.focus(); document.execCommand('insertImage', false, String(fr.result)); };
        fr.readAsDataURL(f);
        e.target.value = '';
      });
      document.getElementById('am-ed-close').addEventListener('click', function () { host.dataset.open = '0'; host.innerHTML = ''; });
      document.getElementById('am-ed-save').addEventListener('click', function () {
        CMS.setHtmlOverride(s.src, wrapPage(doc.innerHTML));
        flash('✓ Saved — live on the course now.');
        host.dataset.open = '0'; host.innerHTML = '';
        openScreen(courseId, s.id);
      });
    }

    /* ---------- Revert ---------- */
    function revert(courseId, s) {
      if (!confirm('Discard the edit for this screen and restore the original content?')) return;
      try {
        var all = JSON.parse(localStorage.getItem('matrix-lms:cms:html') || '{}');
        delete all[s.src];
        localStorage.setItem('matrix-lms:cms:html', JSON.stringify(all));
      } catch (e) {}
      try { if (CMS.supabaseClient) CMS.supabaseClient.from('pages').delete().eq('path', s.src); } catch (e) {}
      flash('Reverted to the original content.');
      openScreen(courseId, s.id);
    }

    /* ---------- Boot ---------- */
    fetch('data/courses.json').then(function (r) { return r.json(); }).then(function (data) {
      courses = data.courses || [];
      renderCatalog();
    }).catch(function (err) {
      main.innerHTML = '<p class="stage-loading">Could not load courses: ' + esc(err.message) + '</p>';
    });
  })();
  </script>
</body>
</html>
