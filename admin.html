<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Admin · Content Manager | Matrix Course Viewer</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260556">
</head>
<body data-no-sidebar>
  <header class="site-header" id="site-header"></header>

  <main class="am-wrap">
    <section class="am-main" id="am-main">
      <p class="stage-loading">Loading courses&hellip;</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="assets/chrome.js?v=20260556"></script>
  <script src="assets/cms-overrides.js?v=20260556"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js?v=20260556"></script>
  <script src="assets/cms-supabase.js?v=20260556"></script>
  <script>
  (function () {
    'use strict';
    var CMS = window.MatrixCMS;
    try { CMS.unlock('matrix'); } catch (e) {}   /* Phase 1: open access */

    var main = document.getElementById('am-main');
    var courses = null;
    var cur = { courseId: null, screenId: null };
    var editTimes = {};                /* screen src -> ISO time of its last content edit */
    var editTimesReady = Promise.resolve();
    var courseEditTimes = {};          /* course id -> ISO time of latest edit anywhere in the course */

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function safeName(s) { return String(s || 'untitled').replace(/[^\w .()-]+/g, '_').trim().slice(0, 70) || 'untitled'; }
    function pad2(n) { return ('0' + n).slice(-2); }
    function norm(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase(); }
    function wrapPage(bodyHtml) {
      return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +
        '<link rel="stylesheet" href="../../assets/embedded.css"></head><body>' +
        '<div class="page">' + bodyHtml + '</div></body></html>';
    }
    /* A full HTML document — the body Word converts inside the .docx. */
    function fullHtmlDoc(bodyHtml, title) {
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title || '') + '</title>' +
        '<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.4;}' +
        'h1{font-size:16pt;}h2{font-size:13pt;}h3{font-size:12pt;}' +
        'table{border-collapse:collapse;}td,th{border:1px solid #999;padding:4px;}' +
        'img{max-width:100%;height:auto;}</style></head><body>' +
        String(bodyHtml || '') + '</body></html>';
    }
    /* Build a REAL .docx (OOXML) — a minimal Word package whose body is one
       altChunk pointing at the embedded HTML. Word converts it to native
       content on open AND saves it back as a clean .docx, so the
       download → edit-in-Word → re-upload round trip works. (Ported from
       the Tools-page Word builder.) */
    function htmlToDocxBlob(html) {
      var z = new JSZip();
      z.file('[Content_Types].xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
        '<Override PartName="/word/afchunk.html" ContentType="text/html"/>' +
        '</Types>');
      z.file('_rels/.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
        '</Relationships>');
      z.file('word/document.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
        'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<w:body><w:altChunk r:id="htmlChunk"/>' +
        '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
        '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr>' +
        '</w:body></w:document>');
      z.file('word/_rels/document.xml.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="htmlChunk" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/aFChunk" Target="afchunk.html"/>' +
        '</Relationships>');
      z.file('word/afchunk.html', String(html || ''));
      return z.generateAsync({
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      });
    }
    function download(blob, name) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }

    var TYPES = {
      document:   { cls: 'document', label: 'Worksheet', icon: '📄', word: true,  img: false },
      html:       { cls: 'html',     label: 'Page',      icon: '📝', word: true,  img: false },
      youtube:    { cls: 'youtube',  label: 'Video',     icon: '▶',  word: false, img: false },
      pdf:        { cls: 'pdf',      label: 'PDF',       icon: '📕', word: false, img: false },
      powerpoint: { cls: 'powerpoint', label: 'Slides',  icon: '📊', word: false, img: false },
      image:      { cls: 'image',    label: 'Image',     icon: '🖼', word: false, img: true },
      spreadsheet:{ cls: 'document', label: 'Sheet',     icon: '📈', word: false, img: false }
    };
    function typeOf(t) { return TYPES[t] || { cls: 'document', label: t || 'Screen', icon: '📄', word: false, img: false }; }

    function getCourse(id) { return courses.find(function (c) { return c.id === id; }); }
    function merged(id) {
      var c = getCourse(id);
      return (c && CMS.applyOverrides) ? CMS.applyOverrides(c) : c;
    }
    function isEdited(s) { return !!(s && s.src && CMS.getHtmlOverride(s.src)); }

    function bodyOf(fullHtml) {
      try {
        var d = new DOMParser().parseFromString(fullHtml, 'text/html');
        var page = d.querySelector('.page');
        if (page) return page.innerHTML;
        if (d.body) return d.body.innerHTML;
      } catch (e) {}
      return fullHtml;
    }
    function enhance(html) {
      try {
        var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
        d.body.querySelectorAll('a').forEach(function (a) {
          var m = (a.getAttribute('href') || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/);
          if (!m) return;
          var w = d.createElement('div');
          w.className = 'inline-youtube';
          w.innerHTML = '<iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen loading="lazy"></iframe>';
          a.replaceWith(w);
        });
        return d.body.innerHTML;
      } catch (e) { return html; }
    }

    /* Current body HTML of a screen — admin edit wins, else the source file. */
    async function getScreenBody(s) {
      var ov = CMS.getHtmlOverride(s.src);
      if (ov != null) {
        if (/^data:image\//i.test(ov)) return '<p><img src="' + ov + '" alt="' + esc(s.title) + '"></p>';
        return bodyOf(ov);
      }
      if (s.type === 'document') {
        var buf = await fetch(s.src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
        return (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
      }
      if (s.type === 'html') {
        return bodyOf(await fetch(s.src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }));
      }
      return '';
    }

    /* Read an uploaded file → body HTML. Sniffs the actual CONTENT, not
       the extension — so a .docx works even if mis-named, and an old
       binary .doc gets a clear, actionable error instead of garbage.
       No AI: .docx is read verbatim by mammoth, HTML is parsed as-is. */
    async function fileToHtml(file) {
      var buf = await file.arrayBuffer();
      var b = new Uint8Array(buf);
      /* "PK" — a ZIP, i.e. a real .docx — read verbatim with mammoth. */
      if (b[0] === 0x50 && b[1] === 0x4B) {
        return (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
      }
      /* OLE2 magic — an old binary .doc that mammoth cannot read. */
      if (b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0) {
        throw new Error('That is an old-format Word .doc. In Word choose ' +
          'File ▸ Save As and pick “Word Document (.docx)”, then upload that .docx.');
      }
      /* Otherwise treat it as HTML / text (our exports, .htm pages). */
      return bodyOf(new TextDecoder('utf-8').decode(buf));
    }

    /* Strip the "Screen N:" prefix our course downloads put on each
       screen heading, so a downloaded course re-uploads and matches. */
    function stripScreenPrefix(title) {
      return String(title || '').replace(/^\s*screen\s*\d+\s*[:.\-–—]\s*/i, '').trim();
    }
    /* The number from a "Screen N:" heading, or null. This is the most
       reliable matcher — it survives the title text being renamed. */
    function screenNumberOf(title) {
      var m = String(title || '').match(/^\s*screen\s*(\d+)\s*[:.\-–—]/i);
      return m ? parseInt(m[1], 10) : null;
    }
    /* First embedded picture (a data: URI) inside a chunk of HTML —
       used to populate image screens from a section of an uploaded doc. */
    function firstImageData(html) {
      try {
        var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
        var img = d.body.querySelector('img');
        var src = img && img.getAttribute('src');
        return (src && /^data:image\//i.test(src)) ? src : null;
      } catch (e) { return null; }
    }
    /* The image a screen currently shows — an admin override wins. */
    function imageSrcOf(s) {
      var ov = CMS.getHtmlOverride(s.src);
      return (ov && /^data:image\//i.test(ov)) ? ov : s.src;
    }
    /* Fetch any URL and return it as a base64 data: URI, so a picture
       can be embedded directly inside a downloaded Word document. */
    async function toDataUri(url) {
      try {
        var blob = await fetch(url).then(function (r) { if (!r.ok) throw new Error('x'); return r.blob(); });
        return await new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () { res(String(fr.result)); };
          fr.onerror = function () { res(null); };
          fr.readAsDataURL(blob);
        });
      } catch (e) { return null; }
    }

    /* Give a screen's HTML exactly ONE title heading. If the content
       already opens with a heading that just repeats the screen title,
       that heading is REUSED (its text becomes headingText) — so the
       title never appears twice. Otherwise headingText is added as a
       new heading on top. */
    function markScreen(html, headingText, title) {
      try {
        var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
        var first = d.body.firstElementChild;
        while (first && !(first.textContent || '').trim() && !first.querySelector('img')) {
          first = first.nextElementSibling;
        }
        if (first && /^H[1-6]$/.test(first.tagName) && norm(first.textContent) === norm(title)) {
          first.textContent = headingText;
        } else {
          var h = d.createElement('h1');
          h.textContent = headingText;
          d.body.insertBefore(h, d.body.firstChild);
        }
        return d.body.innerHTML;
      } catch (e) {
        return '<h1>' + esc(headingText) + '</h1>' + html;
      }
    }

    /* ---- Edit-time tracking (file manager + per-screen info) ---- */
    function fmtTime(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
      return d.getDate() + ' ' + mon + ' ' + d.getFullYear() + ', ' +
        ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    /* Pull each edited screen's last-edit timestamp from Supabase — the
       pages table has a touch_updated_at trigger, so updated_at is the
       true last-edit time. Unedited screens simply aren't in the table. */
    async function loadEditTimes(c) {
      editTimes = {};
      if (!CMS.supabaseClient || !c) return;
      try {
        var srcs = (c.screens || []).map(function (s) { return s.src; }).filter(Boolean);
        if (!srcs.length) return;
        var res = await CMS.supabaseClient.from('pages').select('path,updated_at').in('path', srcs);
        (res.data || []).forEach(function (r) { if (r && r.path) editTimes[r.path] = r.updated_at; });
      } catch (e) {}
    }
    function editTextPlain(s) {
      var iso = s && editTimes[s.src];
      if (iso) return fmtTime(iso);
      if (isEdited(s)) return 'Edited';
      return 'Original — not yet edited';
    }
    function hoursText(s) {
      return (s && s.hours != null && s.hours !== '') ? String(s.hours) : '—';
    }
    /* Thumbnail for a course tile — admin upload (saved as a pages row
       at the synthetic path cms-thumbnail/<courseId>) wins; otherwise
       fall back to the legacy content/<id>/opening.svg image. */
    function thumbnailFor(c) {
      var ov = CMS.getHtmlOverride && CMS.getHtmlOverride('cms-thumbnail/' + c.id);
      if (ov && /^data:image\//i.test(ov)) return ov;
      return 'content/' + c.id + '/opening.svg';
    }
    /* When was THIS course last edited anywhere — its own row, any of
       its screens' rows, or any of its pages' content rows. Aggregated
       once on the catalog and painted onto each tile. */
    async function loadCourseEditTimes() {
      courseEditTimes = {};
      if (!CMS.supabaseClient) return;
      try {
        var res = await Promise.all([
          CMS.supabaseClient.from('courses').select('id,updated_at'),
          CMS.supabaseClient.from('screens').select('course_id,src,updated_at'),
          CMS.supabaseClient.from('pages').select('path,updated_at')
        ]);
        function bump(id, t) {
          if (!id || !t) return;
          if (!courseEditTimes[id] || t > courseEditTimes[id]) courseEditTimes[id] = t;
        }
        (res[0].data || []).forEach(function (r) { bump(r.id, r.updated_at); });
        var srcToCourse = {};
        (res[1].data || []).forEach(function (r) {
          if (r && r.src) srcToCourse[r.src] = r.course_id;
          bump(r && r.course_id, r && r.updated_at);
        });
        (res[2].data || []).forEach(function (r) { bump(srcToCourse[r && r.path], r && r.updated_at); });
      } catch (e) {}
    }
    function repaintCatalogTimes() {
      document.querySelectorAll('.am-tile[data-course]').forEach(function (b) {
        var span = b.querySelector('.am-tile-edited');
        if (!span) return;
        var iso = courseEditTimes[b.dataset.course];
        span.textContent = iso ? ('Last edited ' + fmtTime(iso)) : '';
      });
    }

    /* ========== URL routing ==========
       Each view has its own address, so a refresh, a bookmark or a
       shared link reopens exactly where you were:
         admin.html                          → catalog
         admin.html?course=CO0001            → that course
         admin.html?course=CO0001&screen=s3  → that screen
       mode: 'push' = new history entry (Back works), 'replace' =
       update in place, 'none' = don't touch history (popstate). */
    function buildUrl(courseId, screenId) {
      var u = location.pathname.split('/').pop() || 'admin.html';
      if (courseId) {
        u += '?course=' + encodeURIComponent(courseId);
        if (screenId) u += '&screen=' + encodeURIComponent(screenId);
      }
      return u;
    }
    function setUrl(courseId, screenId, mode) {
      if (mode === 'none') return;
      var url = buildUrl(courseId, screenId);
      var here = (location.pathname.split('/').pop() || 'admin.html') + location.search;
      var st = { courseId: courseId || null, screenId: screenId || null };
      try {
        if (mode === 'push' && url !== here) history.pushState(st, '', url);
        else history.replaceState(st, '', url);
      } catch (e) {}
    }
    function routeFromUrl(mode) {
      if (!courses) return;
      var p = new URLSearchParams(location.search);
      var courseId = p.get('course');
      var screenId = p.get('screen');
      if (courseId && getCourse(courseId)) openCourse(courseId, screenId || null, mode);
      else renderCatalog(mode);
    }

    /* ========== View 1: catalog ========== */
    function renderCatalog(mode) {
      cur.courseId = null; cur.screenId = null;
      document.body.classList.remove('am-course-mode');
      var tiles = courses.map(function (c) {
        var scr = c.screens || [];
        var edited = scr.filter(function (s) { return isEdited(s); }).length;
        return '<button type="button" class="am-tile" data-course="' + esc(c.id) + '">' +
          '<span class="am-tile-thumb" style="background-image:url(\'' + esc(thumbnailFor(c)) + '\')">' +
            '<span class="am-tile-code">' + esc(c.code || c.id) + '</span></span>' +
          '<span class="am-tile-body"><strong>' + esc(c.title || c.id) + '</strong>' +
            '<span class="am-tile-meta">' + scr.length + ' screens' +
              (edited ? ' · <em>' + edited + ' edited</em>' : '') + '</span>' +
            '<span class="am-tile-edited"></span></span></button>';
      }).join('');
      tiles += '<button type="button" class="am-tile am-tile-new" id="am-tile-new">' +
        '<span class="am-tile-new-icon">＋</span>' +
        '<span class="am-tile-new-text">New course</span></button>';
      main.innerHTML =
        '<div class="am-head"><span class="am-head-eyebrow">Content manager</span><h1>Courses</h1>' +
          '<p>Pick a course to edit, or click <strong>＋ New course</strong> to start a fresh one.</p></div>' +
        '<div class="am-catalog">' + tiles + '</div>';
      main.querySelectorAll('[data-course]').forEach(function (b) {
        b.addEventListener('click', function () { openCourse(b.dataset.course); });
      });
      var nt = document.getElementById('am-tile-new');
      if (nt) nt.addEventListener('click', renderNewCourseForm);
      setUrl(null, null, mode || 'push');
      /* Paint cached times now (if any), then refresh from Supabase. */
      repaintCatalogTimes();
      loadCourseEditTimes().then(repaintCatalogTimes);
    }

    /* ========== New course form ========== */
    function renderNewCourseForm() {
      cur.courseId = null; cur.screenId = null;
      document.body.classList.remove('am-course-mode');
      var suggested = 'NEW001';
      for (var n = 1; n < 999; n++) {
        var trial = 'NEW' + ('00' + n).slice(-3);
        if (!courses.some(function (x) { return x.id === trial; })) { suggested = trial; break; }
      }
      main.innerHTML =
        '<div class="am-head"><span class="am-head-eyebrow">Add a course</span><h1>New course</h1>' +
        '<p>Create a brand-new course. Once it&rsquo;s created, open it and add screens — either one by one, or by uploading a Word document.</p></div>' +
        '<form class="am-newcourse" id="am-newcourse-form">' +
          '<label><span>Course code</span><input id="am-nc-code" required value="' +
            esc(suggested) + '" pattern="[A-Za-z0-9_-]+"></label>' +
          '<label><span>Title</span><input id="am-nc-title" required ' +
            'placeholder="e.g. Introduction to Microcontrollers"></label>' +
          '<label><span>Short description</span><textarea id="am-nc-desc" rows="3" ' +
            'placeholder="What is the course about?"></textarea></label>' +
          '<label><span>Estimated hours</span><input id="am-nc-hours" type="number" min="0" step="0.5" ' +
            'placeholder="e.g. 4.5"></label>' +
          '<label class="am-nc-check"><input type="checkbox" id="am-nc-cert"> ' +
            '<span>Award a certificate when learners complete the course</span></label>' +
          '<div class="am-nc-actions">' +
            '<button type="button" class="btn btn-ghost" id="am-nc-cancel">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Create course</button>' +
          '</div></form>';
      document.getElementById('am-nc-cancel').addEventListener('click', function () { renderCatalog('replace'); });
      document.getElementById('am-newcourse-form').addEventListener('submit', function (e) {
        e.preventDefault();
        createNewCourse();
      });
      setUrl(null, null, 'replace');
    }
    function createNewCourse() {
      var code = document.getElementById('am-nc-code').value.trim();
      var title = document.getElementById('am-nc-title').value.trim();
      if (!code || !title) return;
      if (courses.some(function (c) { return c.id === code; })) {
        alert('A course with code "' + code + '" already exists. Choose a different code.');
        return;
      }
      var desc = document.getElementById('am-nc-desc').value.trim();
      var hoursRaw = document.getElementById('am-nc-hours').value;
      var hours = hoursRaw === '' ? undefined : parseFloat(hoursRaw);
      var cert = document.getElementById('am-nc-cert').checked;
      /* Stub locally so openCourse can find it right away. */
      courses.push({ id: code, code: code, title: title, screens: [] });
      /* Also stash in the discovery cache so it survives a reload
         even if the Supabase pull hasn't completed yet. */
      try {
        var key = 'matrix-lms:db-courses';
        var arr = JSON.parse(localStorage.getItem(key) || '[]');
        if (!arr.some(function (x) { return x && x.id === code; })) {
          arr.push({ id: code, code: code, kind: 'course', title: title,
            shortDescription: desc || '', estimatedHours: isNaN(hours) ? 0 : hours,
            certificate: { enabled: !!cert }, categories: [], screens: [] });
          localStorage.setItem(key, JSON.stringify(arr));
        }
      } catch (e) {}
      var patch = { title: title, code: code, certificate: { enabled: !!cert } };
      if (desc) patch.shortDescription = desc;
      if (hours !== undefined && !isNaN(hours)) patch.estimatedHours = hours;
      CMS.setCourseOverride(code, patch);
      openCourse(code, null, 'push');
    }

    /* ========== View 2: course open ========== */
    function openCourse(courseId, screenId, mode) {
      cur.courseId = courseId;
      var c = merged(courseId);
      if (!c) { renderCatalog('replace'); return; }
      document.body.classList.add('am-course-mode');
      main.innerHTML =
        '<div class="am-course-shell">' +
          '<aside class="am-side">' +
            '<div class="am-side-head">' +
              '<button type="button" class="am-back" data-back>‹ All courses</button>' +
              '<div class="am-side-code">' + esc(c.code || c.id) + '</div>' +
              '<div class="am-side-title">' + esc(c.title || '') + '</div>' +
              '<div class="am-side-actions">' +
                '<button type="button" class="am-side-act" id="am-fm-btn">📁 File manager</button>' +
                '<button type="button" class="am-side-act" id="am-thumb-btn">🖼 Change thumbnail</button>' +
                '<input type="file" id="am-thumb-file" accept="image/*" hidden>' +
                '<button type="button" class="am-side-act" id="am-dl-course">⤓ Download whole course</button>' +
                '<button type="button" class="am-side-act" id="am-ul-course">⤴ Upload whole course</button>' +
                '<input type="file" id="am-course-file" accept=".docx,.doc,.htm,.html" hidden>' +
              '</div>' +
            '</div>' +
            '<div class="ms-tier ms-tier-flat am-screenlist" id="am-screenlist"></div>' +
          '</aside>' +
          '<div class="am-content" id="am-content"></div>' +
        '</div>';
      main.querySelector('[data-back]').addEventListener('click', function () { renderCatalog('push'); });
      document.getElementById('am-fm-btn').addEventListener('click', function () { showFileManager(courseId); });
      var thumbFile = document.getElementById('am-thumb-file');
      document.getElementById('am-thumb-btn').addEventListener('click', function () { thumbFile.click(); });
      thumbFile.addEventListener('change', function () {
        var f = thumbFile.files[0]; if (!f) return;
        var fr = new FileReader();
        fr.onload = function () {
          CMS.setHtmlOverride('cms-thumbnail/' + courseId, String(fr.result));
          alert('Thumbnail updated — it will appear on the catalog.');
        };
        fr.readAsDataURL(f); thumbFile.value = '';
      });
      document.getElementById('am-dl-course').addEventListener('click', function () { downloadCourse(courseId); });
      var cf = document.getElementById('am-course-file');
      document.getElementById('am-ul-course').addEventListener('click', function () { cf.click(); });
      cf.addEventListener('change', function () { if (cf.files[0]) uploadCourse(cf.files[0], courseId); });
      editTimesReady = loadEditTimes(c);
      renderScreenList(c);
      if (screenId && (c.screens || []).some(function (x) { return x.id === screenId; })) {
        openScreen(courseId, screenId, mode);
      } else {
        setUrl(courseId, null, mode || 'push');
        document.getElementById('am-content').innerHTML =
          '<div class="am-empty"><div class="am-empty-ico">👈</div><h1>Pick a screen</h1>' +
          '<p>Choose a screen in the sidebar to preview it, edit it like a document, or replace it with a Word file. Or download / upload the whole course at once.</p></div>';
      }
    }

    function renderScreenList(c) {
      var list = document.getElementById('am-screenlist');
      if (!list) return;
      list.innerHTML = (c.screens || []).map(function (s, i) {
        var t = typeOf(s.type);
        return '<a class="ms-ws-item' + (s.id === cur.screenId ? ' active' : '') +
          '" href="#" data-screen="' + esc(s.id) + '">' +
          '<span class="ms-ws-num">' + (i + 1) + '</span>' +
          '<span class="ms-ws-main"><span class="ms-ws-title">' + esc(s.title || '(untitled)') + '</span>' +
            '<span class="ms-ws-type-badge ' + t.cls + '">' + esc(t.label) +
              (isEdited(s) ? ' · edited' : '') + '</span></span></a>';
      }).join('');
      list.querySelectorAll('[data-screen]').forEach(function (a) {
        a.addEventListener('click', function (e) { e.preventDefault(); openScreen(cur.courseId, a.dataset.screen); });
      });
    }

    /* Lightweight sidebar updates. The screen list is built ONCE per course
       (renderScreenList). Clicking a screen must never rebuild it — that
       resets the list's scroll position and makes the menu visibly jump.
       Instead just toggle the active row, and refresh a single row's
       title / badge when that screen's content actually changes. */
    function markActiveScreen(screenId) {
      var list = document.getElementById('am-screenlist');
      if (!list) return;
      list.querySelectorAll('[data-screen]').forEach(function (a) {
        a.classList.toggle('active', a.dataset.screen === screenId);
      });
    }
    function syncScreenListItem(courseId, screenId) {
      var list = document.getElementById('am-screenlist');
      if (!list) return;
      var c = merged(courseId);
      var s = (c.screens || []).find(function (x) { return x.id === screenId; });
      if (!s) return;
      var item = null;
      list.querySelectorAll('[data-screen]').forEach(function (a) {
        if (a.dataset.screen === screenId) item = a;
      });
      if (!item) return;
      var t = typeOf(s.type);
      var titleEl = item.querySelector('.ms-ws-title');
      var badgeEl = item.querySelector('.ms-ws-type-badge');
      if (titleEl) titleEl.textContent = s.title || '(untitled)';
      if (badgeEl) {
        badgeEl.className = 'ms-ws-type-badge ' + t.cls;
        badgeEl.textContent = t.label + (isEdited(s) ? ' · edited' : '');
      }
    }

    /* ========== File manager — every screen, type, hours, file ========== */
    async function showFileManager(courseId) {
      cur.screenId = null;
      markActiveScreen(null);
      var pane = document.getElementById('am-content');
      if (!pane) return;

          '<td>' + esc(s.title || '(untitled)') + '</td>' +
          '<td>' + esc(hoursText(s)) + '</td>' +
          '<td class="am-fm-loc">' + loc + '</td>' +
          '<td>' + esc(editTextPlain(s)) + '</td></tr>';
      }).join('');
      pane.innerHTML =
        '<div class="am-head"><span class="am-head-eyebrow">File manager</span>' +

          '<p>Every screen in this course — its type, title, hours, where the content comes from, ' +

        '<table class="am-fm-table"><thead><tr>' +
          '<th>#</th><th>Type</th><th>Title</th><th>Hours</th><th>Source file</th><th>Last edited</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
      pane.querySelectorAll('[data-screen]').forEach(function (tr) {
        tr.addEventListener('click', function () { openScreen(courseId, tr.dataset.screen); });

    /* ========== Screen content pane ========== */
    function openScreen(courseId, screenId, mode) {
      cur.screenId = screenId;
      setUrl(courseId, screenId, mode || 'push');
      var c = merged(courseId);
      var idx = (c.screens || []).findIndex(function (s) { return s.id === screenId; });
      var s = c.screens[idx];
      var t = typeOf(s.type);
      /* Don't rebuild the list — just move the active row and refresh this
         row in case its content / title changed (import, edit). */
      markActiveScreen(screenId);
      syncScreenListItem(courseId, screenId);

      var actions;
      if (t.word) {
        actions = '<div class="am-replace" id="am-zone">' +
          '<div class="am-replace-info"><strong>⤓ Replace with a Word document</strong>' +

            '<button class="btn btn-secondary" id="am-edit-btn" type="button">✎ Edit like a document</button>' +
            '<button class="btn btn-secondary" id="am-dl-btn" type="button">⤓ Download Word</button>' +
          '</div></div>';
      } else if (t.img) {
        actions = '<div class="am-replace" id="am-zone">' +

          ' — managed by its link / file path below.</span></div>' +

      }

      var pane = document.getElementById('am-content');
      pane.innerHTML =
        '<div class="am-screen-head"><span class="am-screen-ico">' + t.icon + '</span>' +
          '<div class="am-screen-headbody"><span class="am-screen-eyebrow">Screen ' + (idx + 1) + ' · ' + esc(t.label) + '</span>' +
            '<input class="am-screen-title" id="am-title" value="' + esc(s.title || '') + '"></div>' +
          '<a class="btn btn-secondary" href="course.html?id=' + esc(courseId) + '&screen=' + esc(s.id) + '" target="_blank" rel="noopener">↗ Open in course</a>' +
        '</div>' +
        '<div class="am-screen-meta">' +
          '<label class="am-meta-hours">Hours <input type="number" id="am-hours" min="0" step="0.1" value="' +
            esc(s.hours != null ? s.hours : '') + '"></label>' +
          '<span class="am-meta-item"><strong>Source file:</strong> ' +

              ? '<a href="' + esc(s.src) + '" target="_blank" rel="noopener">' + esc(s.src) + '</a>'
              : '<code>' + esc(s.src || '—') + '</code>') + '</span>' +

        '<div id="am-editor-host"></div>' +
        '<div class="am-preview-wrap"><div class="am-preview-label">' +
          '<span>Preview — exactly as learners see it</span>' +

        var h = parseFloat(this.value);

        wireDrop('am-zone', /\.(docx|doc|html?)$/i, function (f) { importScreen(f, courseId, s); });
      } else if (t.img) {
        var imgInput = document.getElementById('am-imgfile');
        document.getElementById('am-img-btn').addEventListener('click', function () { imgInput.click(); });

    function wireDrop(id, accept, onFile, byMime) {
      var dz = document.getElementById(id);
      if (!dz) return;
      ['dragenter', 'dragover'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
      });
      dz.addEventListener('drop', function (e) {
        var f = e.dataTransfer && e.dataTransfer.files[0];
        if (f && accept.test(byMime ? f.type : f.name)) onFile(f);
        else if (f) flash('That file type is not accepted here.', 'err');
      });
    }

    function flash(msg, kind) {
      var el = document.getElementById('am-status');
      if (!el) return;
      el.hidden = false;
      el.className = 'am-status' + (kind ? ' ' + kind : ' ok');
      el.innerHTML = msg;
      clearTimeout(el._t);
      if (!kind || kind === 'ok') el._t = setTimeout(function () { el.hidden = true; }, 4000);
    }

    async function renderPreview(s, box) {
      try {
        var ov = CMS.getHtmlOverride(s.src);
        if (s.type === 'document' || s.type === 'html') {
          box.innerHTML = '<div class="stage-doc"><div class="stage-doc-inner">' + enhance(await getScreenBody(s)) + '</div></div>';
        } else if (s.type === 'image') {
          var src = (ov && /^data:image\//.test(ov)) ? ov : s.src;
          box.innerHTML = '<div class="am-preview-img"><img src="' + esc(src) + '" alt="' + esc(s.title) + '"></div>';
        } else if (s.type === 'youtube') {
          var m = String(s.src || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/);
          box.innerHTML = m ? '<div class="inline-youtube"><iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen></iframe></div>'
                            : '<p class="stage-loading">Video: ' + esc(s.src) + '</p>';
        } else if (s.type === 'pdf') {
          box.innerHTML = '<iframe class="am-preview-frame" src="' + esc(s.src) + '"></iframe>';
        } else {
          box.innerHTML = '<p class="stage-loading">' + esc(typeOf(s.type).label) + ' — <a href="' + esc(s.src) + '" target="_blank" rel="noopener">open / download</a></p>';
        }
      } catch (err) {
        box.innerHTML = '<p class="stage-loading" style="color:var(--warn)">Could not render this screen: ' + esc(err.message) + '</p>';
      }
    }

    /* ---------- Import one screen (.docx verbatim, or .doc/.htm) ---------- */
    async function importScreen(file, courseId, s) {
      flash('Reading “' + esc(file.name) + '” and copying the text in word-for-word…');
      try {
        var bodyHtml = await fileToHtml(file);
        if (!bodyHtml.trim()) { flash('That file looks empty — nothing to import.', 'err'); return; }
        CMS.setHtmlOverride(s.src, wrapPage(bodyHtml));
        editTimes[s.src] = new Date().toISOString();
        flash('✓ Saved from “' + esc(file.name) + '” — live on the course now.');
        openScreen(courseId, s.id, 'replace');
      } catch (err) {
        flash('Could not import that file: ' + esc(err.message || err), 'err');
      }
    }

    /* ---------- Per-screen download (real Word .docx) ---------- */
    async function downloadScreen(s, idx) {
      flash('Preparing the Word file…');
      try {
        var body = markScreen(await getScreenBody(s), s.title, s.title);
        var blob = await htmlToDocxBlob(fullHtmlDoc(body, s.title));
        download(blob, pad2(idx + 1) + ' - ' + safeName(s.title) + '.docx');
        flash('✓ Downloaded as Word .docx — open it in Word, edit, then upload it back.');
      } catch (err) {
        flash('Could not build the Word file: ' + esc(err.message || err), 'err');
      }
    }

    /* ---------- Full-course download — zip of per-screen files + combined doc ---------- */
    async function downloadCourse(courseId) {
      var c = merged(courseId);
      flash('Building the course download — rendering ' + c.screens.length + ' screens…');
      try {
        var zip = new JSZip();
        var parts = [];
        for (var i = 0; i < c.screens.length; i++) {
          var s = c.screens[i], t = typeOf(s.type);
          var content;
          if (t.word) {
            content = await getScreenBody(s);
          } else if (t.img) {
            var isrc = imageSrcOf(s);
            var durl = /^data:/i.test(isrc) ? isrc : (await toDataUri(isrc) || isrc);
            content = '<p><img src="' + esc(durl) + '" style="max-width:100%"></p>';
          } else {
            content = '<p><em>[' + esc(t.label) + ' screen — link kept as-is: ' +
              esc(s.src || '') + ']</em></p>';
          }
          /* Per-screen file: a real .docx, exactly ONE plain title heading. */
          if (t.word || t.img) {
            zip.file('screens/' + pad2(i + 1) + ' - ' + safeName(s.title) + '.docx',
              await htmlToDocxBlob(fullHtmlDoc(markScreen(content, s.title, s.title), s.title)));
          }
          /* Combined doc: exactly ONE heading per screen, "Screen N:
             Title" — the obvious editing label AND the re-upload split
             boundary. No more title-then-title repetition. */
          parts.push(markScreen(content, 'Screen ' + (i + 1) + ': ' + s.title, s.title));
        }
        /* A "Course contents" summary table at the very top — screen
           type, title, hours and source file for every screen. It sits
           BEFORE the first "Screen N:" heading, so the re-upload
           splitter ignores it (information only). */
        var sumRows = c.screens.map(function (s, i) {
          var t = typeOf(s.type);
          return '<tr><td>' + (i + 1) + '</td><td>' + esc(t.label) + '</td><td>' +
            esc(s.title || '') + '</td><td>' + esc(s.hours != null ? s.hours : '') +
            '</td><td>' + esc(s.src || '') + '</td></tr>';
        }).join('');
        var summary =
          '<h1>' + esc((c.code || c.id) + ' — ' + (c.title || '')) + '</h1>' +
          '<p><b>Course contents</b> — ' + c.screens.length + ' screens. This table is a ' +
          'summary only; edit each screen further down, under its “Screen N: Title” heading.</p>' +
          '<table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse">' +
          '<tr><th>#</th><th>Screen type</th><th>Title</th><th>Hours</th><th>Source file</th></tr>' +
          sumRows + '</table><br style="page-break-before:always">';
        /* The whole course as one real .docx — the contents table, then
           each screen under a "Screen N:" heading you edit and re-upload. */
        var combined = summary + parts.join('<br style="page-break-before:always">');
        /* Name files with the CP/CO course code up front — several
           courses share a title, so the code is what tells them apart. */
        var codeName = safeName((c.code || c.id) + ' - ' + c.title);
        zip.file(codeName + '.docx',
          await htmlToDocxBlob(fullHtmlDoc(combined, (c.code || c.id) + ' ' + c.title)));
        zip.file('README.txt',
          'Matrix LMS — course download for ' + (c.code || c.id) + ' ' + c.title + '\n\n' +
          '• screens/  — each screen as its own Word .docx (text screens and\n' +
          '  image screens; pictures are embedded in the file).\n' +
          '• ' + codeName + '.docx — the whole course in ONE Word document.\n' +
          '  Each screen begins with a heading "Screen N: Title". Edit\n' +
          '  anything below a heading; keep the "Screen N: Title" lines.\n' +
          '  Then use "Upload whole course" in Admin — it splits on those\n' +
          '  headings and refills every screen, pictures and all.\n\n' +
          'Open and save these in Microsoft Word as .docx (do NOT save as the\n' +
          'old .doc format). Google Docs: use File > Download > .docx.\n');
        var blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
        download(blob, codeName + '.zip');
        flash('✓ Course downloaded — ' + c.screens.length + ' screen file(s) + the full-course document.');
      } catch (err) {
        flash('Could not build the course download: ' + esc(err.message || err), 'err');
      }
    }

    /* ---------- Full-course upload — split a Word doc into screens ---------- */
    function splitOnHeadings(html) {
      var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
      var markerRe = /^\s*screen\s*\d+\s*[:.\-–—]/i;
      var kids = Array.prototype.filter.call(d.body.childNodes, function (n) { return n.nodeType === 1; });
      /* A screen boundary is any block whose text starts with
         "Screen N:" — our download marker. Detected on ANY element,
         because Word / Google Docs may re-import our <h1> as a heading
         of a different level or even a styled paragraph. Only if the
         document has no such markers at all (hand-made) do we fall
         back to treating every Heading 1 as a boundary. */
      var anyMarker = kids.some(function (n) { return markerRe.test((n.textContent || '').trim()); });
      var sections = [], curSec = null;
      kids.forEach(function (node) {
        var isBoundary = anyMarker
          ? markerRe.test((node.textContent || '').trim())
          : (node.tagName === 'H1');
        if (isBoundary) {
          curSec = { title: (node.textContent || '').trim(), body: '' };
          sections.push(curSec);
        } else if (curSec) {
          curSec.body += node.outerHTML || '';
        }
      });
      return sections;
    }
    async function uploadCourse(file, courseId) {
      var pane = document.getElementById('am-content');
      pane.innerHTML = '<p class="stage-loading">Reading “' + esc(file.name) + '” and splitting it into screens…</p>';
      try {
        var html = await fileToHtml(file);
        var sections = splitOnHeadings(html);
        if (!sections.length) {
          pane.innerHTML = '<div class="am-empty"><div class="am-empty-ico">⚠</div><h1>No screens found</h1>' +
            '<p>Each screen must start with a <strong>Heading&nbsp;1</strong> line — ideally ' +
            '“<strong>Screen&nbsp;N:&nbsp;Title</strong>”. Use “Download whole course” first to ' +
            'get a document already in the right format, edit it, then upload it back.</p>' +
            '<button class="btn btn-secondary" id="am-back2" type="button">Back</button></div>';
          document.getElementById('am-back2').addEventListener('click', function () { openCourse(courseId); });
          return;
        }
        var c = merged(courseId);
        var allScreens = c.screens || [];
        var byTitle = {};
        allScreens.forEach(function (s) { byTitle[norm(s.title)] = s; });

        var used = {}, plan = [];
        sections.forEach(function (sec) {
          var s = null;
          /* 1 — by the "Screen N:" number. Most reliable: it survives
                 the title being renamed and other sections deleted. */
          var n = screenNumberOf(sec.title);
          if (n != null && n >= 1 && n <= allScreens.length) s = allScreens[n - 1];
          /* 2 — by title. */
          if (!s) s = byTitle[norm(stripScreenPrefix(sec.title))] || byTitle[norm(sec.title)];
          if (s && !used[s.id]) { used[s.id] = true; plan.push({ sec: sec, screen: s }); }
          else plan.push({ sec: sec, screen: null });
        });
        /* 3 — clean round-trip (one section per screen, same order):
               fill any remaining miss by position. */
        if (sections.length === allScreens.length) {
          plan.forEach(function (p, i) {
            if (!p.screen && !used[allScreens[i].id]) { p.screen = allScreens[i]; used[allScreens[i].id] = true; }
          });
        }

        /* Apply — outcomes: updated (existing screen content saved),
           added (a "Screen N" beyond the course → a brand-new screen
           created), skipped (video / PDF / slides — set by a link),
           unmatched (no such screen, couldn't place it). */
        var updated = [], added = [], skipped = [], unmatched = [];
        var newPos = allScreens.length;
        plan.forEach(function (p) {
          if (p.screen) {
            var t = typeOf(p.screen.type);
            if (t.word) {
              CMS.setHtmlOverride(p.screen.src, wrapPage(p.sec.body));
              updated.push(p.screen.title);
            } else if (t.img) {
              var data = firstImageData(p.sec.body);
              if (data) { CMS.setHtmlOverride(p.screen.src, data); updated.push(p.screen.title); }
              else skipped.push(p.screen.title + ' (image screen — no picture in that section)');
            } else {
              skipped.push(p.screen.title + ' (' + t.label + ')');
            }
            return;
          }
          /* No existing screen. If the section carries a "Screen N"
             number beyond the course's current length, the editor
             added a new screen on purpose — so create it. */
          var n = screenNumberOf(p.sec.title);
          if (n != null && n > allScreens.length) {
            var newTitle = stripScreenPrefix(p.sec.title) || ('Screen ' + n);
            var newId = 'add-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
            var newSrc = 'content/' + (c.code || c.id) + '/' + newId + '.html';
            newPos += 1;
            CMS.setScreenOverride(courseId, newId, { title: newTitle, type: 'html', src: newSrc, position: newPos });
            CMS.setHtmlOverride(newSrc, wrapPage(p.sec.body));
            added.push(newTitle);
          } else {
            unmatched.push(p.sec.title || '(untitled section)');
          }
        });
        var allFailed = updated.length === 0 && added.length === 0;
        pane.innerHTML =
          '<div class="am-empty"><div class="am-empty-ico">' + (allFailed ? '⚠' : '✓') + '</div>' +
          '<h1>' + (allFailed ? 'Nothing was updated' : 'Course updated') + '</h1>' +
          '<p><strong>' + updated.length + '</strong> screen(s) updated' +
            (added.length ? ' · <strong>' + added.length + '</strong> new screen(s) added' : '') +
            (skipped.length ? ' · <strong>' + skipped.length + '</strong> skipped' : '') +
            (unmatched.length ? ' · <strong>' + unmatched.length + '</strong> not matched' : '') + '.</p>' +
          (updated.length ? '<p style="font-size:0.82rem;color:var(--success)">Updated: ' +
            esc(updated.join(', ')) + '</p>' : '') +
          (added.length ? '<p style="font-size:0.82rem;color:var(--success)">Added as new screens: ' +
            esc(added.join(', ')) + '</p>' : '') +
          (skipped.length ? '<p style="font-size:0.82rem;color:var(--text-muted)">Skipped — videos, PDFs ' +
            'and slideshows are set by their link, not by document text: ' + esc(skipped.join('; ')) + '</p>' : '') +
          (unmatched.length ? '<p style="font-size:0.82rem;color:var(--warn)">Not matched: ' +
            esc(unmatched.join(', ')) + ' — to ADD a screen, head it with the next free number, ' +
            'e.g. “Screen ' + (allScreens.length + 1) + ': …”.</p>' : '') +
          (allFailed ? '<p style="font-size:0.82rem;color:var(--text-muted)">Tip: use “Download whole course” ' +
            'to get a document already in the right format, edit that, and upload it back.</p>' : '') +
          '<button class="btn btn-primary" id="am-back2" type="button">Review screens</button></div>';
        document.getElementById('am-back2').addEventListener('click', function () { openCourse(courseId); });
      } catch (err) {
        pane.innerHTML = '<div class="am-empty"><div class="am-empty-ico">⚠</div><h1>Could not import</h1>' +
          '<p>' + esc(err.message || err) + '</p>' +
          '<button class="btn btn-secondary" id="am-back2" type="button">Back</button></div>';
        var b = document.getElementById('am-back2');
        if (b) b.addEventListener('click', function () { openCourse(courseId); });
      }
    }

    /* ---------- Image upload ---------- */
    function uploadImage(file, courseId, s) {
      if (!/^image\//i.test(file.type)) { flash('Please choose an image file.', 'err'); return; }
      flash('Reading “' + esc(file.name) + '”…');
      var fr = new FileReader();
      fr.onload = function () {
        CMS.setHtmlOverride(s.src, String(fr.result));
        editTimes[s.src] = new Date().toISOString();
        flash('✓ Image updated — live on the course now.');
        openScreen(courseId, s.id, 'replace');
      };
      fr.onerror = function () { flash('Could not read that image.', 'err'); };
      fr.readAsDataURL(file);
    }

    /* ---------- WYSIWYG editor ---------- */
    var TOOLBAR = [
      ['bold', '<b>B</b>', 'Bold'], ['italic', '<i>I</i>', 'Italic'], ['underline', '<u>U</u>', 'Underline'],
      ['sep'], ['h2', 'H1', 'Big heading'], ['h3', 'H2', 'Sub-heading'], ['p', '¶', 'Normal text'],
      ['sep'], ['ul', '• List', 'Bulleted list'], ['ol', '1. List', 'Numbered list'],
      ['sep'], ['link', '🔗 Link', 'Insert a link'], ['image', '🖼 Image', 'Insert an image'],
      ['sep'], ['clear', '✗ Clear', 'Clear formatting']
    ];
    async function openEditor(courseId, s) {
      var host = document.getElementById('am-editor-host');
      if (host.dataset.open === '1') {
        host.dataset.open = '0'; host.innerHTML = '';
        var ps = document.getElementById('am-preview-save');
        if (ps) ps.hidden = true;
        return;
      }
      host.dataset.open = '1';
      host.innerHTML = '<div class="am-editor"><p class="stage-loading" style="padding:1rem">Loading…</p></div>';
      var bodyHtml = '';
      try { bodyHtml = await getScreenBody(s); } catch (e) { bodyHtml = '<p>(could not load current text)</p>'; }

      var tb = TOOLBAR.map(function (b) {
        if (b[0] === 'sep') return '<span class="am-tool-sep"></span>';
        return '<button type="button" class="am-tool-btn" data-cmd="' + b[0] + '" title="' + b[2] + '">' + b[1] + '</button>';
      }).join('');
      host.innerHTML =
        '<div class="am-editor"><div class="am-toolbar">' + tb + '</div>' +
          '<div class="am-doc" id="am-doc" contenteditable="true"></div>' +
          '<div class="am-editor-actions">' +
            '<button class="btn btn-ghost" id="am-ed-close" type="button">Close</button>' +
            '<button class="btn btn-primary" id="am-ed-save" type="button">💾 Save</button>' +
          '</div></div><input type="file" id="am-ed-img" accept="image/*" hidden>';
      var doc = document.getElementById('am-doc');
      doc.innerHTML = enhance(bodyHtml);
      host.querySelectorAll('.am-tool-btn').forEach(function (btn) {
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btn.addEventListener('click', function () {
          doc.focus();
          var cmd = btn.dataset.cmd;
          if (cmd === 'bold' || cmd === 'italic' || cmd === 'underline') document.execCommand(cmd, false, null);
          else if (cmd === 'h2') document.execCommand('formatBlock', false, 'h1');
          else if (cmd === 'h3') document.execCommand('formatBlock', false, 'h2');
          else if (cmd === 'p') document.execCommand('formatBlock', false, 'p');
          else if (cmd === 'ul') document.execCommand('insertUnorderedList', false, null);
          else if (cmd === 'ol') document.execCommand('insertOrderedList', false, null);
          else if (cmd === 'clear') document.execCommand('removeFormat', false, null);
          else if (cmd === 'link') { var u = prompt('Link address (https://…):', 'https://'); if (u) document.execCommand('createLink', false, u); }
          else if (cmd === 'image') document.getElementById('am-ed-img').click();
        });
      });
      document.getElementById('am-ed-img').addEventListener('change', function (e) {
        var f = e.target.files[0]; if (!f) return;
        var fr = new FileReader();
        fr.onload = function () { doc.focus(); document.execCommand('insertImage', false, String(fr.result)); };
        fr.readAsDataURL(f); e.target.value = '';
      });
      var topSave = document.getElementById('am-preview-save');
      function closeEditor() {
        host.dataset.open = '0'; host.innerHTML = '';
        if (topSave) topSave.hidden = true;
      }
      function saveEditor() {
        CMS.setHtmlOverride(s.src, wrapPage(doc.innerHTML));
        editTimes[s.src] = new Date().toISOString();
        flash('✓ Saved — live on the course now.');
        closeEditor();
        openScreen(courseId, s.id, 'replace');
      }
      document.getElementById('am-ed-close').addEventListener('click', closeEditor);
      document.getElementById('am-ed-save').addEventListener('click', saveEditor);
      /* Mirror Save onto the Preview bar so it's reachable from the top. */
      if (topSave) { topSave.hidden = false; topSave.onclick = saveEditor; }
    }

    /* ---------- Boot ---------- */
    /* Back / Forward re-render the matching view without touching history. */
    window.addEventListener('popstate', function () { routeFromUrl('none'); });

    fetch('data/courses.json').then(function (r) { return r.json(); }).then(function (data) {
      /* Fold in any courses that live only in Supabase (e.g. added here). */
      courses = (window.MatrixCMS && window.MatrixCMS.mergeCourses)
        ? window.MatrixCMS.mergeCourses(data.courses || []) : (data.courses || []);
      routeFromUrl('replace');
    }).catch(function (err) {
      main.innerHTML = '<p class="stage-loading">Could not load courses: ' + esc(err.message) + '</p>';
    });
  })();
  </script>
</body>
