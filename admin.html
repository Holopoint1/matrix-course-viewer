<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Admin · Content Manager | Matrix Course Viewer</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260536">
</head>
<body data-no-sidebar>
  <header class="site-header" id="site-header"></header>

  <main class="am-wrap">
    <div class="am-shell">
      <!-- Course folders -->
      <aside class="am-rail">
        <div class="am-rail-head">
          <span class="am-rail-eyebrow">Content manager</span>
          <h2>Courses</h2>
        </div>
        <ul class="am-folders" id="am-folders"></ul>
        <div class="am-rail-foot">
          <p class="am-rail-note">Every change saves to the live database — it shows on the course immediately, for everyone.</p>
        </div>
      </aside>

      <!-- Main: course grid OR screen detail -->
      <section class="am-main" id="am-main">
        <p class="stage-loading">Loading courses&hellip;</p>
      </section>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="assets/chrome.js?v=20260536"></script>
  <script src="assets/cms-overrides.js?v=20260536"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js?v=20260536"></script>
  <script src="assets/cms-supabase.js?v=20260536"></script>
  <script>
  (function () {
    'use strict';
    var CMS = window.MatrixCMS;
    try { CMS.unlock('matrix'); } catch (e) {}   /* Phase 1: open access */

    var main = document.getElementById('am-main');
    var foldersEl = document.getElementById('am-folders');
    var courses = null;
    var view = { courseId: null, screenId: null };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* Screen "file type" → icon, label, and whether it's a Word-editable screen. */
    var TYPES = {
      document:   { icon: '📄', label: 'Word document', word: true },
      html:       { icon: '📝', label: 'Page',          word: true },
      youtube:    { icon: '▶',  label: 'Video',         word: false },
      pdf:        { icon: '📕', label: 'PDF',           word: false },
      powerpoint: { icon: '📊', label: 'Slides',        word: false },
      image:      { icon: '🖼', label: 'Image',         word: false },
      spreadsheet:{ icon: '📈', label: 'Spreadsheet',   word: false }
    };
    function typeOf(t) { return TYPES[t] || { icon: '📄', label: t || 'Screen', word: false }; }

    function getCourse(id) { return courses.find(function (c) { return c.id === id; }); }
    function merged(id) {
      var c = getCourse(id);
      return (c && CMS.applyOverrides) ? CMS.applyOverrides(c) : c;
    }
    function isEdited(screen) {
      return !!(screen && screen.src && CMS.getHtmlOverride(screen.src));
    }

    /* ---------- Course folder rail ---------- */
    function renderRail() {
      foldersEl.innerHTML = courses.map(function (c) {
        var edits = (c.screens || []).filter(function (s) { return isEdited(s); }).length;
        return '<li><button type="button" class="am-folder' +
          (c.id === view.courseId ? ' active' : '') + '" data-course="' + esc(c.id) + '">' +
          '<span class="am-folder-ico">📁</span>' +
          '<span class="am-folder-body"><strong>' + esc(c.code || c.id) + '</strong>' +
          '<span>' + esc(c.title || '') + '</span></span>' +
          (edits ? '<span class="am-folder-badge" title="' + edits + ' edited screen(s)">' + edits + '</span>' : '') +
          '</button></li>';
      }).join('');
      foldersEl.querySelectorAll('[data-course]').forEach(function (b) {
        b.addEventListener('click', function () { openCourse(b.dataset.course); });
      });
    }

    /* ---------- Course view: screens as a file grid ---------- */
    function openCourse(courseId) {
      view.courseId = courseId; view.screenId = null;
      renderRail();
      var c = merged(courseId);
      if (!c) { main.innerHTML = '<p class="stage-loading">Course not found.</p>'; return; }

      var cards = (c.screens || []).map(function (s, i) {
        var t = typeOf(s.type);
        return '<button type="button" class="am-card" data-screen="' + esc(s.id) + '">' +
          '<span class="am-card-top">' +
            '<span class="am-card-ico">' + t.icon + '</span>' +
            '<span class="am-card-num">' + (i + 1) + '</span>' +
            (isEdited(s) ? '<span class="am-card-edited" title="Edited — differs from the original">edited</span>' : '') +
          '</span>' +
          '<span class="am-card-title">' + esc(s.title || '(untitled)') + '</span>' +
          '<span class="am-card-type">' + t.icon + ' ' + esc(t.label) + '</span>' +
          '</button>';
      }).join('');

      main.innerHTML =
        '<div class="am-crumb"><span>Courses</span><span class="am-crumb-sep">›</span>' +
          '<strong>' + esc(c.code || c.id) + '</strong></div>' +
        '<div class="am-course-head">' +
          '<div><h1>' + esc(c.title || c.id) + '</h1>' +
          '<p>' + (c.screens || []).length + ' screens — click any one to preview it, edit the text, or replace it with a Word document.</p></div>' +
          '<a class="btn btn-secondary" href="course.html?id=' + esc(c.id) + '" target="_blank" rel="noopener">↗ Open course</a>' +
        '</div>' +
        '<div class="am-grid">' + cards + '</div>';

      main.querySelectorAll('[data-screen]').forEach(function (b) {
        b.addEventListener('click', function () { openScreen(courseId, b.dataset.screen); });
      });
    }

    /* ---------- Screen detail: preview + replace + edit ---------- */
    function openScreen(courseId, screenId) {
      view.courseId = courseId; view.screenId = screenId;
      var c = merged(courseId);
      var idx = (c.screens || []).findIndex(function (s) { return s.id === screenId; });
      var s = c.screens[idx];
      var t = typeOf(s.type);

      main.innerHTML =
        '<div class="am-crumb"><a href="#" data-back="courses">Courses</a><span class="am-crumb-sep">›</span>' +
          '<a href="#" data-back="course">' + esc(c.code || c.id) + '</a><span class="am-crumb-sep">›</span>' +
          '<strong>Screen ' + (idx + 1) + '</strong></div>' +

        '<div class="am-screen-head">' +
          '<span class="am-screen-ico">' + t.icon + '</span>' +
          '<div class="am-screen-headbody">' +
            '<span class="am-screen-eyebrow">Screen ' + (idx + 1) + ' · ' + esc(t.label) + '</span>' +
            '<input class="am-screen-title" id="am-title" value="' + esc(s.title || '') + '">' +
          '</div>' +
          '<a class="btn btn-secondary" href="course.html?id=' + esc(courseId) + '&screen=' + esc(s.id) + '" target="_blank" rel="noopener">↗ Open in course</a>' +
        '</div>' +

        (t.word
          ? '<div class="am-replace" id="am-replace">' +
              '<div class="am-replace-info"><strong>⤓ Replace with a Word document</strong>' +
              '<span>Drop a <code>.docx</code> here (or click) — its text is copied in word-for-word and goes live on the course immediately. Re-upload any time to update.</span></div>' +
              '<input type="file" id="am-file" accept=".docx" hidden>' +
              '<div class="am-replace-actions">' +
                '<button class="btn btn-primary" id="am-upload-btn" type="button">Choose Word file…</button>' +
                '<button class="btn btn-secondary" id="am-edit-btn" type="button">✎ Edit text here</button>' +
                (isEdited(s) ? '<button class="btn btn-ghost" id="am-revert-btn" type="button">↩ Revert to original</button>' : '') +
              '</div>' +
            '</div>'
          : '<div class="am-replace am-replace-readonly"><div class="am-replace-info">' +
              '<strong>' + t.icon + ' ' + esc(t.label) + ' screen</strong>' +
              '<span>This screen is ' + (s.type === 'youtube' ? 'a video' : 'a ' + esc(t.label).toLowerCase()) +
              ', not a Word document — it is managed by its link / file path below. Word replace applies to Page and Word-document screens.</span></div>' +
              '<code class="am-src">' + esc(s.src || '') + '</code></div>') +

        '<div class="am-status" id="am-status" hidden></div>' +
        '<div class="am-editor" id="am-editor" hidden></div>' +

        '<div class="am-preview-wrap">' +
          '<div class="am-preview-label">Preview — exactly as learners see it</div>' +
          '<div class="am-preview" id="am-preview"><p class="stage-loading">Rendering&hellip;</p></div>' +
        '</div>';

      main.querySelector('[data-back="courses"]').addEventListener('click', function (e) { e.preventDefault(); openCourse(courseId); });
      main.querySelector('[data-back="course"]').addEventListener('click', function (e) { e.preventDefault(); openCourse(courseId); });

      /* Screen title — save on change */
      var titleInput = document.getElementById('am-title');
      titleInput.addEventListener('change', function () {
        CMS.setScreenOverride(courseId, s.id, { title: titleInput.value.trim() });
        flash('Title saved — live on the course.');
        renderRail();
      });

      if (t.word) {
        var fileInput = document.getElementById('am-file');
        document.getElementById('am-upload-btn').addEventListener('click', function () { fileInput.click(); });
        fileInput.addEventListener('change', function () {
          if (fileInput.files[0]) uploadWord(fileInput.files[0], courseId, s);
        });
        var dz = document.getElementById('am-replace');
        ['dragenter', 'dragover'].forEach(function (ev) {
          dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
          dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
        });
        dz.addEventListener('drop', function (e) {
          var f = e.dataTransfer && e.dataTransfer.files[0];
          if (f) uploadWord(f, courseId, s);
        });
        document.getElementById('am-edit-btn').addEventListener('click', function () { openEditor(courseId, s); });
        var rev = document.getElementById('am-revert-btn');
        if (rev) rev.addEventListener('click', function () { revert(courseId, s); });
      }

      renderPreview(s, document.getElementById('am-preview'));
    }

    function flash(msg, kind) {
      var el = document.getElementById('am-status');
      if (!el) return;
      el.hidden = false;
      el.className = 'am-status' + (kind ? ' ' + kind : ' ok');
      el.textContent = msg;
      clearTimeout(el._t);
      if (!kind || kind === 'ok') el._t = setTimeout(function () { el.hidden = true; }, 3500);
    }

    /* ---------- Render a screen as the front end shows it ---------- */
    async function renderPreview(s, box) {
      try {
        var override = CMS.getHtmlOverride(s.src);
        if (s.type === 'document' || s.type === 'html') {
          var html;
          if (override != null) {
            html = bodyOf(override);
          } else if (s.type === 'document') {
            var buf = await fetch(s.src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
            html = (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
          } else {
            var txt = await fetch(s.src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
            html = bodyOf(txt);
          }
          box.innerHTML = '<div class="stage-doc"><div class="stage-doc-inner">' + enhance(html) + '</div></div>';
        } else if (s.type === 'youtube') {
          var m = String(s.src || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/);
          box.innerHTML = m ? '<div class="inline-youtube"><iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen></iframe></div>'
                            : '<p class="stage-loading">Video: ' + esc(s.src) + '</p>';
        } else if (s.type === 'pdf') {
          box.innerHTML = '<iframe class="am-preview-frame" src="' + esc(s.src) + '"></iframe>';
        } else if (s.type === 'image') {
          box.innerHTML = '<div class="am-preview-img"><img src="' + esc(s.src) + '" alt="' + esc(s.title) + '"></div>';
        } else {
          box.innerHTML = '<p class="stage-loading">' + esc(typeOf(s.type).label) + ' — <a href="' + esc(s.src) + '" target="_blank" rel="noopener">open / download</a></p>';
        }
      } catch (err) {
        box.innerHTML = '<p class="stage-loading" style="color:var(--warn)">Could not render this screen: ' + esc(err.message) + '</p>';
      }
    }
    function bodyOf(fullHtml) {
      try {
        var d = new DOMParser().parseFromString(fullHtml, 'text/html');
        var page = d.querySelector('.page');
        if (page) return page.innerHTML;
        if (d.body) return d.body.innerHTML;
      } catch (e) {}
      return fullHtml;
    }
    /* Light, deterministic enhancer — inline bare YouTube links only. */
    function enhance(html) {
      try {
        var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
        d.body.querySelectorAll('a').forEach(function (a) {
          var m = (a.getAttribute('href') || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/);
          if (!m) return;
          var w = d.createElement('div');
          w.className = 'inline-youtube';
          w.innerHTML = '<iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen loading="lazy"></iframe>';
          a.replaceWith(w);
        });
        return d.body.innerHTML;
      } catch (e) { return html; }
    }

    /* ---------- Word upload → deterministic mammoth convert → save ---------- */
    async function uploadWord(file, courseId, s) {
      if (!/\.docx$/i.test(file.name)) { flash('Please choose a Word .docx file.', 'err'); return; }
      flash('Reading “' + file.name + '” and copying the text in word-for-word…');
      try {
        var buf = await file.arrayBuffer();
        var result = await window.mammoth.convertToHtml({ arrayBuffer: buf });
        var bodyHtml = result.value || '';
        if (!bodyHtml.trim()) { flash('That document looks empty — nothing to import.', 'err'); return; }
        /* Wrap in the standard page shell so the viewer's .page extraction
           works. Stored under screen.src — the key the viewer reads. */
        var full = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +
          '<link rel="stylesheet" href="../../assets/embedded.css"></head><body>' +
          '<div class="page">' + bodyHtml + '</div></body></html>';
        CMS.setHtmlOverride(s.src, full);     /* → cms-supabase upserts to the live DB */
        flash('✓ Saved from “' + file.name + '” — live on the course now.');
        renderPreview(s, document.getElementById('am-preview'));
        /* refresh the Revert button + edited badges */
        openScreen(courseId, s.id);
        renderRail();
      } catch (err) {
        flash('Could not import that document: ' + (err && err.message ? err.message : err), 'err');
      }
    }

    /* ---------- Inline text editor ---------- */
    async function openEditor(courseId, s) {
      var ed = document.getElementById('am-editor');
      if (!ed.hidden) { ed.hidden = true; ed.innerHTML = ''; return; }
      ed.hidden = false;
      ed.innerHTML = '<p class="stage-loading">Loading current text…</p>';
      var bodyHtml = '';
      try {
        var ov = CMS.getHtmlOverride(s.src);
        if (ov != null) bodyHtml = bodyOf(ov);
        else if (s.type === 'document') {
          var buf = await fetch(s.src).then(function (r) { return r.arrayBuffer(); });
          bodyHtml = (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
        } else {
          bodyHtml = bodyOf(await fetch(s.src).then(function (r) { return r.text(); }));
        }
      } catch (e) { bodyHtml = '<p>(could not load current text)</p>'; }

      ed.innerHTML =
        '<label class="am-editor-label">Screen text (HTML — paste, type, formatting is kept)</label>' +
        '<textarea class="am-editor-area" id="am-ta" spellcheck="false">' + esc(bodyHtml.trim()) + '</textarea>' +
        '<div class="am-editor-actions">' +
          '<button class="btn btn-ghost" id="am-ed-close" type="button">Close</button>' +
          '<button class="btn btn-primary" id="am-ed-save" type="button">💾 Save text</button>' +
        '</div>';
      var ta = document.getElementById('am-ta');
      document.getElementById('am-ed-close').addEventListener('click', function () { ed.hidden = true; ed.innerHTML = ''; });
      document.getElementById('am-ed-save').addEventListener('click', function () {
        var full = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +
          '<link rel="stylesheet" href="../../assets/embedded.css"></head><body>' +
          '<div class="page">' + ta.value + '</div></body></html>';
        CMS.setHtmlOverride(s.src, full);
        flash('✓ Text saved — live on the course now.');
        ed.hidden = true; ed.innerHTML = '';
        renderPreview(s, document.getElementById('am-preview'));
        openScreen(courseId, s.id);
        renderRail();
      });
    }

    /* ---------- Revert ---------- */
    function revert(courseId, s) {
      if (!confirm('Discard the edit for this screen and restore the original content?')) return;
      try {
        var all = JSON.parse(localStorage.getItem('matrix-lms:cms:html') || '{}');
        delete all[s.src];
        localStorage.setItem('matrix-lms:cms:html', JSON.stringify(all));
      } catch (e) {}
      /* Remove from the live DB too, best-effort. */
      try {
        if (CMS.supabaseClient) CMS.supabaseClient.from('pages').delete().eq('path', s.src);
      } catch (e) {}
      flash('Reverted to the original content.');
      openScreen(courseId, s.id);
      renderRail();
    }

    /* ---------- Boot ---------- */
    fetch('data/courses.json').then(function (r) { return r.json(); }).then(function (data) {
      courses = data.courses || [];
      renderRail();
      main.innerHTML = '<div class="am-empty"><div class="am-empty-ico">📁</div>' +
        '<h1>Pick a course on the left</h1>' +
        '<p>Each course is a folder. Inside, every screen is a file you can preview, edit, or replace with a Word document — saved live, no developer needed.</p></div>';
    }).catch(function (err) {
      main.innerHTML = '<p class="stage-loading">Could not load courses: ' + esc(err.message) + '</p>';
    });
  })();
  </script>
</body>
</html>
