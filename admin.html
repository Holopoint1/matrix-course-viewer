<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Admin · Course health | Matrix Course Viewer</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260629a">
  <style>
    #dash { max-width: 1080px; margin: 0 auto; padding: 1.4rem 1.1rem 4rem; color: #0f172a; }
    #dash .dash-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; margin-bottom: 0.4rem; }
    #dash .dash-head h1 { font-size: 1.5rem; margin: 0; }
    #dash .dash-sub { color: #64748b; font-size: 0.9rem; margin: 0 0 1rem; }
    #dash .dash-actions { margin-left: auto; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    #dash .hb { border-radius: 12px; padding: 14px 18px; margin: 0 0 14px; font-size: 14px; line-height: 1.5; }
    #dash .hb-ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    #dash .hb-warn { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; }
    #dash .stats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1rem; }
    #dash .stat { flex: 1 1 120px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.7rem 0.9rem; }
    #dash .stat .n { font-size: 1.5rem; font-weight: 800; line-height: 1; }
    #dash .stat .l { font-size: 0.68rem; letter-spacing: 0.6px; text-transform: uppercase; color: #64748b; margin-top: 0.3rem; font-weight: 700; }
    #dash .stat.warn .n { color: #d97706; } #dash .stat.bad .n { color: #dc2626; } #dash .stat.good .n { color: #16a34a; }
    #dash .course { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; margin: 0 0 0.7rem; overflow: hidden; }
    #dash .course > summary { cursor: pointer; list-style: none; padding: 0.85rem 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    #dash .course > summary::-webkit-details-marker { display: none; }
    #dash .course .code { font-weight: 800; font-size: 0.8rem; color: #1e293b; }
    #dash .course .title { font-weight: 600; }
    #dash .course .chips { margin-left: auto; display: flex; gap: 0.35rem; flex-wrap: wrap; }
    #dash .chip { font-size: 0.72rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; }
    #dash .c-ok { background: #dcfce7; color: #166534; } #dash .c-miss { background: #fee2e2; color: #991b1b; }
    #dash .c-fix { background: #fef9c3; color: #854d0e; } #dash .c-orph { background: #e0e7ff; color: #3730a3; }
    #dash table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #dash thead th { text-align: left; background: #f8fafc; color: #475569; font-size: 0.7rem; letter-spacing: 0.4px; text-transform: uppercase; padding: 6px 10px; border-top: 1px solid #e2e8f0; }
    #dash td { padding: 7px 10px; border-top: 1px solid #f1f5f9; vertical-align: top; }
    #dash code { background: #1e293b; color: #e2e8f0; padding: 1px 6px; border-radius: 5px; font-size: 12px; overflow-wrap: anywhere; }
    #dash .st { font-weight: 700; white-space: nowrap; }
    #dash .st-ok { color: #16a34a; } #dash .st-miss { color: #dc2626; } #dash .st-fix { color: #b45309; } #dash .st-orph { color: #4338ca; } #dash .st-link { color: #2563eb; }
    #dash .reason { color: #64748b; font-size: 12px; }
    #dash .why { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 13px; }
    #dash details.issues > summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
    #dash a.open { font-size: 0.78rem; color: #2563eb; text-decoration: none; }
    #dash .spin { display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.2);border-top-color:#2563eb;border-radius:50%;animation:dspin .8s linear infinite;vertical-align:-2px;margin-right:5px; }
    @keyframes dspin { to { transform: rotate(360deg); } }
    /* ---- Mobile: stack the per-screen table into readable cards ----
       On a narrow screen the 4-column table forces the long file path to wrap
       one character per line. Instead, drop the header, stack each row, and let
       the path wrap across the full width. */
    @media (max-width: 640px) {
      #dash { padding: 1rem 0.7rem 3rem; }
      #dash .dash-head h1 { font-size: 1.25rem; }
      #dash .dash-actions { width: 100%; }
      #dash .dash-actions .btn { flex: 1; }
      #dash .stat { flex-basis: 44%; }
      #dash .course > summary { padding: 0.7rem 0.8rem; }
      #dash thead { display: none; }
      #dash table, #dash tbody, #dash tr, #dash td { display: block; width: 100%; }
      #dash tr { border-top: 1px solid #e2e8f0; padding: 9px 10px 11px; }
      #dash td { border: 0; padding: 1px 0; }
      #dash td:first-child { display: none; }                 /* the # column */
      #dash td:nth-child(2) { font-weight: 700; font-size: 13.5px; color: #0f172a; } /* screen title */
      #dash td code { display: block; white-space: normal; overflow-wrap: anywhere; word-break: break-word; font-size: 11px; margin-top: 3px; padding: 3px 7px; }
      #dash .reason { font-size: 11.5px; margin-top: 1px; }
    }
    /* ---- Course covers manager ---- */
    #covers { max-width: 1080px; margin: 0 auto; padding: 1.4rem 1.1rem 0.5rem; color: #0f172a; }
    #covers h1 { font-size: 1.5rem; margin: 0 0 0.2rem; }
    #covers .sub { color: #64748b; font-size: 0.9rem; margin: 0 0 0.9rem; }
    #covers .tip { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.55; margin: 0 0 1rem; }
    #covers .tip strong { font-weight: 800; }
    #covers .cov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 0.8rem; }
    #covers .cov-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    #covers .cov-card.busy { opacity: 0.55; pointer-events: none; }
    #covers .cov-thumb { aspect-ratio: 16/9; background-color: #312e81; background-image: linear-gradient(135deg, #4338ca, #1e1b4b); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
    #covers .cov-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #covers .cov-ph { color: rgba(255,255,255,0.92); font-weight: 800; letter-spacing: 1px; font-size: 1.15rem; text-align: center; padding: 0.5rem; }
    #covers .cov-body { padding: 0.7rem 0.85rem 0.85rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    #covers .cov-code { font-weight: 800; font-size: 0.78rem; color: #1e293b; }
    #covers .cov-title { font-weight: 600; font-size: 0.9rem; line-height: 1.25; }
    #covers .cov-status { font-size: 12px; color: #64748b; }
    #covers .cov-status.has { color: #16a34a; font-weight: 600; }
    #covers .cov-validate { font-size: 12px; line-height: 1.5; }
    #covers .cov-validate .ok { color: #16a34a; } #covers .cov-validate .warn { color: #b45309; } #covers .cov-validate .err { color: #dc2626; font-weight: 600; }
    #covers .cov-actions { display: flex; gap: 0.4rem; margin-top: auto; flex-wrap: wrap; }
    #covers .cov-actions .btn { flex: 1 1 auto; font-size: 0.82rem; padding: 0.45rem 0.6rem; min-width: 88px; }
    #covers label.cov-file { cursor: pointer; text-align: center; margin: 0; }
    #covers .cov-msg { font-size: 12px; }
    #covers .cov-msg.ok { color: #16a34a; font-weight: 600; } #covers .cov-msg.bad { color: #dc2626; font-weight: 600; }
    #covers .cov-sep { border: 0; border-top: 1px solid #e2e8f0; margin: 0.5rem 0 0; }
    @media (max-width: 640px) { #covers { padding: 1rem 0.7rem 0.5rem; } #covers .cov-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; } }
    @media (max-width: 440px) { #covers .cov-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-no-sidebar>
  <header class="site-header" id="site-header"></header>

  <main class="am-wrap">
    <section class="am-main" id="covers"><p class="stage-loading">Loading course covers&hellip;</p></section>
    <section class="am-main" id="dash"><p class="stage-loading">Loading live course health&hellip;</p></section>
  </main>

  <script src="assets/chrome.js?v=20260623"></script>
  <script src="assets/cms-overrides.js?v=20260623"></script>
  <script>
  (function () {
    'use strict';
    var root = document.getElementById('dash');
    var PUBLISH_ENDPOINT = 'https://matrix-course-sync.ad5046.workers.dev/';
    var PUBLISH_KEY = 'mcv-publish-9f3a2c';
    var REFRESH_MS = 60000;
    var timer = null;

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function fmtTime(iso) { var d = new Date(iso); if (isNaN(d.getTime())) return 'unknown'; var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]; return d.getDate() + ' ' + m + ' ' + d.getFullYear() + ', ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }
    function relTime(iso) { var d = new Date(iso); if (isNaN(d.getTime())) return ''; var s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000)); if (s < 60) return s + 's ago'; var m = Math.round(s/60); if (m < 60) return m + ' min ago'; var h = Math.round(m/60); if (h < 24) return h + ' hour' + (h===1?'':'s') + ' ago'; return Math.round(h/24) + ' day(s) ago'; }
    function parts(src) { var m = String(src||'').match(/^content\/([^/]+)\/(.+)$/); return m ? { folder: m[1], name: m[2] } : null; }

    function load() {
      return Promise.all([
        fetch('content/_sync-report.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
        fetch('data/courses.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      ]).then(function (res) { render(res[0], res[1]); });
    }

    function render(report, data) {
      if (!data || !data.courses) { root.innerHTML = '<div class="hb hb-warn">Could not load <code>data/courses.json</code> from the live site.</div>'; return; }
      report = report || {};
      var sum = report.summary || {};
      var courses = data.courses.slice().sort(function (a, b) { return String(a.id||a.code||'').localeCompare(String(b.id||b.code||'')); });

      /* Index the report so each screen can be given a live status. */
      var missingByCourse = {}, fixByCourse = {};
      Object.keys(report.courses || {}).forEach(function (id) {
        var c = report.courses[id];
        missingByCourse[id] = {}; (c.missing || []).forEach(function (m) { missingByCourse[id][m.title] = m.reason || ''; });
        fixByCourse[id] = {}; (c.autofixed || []).forEach(function (a) { fixByCourse[id][a.title] = a; });
      });

      function screenStatus(courseId, s) {
        if (/^https?:/i.test(s.src || '')) return { k: 'link', label: '🔗 Link' };
        if (s.missing) return { k: 'miss', label: '❌ Missing', reason: (missingByCourse[courseId] || {})[s.title] || 'File not found in the Drive folder.' };
        var fx = (fixByCourse[courseId] || {})[s.title];
        if (fx) return { k: 'fix', label: '🔧 Auto-fixed', reason: (fx.reasons || []).join(' ') };
        return { k: 'ok', label: '✅ Displays' };
      }

      /* ---- counts ---- */
      var totalScreens = 0, displaying = 0, missing = 0, fixed = 0, removed = (report.removed || []).length;
      var failed = (report.failed || []).length, collisions = (report.collisions || []).length;
      courses.forEach(function (c) { (c.screens || []).forEach(function (s) { totalScreens++; if (s.missing) missing++; else displaying++; }); });
      Object.keys(report.courses || {}).forEach(function (id) { fixed += ((report.courses[id].autofixed) || []).length; });

      var when = report.generatedAt ? (fmtTime(report.generatedAt) + ' · ' + relTime(report.generatedAt)) : 'unknown (report not found)';
      var clean = !missing && !failed && !collisions;

      var html = '';
      html += '<div class="dash-head"><div><h1>Course health</h1></div>' +
        '<div class="dash-actions">' +
          '<button class="btn btn-secondary" id="dash-refresh" type="button">↻ Refresh</button>' +
          '<button class="btn btn-primary" id="dash-sync" type="button">🚀 Sync from Drive now</button>' +
        '</div></div>' +
        '<p class="dash-sub">Live from the last Drive sync — auto-refreshes every minute. Last synced: <strong>' + esc(when) + '</strong>.</p>';

      html += '<div id="dash-syncmsg"></div>';

      html += '<div class="' + (clean ? 'hb hb-ok' : 'hb hb-warn') + '">' +
        (clean
          ? '✓ All ' + courses.length + ' courses are healthy — every file resolves, no sync failures.'
          : '🩺 ' + missing + ' screen' + (missing===1?'':'s') + ' missing a file' +
            (failed ? ' · ' + failed + ' download failure' + (failed===1?'':'s') : '') +
            (collisions ? ' · ' + collisions + ' name collision' + (collisions===1?'':'s') : '') +
            '. Details below.') +
        '</div>';

      /* ---- stat strip ---- */
      html += '<div class="stats">' +
        '<div class="stat"><div class="n">' + courses.length + '</div><div class="l">Courses</div></div>' +
        '<div class="stat good"><div class="n">' + displaying + '</div><div class="l">Screens display</div></div>' +
        '<div class="stat ' + (missing?'bad':'') + '"><div class="n">' + missing + '</div><div class="l">Missing</div></div>' +
        '<div class="stat ' + (fixed?'warn':'') + '"><div class="n">' + fixed + '</div><div class="l">Auto-fixed names</div></div>' +
        '<div class="stat"><div class="n">' + removed + '</div><div class="l">Cleaned (not in Drive)</div></div>' +
        '<div class="stat ' + (failed?'bad':'') + '"><div class="n">' + failed + '</div><div class="l">Download fails</div></div>' +
        '</div>';

      /* ---- per-course ---- */
      courses.forEach(function (c) {
        var rows = '', cMiss = 0, cFix = 0, cOk = 0;
        (c.screens || []).forEach(function (s, i) {
          var st = screenStatus(c.id, s);
          if (st.k === 'miss') cMiss++; else if (st.k === 'fix') cFix++; else if (st.k === 'ok') cOk++;
          rows += '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' + esc(s.title || '(untitled)') + '</td>' +
            '<td><span class="st st-' + st.k + '">' + st.label + '</span>' + (st.reason ? '<div class="reason">' + esc(st.reason) + '</div>' : '') + '</td>' +
            '<td>' + (/^https?:/i.test(s.src||'') ? '<a class="open" href="' + esc(s.src) + '" target="_blank" rel="noopener">URL</a>' : '<code>' + esc(s.src || '—') + '</code>') + '</td>' +
            '</tr>';
        });
        var chips = '';
        if (cMiss) chips += '<span class="chip c-miss">' + cMiss + ' missing</span>';
        if (cFix) chips += '<span class="chip c-fix">' + cFix + ' auto-fixed</span>';
        if (!cMiss) chips += '<span class="chip c-ok">' + cOk + '/' + (c.screens||[]).length + ' ok</span>';
        html += '<details class="course">' +
          '<summary><span class="code">' + esc(c.code || c.id) + '</span> <span class="title">' + esc(c.title || '') + '</span>' +
            '<span class="chips">' + chips + ' <a class="open" href="course.html?id=' + esc(c.id) + '" target="_blank" rel="noopener">open ↗</a></span></summary>' +
          '<table><thead><tr><th>#</th><th>Screen</th><th>Status</th><th>File</th></tr></thead><tbody>' + rows + '</tbody></table>' +
          '</details>';
      });

      /* ---- why / how-to ---- */
      html += '<div class="why"><strong>How this works &amp; how to fix issues</strong>' +
        '<ul style="margin:6px 0 0;padding-left:20px">' +
          '<li><strong>❌ Missing</strong> — the file named in the course’s definition sheet isn’t in its Drive folder. The site shows "missing" and never a leftover/cached copy. Add the file to that Drive folder (exact name) and it appears on the next sync.</li>' +
          '<li><strong>🔧 Auto-fixed</strong> — the sheet’s name differed only by case / hyphen-vs-en-dash / .htm-vs-.html; matched automatically. Tidy the name for cleanliness.</li>' +
          '<li><strong>Only Drive content is shown</strong> — files not in a course’s Drive folder are removed from the site, so nothing stale or copied is ever displayed. "Cleaned" above counts files removed for that reason.</li>' +
          '<li>Everything is controlled in <strong>Google Drive</strong> (one folder per course + its definition sheet). Edit there, then <strong>Sync from Drive now</strong> (or wait ~5 min).</li>' +
        '</ul></div>';

      root.innerHTML = html;
      document.getElementById('dash-refresh').addEventListener('click', function () { this.innerHTML = '<span class="spin"></span>Refreshing'; load(); });
      document.getElementById('dash-sync').addEventListener('click', syncNow);
    }

    function syncNow() {
      var btn = document.getElementById('dash-sync');
      var msg = document.getElementById('dash-syncmsg');
      btn.disabled = true; btn.textContent = '⏳ Requesting…';
      msg.innerHTML = '<div class="hb hb-ok"><span class="spin"></span>Asking GitHub to sync from Drive… this takes ~1–2 minutes, then the page auto-refreshes.</div>';
      fetch(PUBLISH_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Publish-Key': PUBLISH_KEY } })
        .then(function (r) {
          if (r.status === 401) { msg.innerHTML = '<div class="hb hb-warn">Publish key rejected.</div>'; }
          else if (r.status === 200 || r.status === 429) {
            msg.innerHTML = '<div class="hb hb-ok">✓ Sync requested' + (r.status === 429 ? ' (one was already running)' : '') + '. The dashboard will update automatically in a minute or two.</div>';
            setTimeout(load, 90000);
          } else { msg.innerHTML = '<div class="hb hb-warn">Couldn’t start the sync (HTTP ' + r.status + '). It also runs automatically every ~5 minutes.</div>'; }
        })
        .catch(function () { msg.innerHTML = '<div class="hb hb-warn">Couldn’t reach the sync service. It still runs automatically every ~5 minutes.</div>'; })
        .then(function () { btn.disabled = false; btn.textContent = '🚀 Sync from Drive now'; });
    }

    load();
    timer = setInterval(load, REFRESH_MS);   /* live: re-pull the report + courses every minute */
  })();
  </script>

  <!-- ===================== Course covers manager ===================== -->
  <script>
  (function () {
    'use strict';
    var box = document.getElementById('covers');
    if (!box) return;
    var COVER_BASE = 'https://matrix-course-sync.ad5046.workers.dev';
    var PUBLISH_KEY = 'mcv-publish-9f3a2c';
    var REC_W = 1200, REC_H = 675;                 // 16:9 recommended
    var MAX_MB = 5, WARN_MB = 1, MIN_W = 800;
    var ALLOWED = ['image/png', 'image/jpeg', 'image/webp', 'image/gif', 'image/svg+xml'];

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function kb(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }
    function getJSON(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }

    var courses = [], manifest = {};

    function load() {
      return Promise.all([
        getJSON('data/courses.json?t=' + Date.now()),
        getJSON(COVER_BASE + '/covers?t=' + Date.now())
      ]).then(function (res) {
        var data = res[0], cov = res[1];
        courses = (data && data.courses ? data.courses.slice() : []).sort(function (a, b) { return String(a.id || '').localeCompare(String(b.id || '')); });
        manifest = (cov && cov.covers) || {};
        render();
      });
    }

    function coverImg(id, v) { return '<img alt="" src="' + COVER_BASE + '/cover/' + encodeURIComponent(id) + '?v=' + (v || '') + '">'; }

    function render() {
      var html = '<h1>Course covers</h1>' +
        '<p class="sub">Upload a cover image for each course. It appears on the main catalogue cards and updates for everyone within ~30&nbsp;seconds.</p>' +
        '<div class="tip">📐 <strong>Best results:</strong> <strong>' + REC_W + '×' + REC_H + 'px</strong> (16:9 widescreen). ' +
          'Format: <strong>JPG or PNG</strong> (WebP, GIF, SVG also accepted). Keep it under <strong>' + WARN_MB + '&nbsp;MB</strong> (' + MAX_MB + '&nbsp;MB max). ' +
          'Minimum <strong>' + MIN_W + 'px</strong> wide. Images are centre-cropped to fill the 16:9 card, so keep the main subject centred.</div>';

      if (!courses.length) { html += '<div class="hb hb-warn">No courses loaded from <code>data/courses.json</code>.</div>'; box.innerHTML = html; return; }

      html += '<div class="cov-grid">';
      courses.forEach(function (c) {
        var cv = manifest[c.id];
        var thumb = cv ? coverImg(c.id, cv.v) : '<span class="cov-ph">' + esc(c.code || c.id) + '</span>';
        var status = cv
          ? '<div class="cov-status has">✓ Cover set' + (cv.w && cv.h ? ' · ' + cv.w + '×' + cv.h : '') + (cv.size ? ' · ' + kb(cv.size) : '') + '</div>'
          : '<div class="cov-status">No cover — the catalogue shows a placeholder.</div>';
        html += '<div class="cov-card" data-id="' + esc(c.id) + '">' +
          '<div class="cov-thumb">' + thumb + '</div>' +
          '<div class="cov-body">' +
            '<div><span class="cov-code">' + esc(c.code || c.id) + '</span> <span class="cov-title">' + esc(c.title || '') + '</span></div>' +
            status +
            '<div class="cov-validate"></div>' +
            '<div class="cov-actions">' +
              '<label class="btn btn-secondary cov-file">Choose image<input type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden></label>' +
              '<button class="btn btn-primary cov-upload" type="button" disabled>Upload</button>' +
              '<button class="btn btn-secondary cov-remove" type="button"' + (cv ? '' : ' hidden') + '>Remove</button>' +
            '</div>' +
            '<div class="cov-msg"></div>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      box.innerHTML = html;
      box.querySelectorAll('.cov-card').forEach(wireCard);
    }

    function wireCard(card) {
      var id = card.getAttribute('data-id');
      var input = card.querySelector('input[type=file]');
      var uploadBtn = card.querySelector('.cov-upload');
      var removeBtn = card.querySelector('.cov-remove');
      var validate = card.querySelector('.cov-validate');
      var msg = card.querySelector('.cov-msg');
      var picked = null;

      input.addEventListener('change', function () {
        msg.textContent = ''; msg.className = 'cov-msg';
        validate.innerHTML = ''; picked = null; uploadBtn.disabled = true;
        var f = input.files && input.files[0];
        if (!f) return;
        if (ALLOWED.indexOf(f.type) < 0) { validate.innerHTML = '<span class="err">✗ Unsupported type. Use JPG, PNG, WebP, GIF or SVG.</span>'; return; }
        if (f.size > MAX_MB * 1048576) { validate.innerHTML = '<span class="err">✗ ' + kb(f.size) + ' — too big. Maximum ' + MAX_MB + ' MB.</span>'; return; }
        var url = URL.createObjectURL(f);
        var im = new Image();
        im.onload = function () {
          var w = im.naturalWidth || 0, h = im.naturalHeight || 0;
          card.querySelector('.cov-thumb').innerHTML = '<img alt="" src="' + url + '">';   // live preview
          var notes = [];
          if (f.type === 'image/svg+xml' || !w || !h) {
            notes.push('<span class="ok">✓ Vector image — scales cleanly.</span>');
          } else {
            var ratio = w / h;
            notes.push('Selected: <strong>' + w + '×' + h + '</strong> · ' + kb(f.size) + ' · ' + (Math.round(ratio * 100) / 100) + ':1');
            if (w < MIN_W) notes.push('<span class="warn">⚠ Low resolution (under ' + MIN_W + 'px wide) — may look soft.</span>');
            if (ratio < 1.55 || ratio > 2.05) notes.push('<span class="warn">⚠ Not 16:9 — it will be centre-cropped to fit.</span>');
            if (f.size > WARN_MB * 1048576) notes.push('<span class="warn">⚠ Over ' + WARN_MB + ' MB — consider compressing.</span>');
            if (w >= MIN_W && ratio >= 1.55 && ratio <= 2.05 && f.size <= WARN_MB * 1048576) notes.push('<span class="ok">✓ Looks great for a cover.</span>');
          }
          validate.innerHTML = notes.join('<br>');
          picked = { file: f, w: w, h: h };
          uploadBtn.disabled = false;
        };
        im.onerror = function () { validate.innerHTML = '<span class="err">✗ Could not read that image.</span>'; };
        im.src = url;
      });

      uploadBtn.addEventListener('click', function () {
        if (!picked) return;
        card.classList.add('busy'); msg.textContent = 'Uploading…'; msg.className = 'cov-msg';
        var fd = new FormData();
        fd.append('file', picked.file);
        fd.append('w', String(picked.w || 0));
        fd.append('h', String(picked.h || 0));
        fetch(COVER_BASE + '/cover/' + encodeURIComponent(id), { method: 'POST', headers: { 'X-Publish-Key': PUBLISH_KEY }, body: fd })
          .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }); })
          .then(function (j) {
            card.classList.remove('busy');
            if (j && j.ok) {
              manifest[id] = { ct: j.ct, v: j.v, w: j.w, h: j.h, size: j.size };
              card.querySelector('.cov-thumb').innerHTML = coverImg(id, j.v);
              var st = card.querySelector('.cov-status'); st.className = 'cov-status has';
              st.innerHTML = '✓ Cover set' + (j.w && j.h ? ' · ' + j.w + '×' + j.h : '') + (j.size ? ' · ' + kb(j.size) : '');
              removeBtn.hidden = false;
              uploadBtn.disabled = true; input.value = ''; validate.innerHTML = '';
              msg.textContent = '✓ Saved — live on the catalogue within ~30s.'; msg.className = 'cov-msg ok';
            } else {
              msg.textContent = '✗ ' + ((j && j.error) || 'Upload failed.'); msg.className = 'cov-msg bad';
            }
          })
          .catch(function (e) { card.classList.remove('busy'); msg.textContent = '✗ ' + ((e && e.message) || 'Network error'); msg.className = 'cov-msg bad'; });
      });

      removeBtn.addEventListener('click', function () {
        if (!window.confirm('Remove the cover for ' + id + '? The catalogue will show a placeholder again.')) return;
        card.classList.add('busy'); msg.textContent = 'Removing…'; msg.className = 'cov-msg';
        fetch(COVER_BASE + '/cover/' + encodeURIComponent(id), { method: 'DELETE', headers: { 'X-Publish-Key': PUBLISH_KEY } })
          .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
          .then(function (j) {
            card.classList.remove('busy');
            if (j && j.ok) {
              delete manifest[id];
              card.querySelector('.cov-thumb').innerHTML = '<span class="cov-ph">' + esc(id) + '</span>';
              var st = card.querySelector('.cov-status'); st.className = 'cov-status'; st.textContent = 'No cover — the catalogue shows a placeholder.';
              removeBtn.hidden = true; msg.textContent = '✓ Removed.'; msg.className = 'cov-msg ok';
            } else { msg.textContent = '✗ Could not remove the cover.'; msg.className = 'cov-msg bad'; }
          })
          .catch(function () { card.classList.remove('busy'); msg.textContent = '✗ Network error.'; msg.className = 'cov-msg bad'; });
      });
    }

    load();
  })();
  </script>
</body>
</html>
