<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Admin · Content Manager | Matrix Course Viewer</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260617">
</head>
<body data-no-sidebar>
  <header class="site-header" id="site-header"></header>

  <main class="am-wrap">
    <section class="am-main" id="am-main">
      <p class="stage-loading">Loading courses&hellip;</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="assets/chrome.js?v=20260617"></script>
  <script src="assets/cms-overrides.js?v=20260623"></script>
  <script src="assets/sheet-loader.js?v=20260617"></script>
  <script>
  (function () {
    'use strict';
    var CMS = window.MatrixCMS;
    try { CMS.unlock('matrix'); } catch (e) {}   /* Phase 1: open access */

    var main = document.getElementById('am-main');
    var courses = null;
    var cur = { courseId: null, screenId: null };
    var editTimes = {};                /* screen src -> ISO time of its last content edit */
    var editTimesReady = Promise.resolve();
    var courseEditTimes = {};          /* course id -> ISO time of latest edit anywhere in the course */

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function safeName(s) { return String(s || 'untitled').replace(/[^\w .()-]+/g, '_').trim().slice(0, 70) || 'untitled'; }
    function pad2(n) { return ('0' + n).slice(-2); }
    function norm(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase(); }
    function wrapPage(bodyHtml) {
      return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +
        '<link rel="stylesheet" href="../../assets/embedded.css"></head><body>' +
        '<div class="page">' + bodyHtml + '</div></body></html>';
    }
    /* A full HTML document — the body Word converts inside the .docx. */
    function fullHtmlDoc(bodyHtml, title) {
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title || '') + '</title>' +
        '<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.4;}' +
        'h1{font-size:16pt;}h2{font-size:13pt;}h3{font-size:12pt;}' +
        'table{border-collapse:collapse;}td,th{border:1px solid #999;padding:4px;}' +
        'img{max-width:100%;height:auto;}</style></head><body>' +
        String(bodyHtml || '') + '</body></html>';
    }
    /* Build a REAL .docx (OOXML) — a minimal Word package whose body is one
       altChunk pointing at the embedded HTML. Word converts it to native
       content on open AND saves it back as a clean .docx, so the
       download → edit-in-Word → re-upload round trip works. (Ported from
       the Tools-page Word builder.) */
    function htmlToDocxBlob(html) {
      var z = new JSZip();
      z.file('[Content_Types].xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
        '<Override PartName="/word/afchunk.html" ContentType="text/html"/>' +
        '</Types>');
      z.file('_rels/.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
        '</Relationships>');
      z.file('word/document.xml',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
        'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<w:body><w:altChunk r:id="htmlChunk"/>' +
        '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
        '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr>' +
        '</w:body></w:document>');
      z.file('word/_rels/document.xml.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="htmlChunk" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/aFChunk" Target="afchunk.html"/>' +
        '</Relationships>');
      z.file('word/afchunk.html', String(html || ''));
      return z.generateAsync({
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      });
    }
    function download(blob, name) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }

    var TYPES = {
      document:   { cls: 'document', label: 'Worksheet', icon: '📄', word: true,  img: false },
      html:       { cls: 'html',     label: 'Page',      icon: '📝', word: true,  img: false },
      youtube:    { cls: 'youtube',  label: 'Video',     icon: '▶',  word: false, img: false },
      pdf:        { cls: 'pdf',      label: 'PDF',       icon: '📕', word: false, img: false },
      powerpoint: { cls: 'powerpoint', label: 'Slides',  icon: '📊', word: false, img: false },
      image:      { cls: 'image',    label: 'Image',     icon: '🖼', word: false, img: true },
      spreadsheet:{ cls: 'document', label: 'Sheet',     icon: '📈', word: false, img: false }
    };
    function typeOf(t) { return TYPES[t] || { cls: 'document', label: t || 'Screen', icon: '📄', word: false, img: false }; }

    function getCourse(id) { return courses.find(function (c) { return c.id === id; }); }
    function merged(id) {
      var c = getCourse(id);
      return (c && CMS.applyOverrides) ? CMS.applyOverrides(c) : c;
    }
    function isEdited(s) { return !!(s && s.src && CMS.getHtmlOverride(s.src)); }

    function bodyOf(fullHtml) {
      try {
        var d = new DOMParser().parseFromString(fullHtml, 'text/html');
        var page = d.querySelector('.page');
        if (page) return page.innerHTML;
        if (d.body) return d.body.innerHTML;
      } catch (e) {}
      return fullHtml;
    }
    function enhance(html) {
      try {
        var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
        d.body.querySelectorAll('a').forEach(function (a) {
          var m = (a.getAttribute('href') || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/);
          if (!m) return;
          var w = d.createElement('div');
          w.className = 'inline-youtube';
          w.innerHTML = '<iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen loading="lazy"></iframe>';
          a.replaceWith(w);
        });
        return d.body.innerHTML;
      } catch (e) { return html; }
    }

    /* Current body HTML of a screen — admin edit wins, else the source file. */
    async function getScreenBody(s) {
      var ov = CMS.getHtmlOverride(s.src);
      if (ov != null) {
        if (/^data:image\//i.test(ov)) return '<p><img src="' + ov + '" alt="' + esc(s.title) + '"></p>';
        return bodyOf(ov);
      }
      if (s.type === 'document') {
        var buf = await fetch(s.src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
        return (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
      }
      if (s.type === 'html') {
        return bodyOf(await fetch(s.src).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }));
      }
      return '';
    }

    /* Read an uploaded file → body HTML. Sniffs the actual CONTENT, not
       the extension — so a .docx works even if mis-named, and an old
       binary .doc gets a clear, actionable error instead of garbage.
       No AI: .docx is read verbatim by mammoth, HTML is parsed as-is. */
    async function fileToHtml(file) {
      var buf = await file.arrayBuffer();
      var b = new Uint8Array(buf);
      /* "PK" — a ZIP, i.e. a real .docx — read verbatim with mammoth. */
      if (b[0] === 0x50 && b[1] === 0x4B) {
        return (await window.mammoth.convertToHtml({ arrayBuffer: buf })).value || '';
      }
      /* OLE2 magic — an old binary .doc that mammoth cannot read. */
      if (b[0] === 0xD0 && b[1] === 0xCF && b[2] === 0x11 && b[3] === 0xE0) {
        throw new Error('That is an old-format Word .doc. In Word choose ' +
          'File ▸ Save As and pick “Word Document (.docx)”, then upload that .docx.');
      }
      /* Otherwise treat it as HTML / text (our exports, .htm pages). */
      return bodyOf(new TextDecoder('utf-8').decode(buf));
    }

    /* Strip the "Screen N:" prefix our course downloads put on each
       screen heading, so a downloaded course re-uploads and matches. */
    function stripScreenPrefix(title) {
      return String(title || '').replace(/^\s*screen\s*\d+\s*[:.\-–—]\s*/i, '').trim();
    }
    /* The number from a "Screen N:" heading, or null. This is the most
       reliable matcher — it survives the title text being renamed. */
    function screenNumberOf(title) {
      var m = String(title || '').match(/^\s*screen\s*(\d+)\s*[:.\-–—]/i);
      return m ? parseInt(m[1], 10) : null;
    }
    /* First embedded picture (a data: URI) inside a chunk of HTML —
       used to populate image screens from a section of an uploaded doc. */
    function firstImageData(html) {
      try {
        var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
        var img = d.body.querySelector('img');
        var src = img && img.getAttribute('src');
        return (src && /^data:image\//i.test(src)) ? src : null;
      } catch (e) { return null; }
    }
    /* The image a screen currently shows — an admin override wins. */
    function imageSrcOf(s) {
      var ov = CMS.getHtmlOverride(s.src);
      return (ov && /^data:image\//i.test(ov)) ? ov : s.src;
    }
    /* Fetch any URL and return it as a base64 data: URI, so a picture
       can be embedded directly inside a downloaded Word document. */
    async function toDataUri(url) {
      try {
        var blob = await fetch(url).then(function (r) { if (!r.ok) throw new Error('x'); return r.blob(); });
        return await new Promise(function (res) {
          var fr = new FileReader();
          fr.onload = function () { res(String(fr.result)); };
          fr.onerror = function () { res(null); };
          fr.readAsDataURL(blob);
        });
      } catch (e) { return null; }
    }

    /* Give a screen's HTML exactly ONE title heading. If the content
       already opens with a heading that just repeats the screen title,
       that heading is REUSED (its text becomes headingText) — so the
       title never appears twice. Otherwise headingText is added as a
       new heading on top. */
    function markScreen(html, headingText, title) {
      try {
        var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
        var first = d.body.firstElementChild;
        while (first && !(first.textContent || '').trim() && !first.querySelector('img')) {
          first = first.nextElementSibling;
        }
        if (first && /^H[1-6]$/.test(first.tagName) && norm(first.textContent) === norm(title)) {
          first.textContent = headingText;
        } else {
          var h = d.createElement('h1');
          h.textContent = headingText;
          d.body.insertBefore(h, d.body.firstChild);
        }
        return d.body.innerHTML;
      } catch (e) {
        return '<h1>' + esc(headingText) + '</h1>' + html;
      }
    }

    /* ---- Edit-time tracking (file manager + per-screen info) ---- */
    function fmtTime(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
      return d.getDate() + ' ' + mon + ' ' + d.getFullYear() + ', ' +
        ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    /* The pages table was seeded for every screen in one transaction,
       so all original rows share the EXACT same updated_at = the seed
       time. That isn't a real edit. Detect it (any timestamp shared by
       3+ rows) and treat those as "Original — not yet edited" even
       though a pages row exists. Real edits use now() per row, so
       their timestamps are unique. */
    function detectSeedTime(rows) {
      var counts = {}, dominant = null;
      (rows || []).forEach(function (r) {
        if (r && r.updated_at) counts[r.updated_at] = (counts[r.updated_at] || 0) + 1;
      });
      Object.keys(counts).forEach(function (t) {
        if (counts[t] >= 3 && (!dominant || counts[t] > counts[dominant])) dominant = t;
      });
      return dominant;
    }
    async function loadEditTimes(c) {
      editTimes = {};
      if (!CMS.supabaseClient || !c) return;
      try {
        var srcs = (c.screens || []).map(function (s) { return s.src; }).filter(Boolean);
        if (!srcs.length) return;
        /* Pull ALL pages rows to detect the global seed cluster, then
           filter to this course's screens. */
        var res = await CMS.supabaseClient.from('pages').select('path,updated_at');
        var rows = res.data || [];
        var seedTime = detectSeedTime(rows);
        var wanted = {}; srcs.forEach(function (p) { wanted[p] = true; });
        rows.forEach(function (r) {
          if (!r || !r.path || !r.updated_at || !wanted[r.path]) return;
          if (seedTime && r.updated_at === seedTime) return;
          editTimes[r.path] = r.updated_at;
        });
      } catch (e) {}
    }
    function editTextPlain(s) {
      var iso = s && editTimes[s.src];
      if (iso) return fmtTime(iso);
      if (isEdited(s)) return 'Edited';
      return 'Original — not yet edited';
    }
    function hoursText(s) {
      return (s && s.hours != null && s.hours !== '') ? String(s.hours) : '—';
    }
    /* Thumbnail for a course tile — admin upload (saved as a pages row
       at the synthetic path cms-thumbnail/<courseId>) wins; otherwise
       fall back to the legacy content/<id>/opening.svg image. */
    function thumbnailFor(c) {
      var ov = CMS.getHtmlOverride && CMS.getHtmlOverride('cms-thumbnail/' + c.id);
      if (ov && /^data:image\//i.test(ov)) return ov;
      return 'content/' + c.id + '/opening.svg';
    }
    /* When was THIS course last edited anywhere — its own row, any of
       its screens' rows, or any of its pages' content rows. Aggregated
       once on the catalog and painted onto each tile. */
    async function loadCourseEditTimes() {
      courseEditTimes = {};
      if (!CMS.supabaseClient) return;
      try {
        /* ONLY use pages.updated_at — courses.updated_at and
           screens.updated_at carry the seed time for every untouched
           row, which would make every course look "edited just now"
           even when nobody has touched it. The pages table only has
           a row when content was actually edited, so it's the clean
           signal. */
        var res = await Promise.all([
          CMS.supabaseClient.from('screens').select('course_id,src'),
          CMS.supabaseClient.from('pages').select('path,updated_at')
        ]);
        var srcToCourse = {};
        (res[0].data || []).forEach(function (r) { if (r && r.src) srcToCourse[r.src] = r.course_id; });
        /* Exclude the seed-time cluster — those aren't real edits. */
        var seedTime = detectSeedTime(res[1].data || []);
        (res[1].data || []).forEach(function (r) {
          if (!r || !r.path || !r.updated_at) return;
          if (seedTime && r.updated_at === seedTime) return;
          var cid = srcToCourse[r.path];
          if (!cid) return;
          if (!courseEditTimes[cid] || r.updated_at > courseEditTimes[cid]) courseEditTimes[cid] = r.updated_at;
        });
      } catch (e) {}
    }
    function repaintCatalogTimes() {
      document.querySelectorAll('.am-tile[data-course]').forEach(function (b) {
        var span = b.querySelector('.am-tile-edited');
        if (!span) return;
        var iso = courseEditTimes[b.dataset.course];
        span.textContent = iso ? ('Last edited ' + fmtTime(iso)) : '';
      });
    }

    /* ========== URL routing ==========
       Each view has its own address, so a refresh, a bookmark or a
       shared link reopens exactly where you were:
         admin.html                          → catalog
         admin.html?course=CO0001            → that course
         admin.html?course=CO0001&screen=s3  → that screen
       mode: 'push' = new history entry (Back works), 'replace' =
       update in place, 'none' = don't touch history (popstate). */
    function buildUrl(courseId, screenId) {
      var u = location.pathname.split('/').pop() || 'admin.html';
      if (courseId) {
        u += '?course=' + encodeURIComponent(courseId);
        if (screenId) u += '&screen=' + encodeURIComponent(screenId);
      }
      return u;
    }
    function setUrl(courseId, screenId, mode) {
      if (mode === 'none') return;
      var url = buildUrl(courseId, screenId);
      var here = (location.pathname.split('/').pop() || 'admin.html') + location.search;
      var st = { courseId: courseId || null, screenId: screenId || null };
      try {
        if (mode === 'push' && url !== here) history.pushState(st, '', url);
        else history.replaceState(st, '', url);
      } catch (e) {}
    }
    function routeFromUrl(mode) {
      if (!courses) return;
      var p = new URLSearchParams(location.search);
      var courseId = p.get('course');
      var screenId = p.get('screen');
      if (courseId && getCourse(courseId)) openCourse(courseId, screenId || null, mode);
      else renderCatalog(mode);
    }

    /* ========== View 1: catalog ========== */
    function renderCatalog(mode) {
      cur.courseId = null; cur.screenId = null;
      document.documentElement.classList.remove('am-course-mode');
      document.body.classList.remove('am-course-mode');
      /* Filter out courses the editor has soft-deleted (local). */
      var hidden = {};
      (CMS.getDeletedCourses ? CMS.getDeletedCourses() : []).forEach(function (id) { hidden[id] = true; });
      var visibleCourses = (courses || []).filter(function (c) { return !hidden[c.id]; });
      var tiles = visibleCourses.map(function (c) {
        var scr = c.screens || [];
        var edited = scr.filter(function (s) { return isEdited(s); }).length;
        return '<button type="button" class="am-tile" data-course="' + esc(c.id) + '">' +
          '<span class="am-tile-thumb" style="background-image:url(\'' + esc(thumbnailFor(c)) + '\')">' +
            '<span class="am-tile-code">' + esc(c.code || c.id) + '</span></span>' +
          '<span class="am-tile-body"><strong>' + esc(c.title || c.id) + '</strong>' +
            '<span class="am-tile-meta">' + scr.length + ' screens' +
              (c.draft ? ' · <em style="color:#d97706">DRAFT — auto-built from files; add a definition sheet (Active: yes) to publish</em>' : '') +
              (edited ? ' · <em>' + edited + ' edited</em>' : '') + '</span>' +
            '<span class="am-tile-edited"></span></span></button>';
      }).join('');
      main.innerHTML =
        '<div id="am-health"></div>' +
        '<div class="am-head"><div class="am-head-row"><div>' +
          '<span class="am-head-eyebrow">Content manager</span>' +
          '<h1>Courses</h1>' +
          '<p>Pick a course to edit. New courses are created in Google Drive — tap the guide.</p></div>' +
          '<div class="am-head-actions">' +
            '<button type="button" class="btn btn-primary" id="am-guide-btn">📖 How to add a course</button>' +
            '<button type="button" class="btn btn-secondary" id="am-tpl-btn" title="Download a course template Word document">📄 Download template</button>' +
          '</div></div></div>' +
        '<div class="am-catalog">' + tiles + '</div>';
      main.querySelectorAll('[data-course]').forEach(function (b) {
        b.addEventListener('click', function () { openCourse(b.dataset.course); });
      });
      var gb = document.getElementById('am-guide-btn');
      if (gb) gb.addEventListener('click', renderGuide);
      var tb = document.getElementById('am-tpl-btn');
      if (tb) tb.addEventListener('click', downloadCourseTemplate);
      setUrl(null, null, mode || 'push');
      /* Paint cached times now (if any), then refresh from Supabase. */
      repaintCatalogTimes();
      loadCourseEditTimes().then(repaintCatalogTimes);
      paintHealthBanner();
    }

    /* ========== Sync health banner (top of the catalog) ==========
       Reads the report the sync writes (content/_sync-report.json) and shows, in
       plain English, what's missing or was auto-corrected and WHY — so a publisher
       self-diagnoses the hyphen / case / extension traps without anyone debugging. */
    function relTime(iso) {
      var d = new Date(iso); if (isNaN(d.getTime())) return '';
      var s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
      if (s < 60) return s + 's ago';
      var m = Math.round(s / 60); if (m < 60) return m + ' min ago';
      var h = Math.round(m / 60); if (h < 24) return h + ' hour' + (h === 1 ? '' : 's') + ' ago';
      return Math.round(h / 24) + ' day(s) ago';
    }
    async function paintHealthBanner() {
      var host = document.getElementById('am-health');
      if (!host) return;
      var rep = null;
      try { rep = await fetch('content/_sync-report.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; }); } catch (e) {}
      if (!rep) { host.innerHTML = ''; return; }
      var sum = rep.summary || {};
      var when = rep.generatedAt ? (fmtTime(rep.generatedAt) + ' · ' + relTime(rep.generatedAt)) : 'unknown';
      var courseIds = Object.keys(rep.courses || {});
      /* Prefer the summary, but fall back to counting (so an older-format report
         from before the last sync can never show a false "all clean"). */
      var cnt = function (key) { return courseIds.reduce(function (n, id) { return n + ((rep.courses[id][key] || []).length); }, 0); };
      var nMissing = sum.missing != null ? sum.missing : cnt('missing');
      var nFixed = sum.autofixed != null ? sum.autofixed : cnt('autofixed');

      var css = '<style>' +
        '#am-health{margin:0 0 8px}' +
        '#am-health .hb{border-radius:12px;padding:14px 18px;margin:0 0 10px;font-size:14px;line-height:1.5}' +
        '#am-health .hb-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}' +
        '#am-health .hb-warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}' +
        '#am-health h3{margin:0 0 6px;font-size:15px}' +
        '#am-health .hb-row{margin:10px 0;padding:10px 12px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;color:#0f172a}' +
        '#am-health code{background:#1e293b;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:12.5px;word-break:break-all}' +
        '#am-health .hb-why{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:8px;padding:10px 14px;margin-top:10px}' +
        '#am-health details{margin-top:8px}#am-health summary{cursor:pointer;font-weight:600}' +

<div class="gnote"><strong>The one big idea:</strong> every course lives in <strong>Google Drive</strong>. This website is just a live mirror of your Drive. You make changes in Drive, press <strong>🚀 Publish to live</strong>, and a minute or two later the site matches Drive. You never touch any code.</div>

<h2>1. Where everything lives</h2>

    function renderScreenList(c) {

      list.querySelectorAll('[data-screen]').forEach(function (a) {
        a.addEventListener('click', function (e) {

    /* ---- Drag-to-reorder (PowerPoint-style) ---- */
    var _dragSrc = null;
    var _justDragged = false;
    function wireDragOnItem(el) {
      el.addEventListener('dragstart', function (e) {
        _dragSrc = el.dataset.screen;
        el.classList.add('ms-ws-dragging');
        try {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', _dragSrc);
        } catch (_) {}
      });
      el.addEventListener('dragend', function () {
        el.classList.remove('ms-ws-dragging');
        document.querySelectorAll('.ms-ws-dropping-before, .ms-ws-dropping-after').forEach(function (n) {
          n.classList.remove('ms-ws-dropping-before', 'ms-ws-dropping-after');
        });
        _dragSrc = null;
        _justDragged = true;
        setTimeout(function () { _justDragged = false; }, 80);
      });
      el.addEventListener('dragover', function (e) {
        if (!_dragSrc || el.dataset.screen === _dragSrc) return;
        e.preventDefault();
        var rect = el.getBoundingClientRect();
        var after = e.clientY > rect.top + rect.height / 2;
        el.classList.toggle('ms-ws-dropping-before', !after);
        el.classList.toggle('ms-ws-dropping-after', after);
      });
      el.addEventListener('dragleave', function () {
        el.classList.remove('ms-ws-dropping-before', 'ms-ws-dropping-after');
      });
      el.addEventListener('drop', function (e) {
        e.preventDefault();
        var rect = el.getBoundingClientRect();
        var after = e.clientY > rect.top + rect.height / 2;
        var src = _dragSrc;
        el.classList.remove('ms-ws-dropping-before', 'ms-ws-dropping-after');
        if (src && el.dataset.screen && src !== el.dataset.screen) {
          reorderScreens(cur.courseId, src, el.dataset.screen, after);
        }
      });
    }
    function reorderScreens(courseId, sourceId, targetId, after) {
      var c = merged(courseId);
      var ids = (c.screens || []).map(function (s) { return s.id; });
      var srcIdx = ids.indexOf(sourceId);
      if (srcIdx < 0) return;
      ids.splice(srcIdx, 1);
      var dstIdx = ids.indexOf(targetId);
      if (dstIdx < 0) return;
      ids.splice(after ? dstIdx + 1 : dstIdx, 0, sourceId);
      /* Write every screen's new position so applyOverrides sorts correctly. */
      ids.forEach(function (id, i) { CMS.setScreenOverride(courseId, id, { position: i }); });
      flash('Screen order updated.');
      renderScreenList(merged(courseId));
    }

    /* ---- Delete a course from the catalogue (soft, local) ---- */
    function deleteCourse(courseId) {
      var c = getCourse(courseId);
      if (!c) return;
      if (!confirm('Are you sure you want to delete the course\n\n  ' + (c.title || courseId) + '\n\nIt will be hidden from the catalogue immediately. (Originals from the project files can be brought back by clearing your browser data.)')) return;
      if (CMS.addDeletedCourse) CMS.addDeletedCourse(courseId);
      /* Best-effort: also remove any Supabase rows (no-op if absent). */
      try { if (CMS.supabaseClient) CMS.supabaseClient.from('courses').delete().eq('id', courseId); } catch (e) {}
      try { if (CMS.supabaseClient) CMS.supabaseClient.from('screens').delete().eq('course_id', courseId); } catch (e) {}
      /* Remove from the local discovery cache so it doesn't reappear. */
      try {
        var key = 'matrix-lms:db-courses';
        var dbc = JSON.parse(localStorage.getItem(key) || '[]').filter(function (x) { return x && x.id !== courseId; });
        localStorage.setItem(key, JSON.stringify(dbc));
      } catch (e) {}
      renderCatalog('replace');
    }

        '<h1>Course template — replace this with your course title</h1>' +

          '<li>Replace the title above with your real course title.</li>' +

          '<li>Everything <i>below</i> a Screen heading is that screen\'s content — text, images, lists, tables — until the next Screen heading.</li>' +
          '<li>Keep the Screen&nbsp;N&nbsp;numbers in order; the upload uses them to place content.</li>' +
          '<li>Upload the document in Admin &rsaquo; the course &rsaquo; <b>Upload whole course</b>.</li>' +

        '<table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse">' +
        '<tr><th>#</th><th>Type</th><th>Title</th><th>Hours</th><th>Source file</th></tr>' +

    /* ---- Add a new (blank) screen and open it for editing ---- */
    function addScreen(courseId) {
      var c = merged(courseId);
      var newPos = (c.screens || []).length;
      var newId = 'add-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
      var newSrc = 'content/' + (c.code || c.id) + '/' + newId + '.html';
      var newTitle = 'New screen';
      CMS.setScreenOverride(courseId, newId, {
        title: newTitle, type: 'html', src: newSrc, position: newPos
      });
      CMS.setHtmlOverride(newSrc, wrapPage('<h1>' + esc(newTitle) + '</h1><p>(edit me)</p>'));
      editTimes[newSrc] = new Date().toISOString();
      flash('✓ Added a new screen — rename it in the header, edit the content below.');
      /* Open the course fresh (re-running renderScreenList with the new
         screen included) then jump straight into the new screen. */
      openCourse(courseId, newId, 'push');
    }

    /* ---- Delete a screen ---- */
    function deleteScreen(courseId, s) {
      if (!confirm('Delete the screen “' + (s.title || 'untitled') + '”?\n\nIt will be hidden from the course immediately.')) return;
      var rawCourse = getCourse(courseId);
      var isOriginal = !!(rawCourse && (rawCourse.screens || []).some(function (x) { return x.id === s.id; }));
      if (isOriginal) {
        /* Original screens live in the GitHub repo; soft-hide locally so
           the next pull from Supabase can't bring them back. */
        if (CMS.addDeletedScreen) CMS.addDeletedScreen(courseId, s.id);
      } else {
        /* Added screens were admin-created; remove their override rows. */
        try {
          var so = JSON.parse(localStorage.getItem('matrix-lms:cms:screens') || '{}');
          if (so[courseId]) { delete so[courseId][s.id]; localStorage.setItem('matrix-lms:cms:screens', JSON.stringify(so)); }
        } catch (e) {}
        try {
          var h = JSON.parse(localStorage.getItem('matrix-lms:cms:html') || '{}');
          delete h[s.src];
          localStorage.setItem('matrix-lms:cms:html', JSON.stringify(h));
        } catch (e) {}
        try { if (CMS.supabaseClient) CMS.supabaseClient.from('screens').delete().eq('id', s.id); } catch (e) {}
        try { if (CMS.supabaseClient && s.src) CMS.supabaseClient.from('pages').delete().eq('path', s.src); } catch (e) {}
      }
      openCourse(courseId, null, 'replace');
    }

    /* Lightweight sidebar updates. The screen list is built ONCE per course
       (renderScreenList). Clicking a screen must never rebuild it — that
       resets the list's scroll position and makes the menu visibly jump.
       Instead just toggle the active row, and refresh a single row's
       title / badge when that screen's content actually changes. */
    function markActiveScreen(screenId) {
      var list = document.getElementById('am-screenlist');
      if (!list) return;
      list.querySelectorAll('[data-screen]').forEach(function (a) {
        a.classList.toggle('active', a.dataset.screen === screenId);
      });
    }
    function syncScreenListItem(courseId, screenId) {
      var list = document.getElementById('am-screenlist');
      if (!list) return;
      var c = merged(courseId);
      var s = (c.screens || []).find(function (x) { return x.id === screenId; });
      if (!s) return;
      var item = null;
      list.querySelectorAll('[data-screen]').forEach(function (a) {
        if (a.dataset.screen === screenId) item = a;
      });
      if (!item) return;
      var t = typeOf(s.type);
      var titleEl = item.querySelector('.ms-ws-title');
      var badgeEl = item.querySelector('.ms-ws-type-badge');
      if (titleEl) titleEl.textContent = s.title || '(untitled)';
      if (badgeEl) {
        badgeEl.className = 'ms-ws-type-badge ' + t.cls;
        badgeEl.textContent = t.label + (isEdited(s) ? ' · edited' : '');
      }
    }

    /* ========== File manager — every screen, type, hours, file ========== */
    async function showFileManager(courseId) {
      cur.screenId = null;
      markActiveScreen(null);
      var pane = document.getElementById('am-content');
      if (!pane) return;
      pane.innerHTML = '<p class="stage-loading">Loading file manager&hellip;</p>';

      var rows = (c.screens || []).map(function (s, i) {

        return '<tr data-screen="' + esc(s.id) + '">' +

      }).join('');
      pane.innerHTML =

          '<p>Every screen in this course — its type, title, hours, where the content comes from, ' +
          'and when it was last edited. Originals live in the project files; edits are saved in the ' +
          'database. Click any row to open that screen.</p>' +
          '<button type="button" class="btn btn-primary" id="am-fm-add">＋ Add screen</button>' +
        '</div>' +
        '<table class="am-fm-table"><thead><tr>' +
          '<th>#</th><th>Type</th><th>Title</th><th>Hours</th><th>Source file</th><th>Last edited</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';

    /* ========== Screen content pane ========== */
    function openScreen(courseId, screenId, mode) {
      cur.screenId = screenId;
      setUrl(courseId, screenId, mode || 'push');
      var c = merged(courseId);
      var idx = (c.screens || []).findIndex(function (s) { return s.id === screenId; });
      var s = c.screens[idx];
      var t = typeOf(s.type);
      /* Don't rebuild the list — just move the active row and refresh this
         row in case its content / title changed (import, edit). */
      markActiveScreen(screenId);
      syncScreenListItem(courseId, screenId);

      var actions;
      if (t.word) {
        actions = '<div class="am-replace" id="am-zone">' +
          '<div class="am-replace-info"><strong>⤓ Replace with a Word document</strong>' +
          '<span>Drop a <code>.docx</code> here (or click) — its text copies in word-for-word and goes live immediately. Or edit it here like a document.</span></div>' +
          '<input type="file" id="am-file" accept=".docx,.doc,.htm,.html" hidden>' +
          '<div class="am-replace-actions">' +
            '<button class="btn btn-primary" id="am-upload-btn" type="button">Upload Word file…</button>' +
            '<button class="btn btn-secondary" id="am-edit-btn" type="button">✎ Edit like a document</button>' +
            '<button class="btn btn-secondary" id="am-dl-btn" type="button">⤓ Download Word</button>' +
          '</div></div>';
      } else if (t.img) {
        actions = '<div class="am-replace" id="am-zone">' +
          '<div class="am-replace-info"><strong>🖼 Replace this image</strong>' +

      } else {
        actions = '<div class="am-replace am-replace-readonly"><div class="am-replace-info">' +

      }

      var pane = document.getElementById('am-content');
      pane.innerHTML =
        '<div class="am-screen-head"><span class="am-screen-ico">' + t.icon + '</span>' +
          '<div class="am-screen-headbody"><span class="am-screen-eyebrow">Screen ' + (idx + 1) + ' · ' + esc(t.label) + '</span>' +
            '<input class="am-screen-title" id="am-title" value="' + esc(s.title || '') + '"></div>' +
          '<a class="btn btn-secondary" href="course.html?id=' + esc(courseId) + '&screen=' + esc(s.id) + '" target="_blank" rel="noopener">↗ Open in course</a>' +
          '<button class="btn btn-ghost am-delete-btn" id="am-delete-btn" type="button" title="Delete this screen">🗑 Delete screen</button>' +
        '</div>' +
        '<div class="am-screen-meta">' +
          '<label class="am-meta-hours">Hours <input type="number" id="am-hours" min="0" step="0.1" value="' +
            esc(s.hours != null ? s.hours : '') + '"></label>' +
          '<span class="am-meta-item"><strong>Source file:</strong> ' +
            (/^https?:/i.test(s.src || '')
              ? '<a href="' + esc(s.src) + '" target="_blank" rel="noopener">' + esc(s.src) + '</a>'
              : '<code>' + esc(s.src || '—') + '</code>') + '</span>' +

        '</div>' + actions +

      /* The content pane is a fixed height and scrolls internally, so the

      pane.scrollTop = 0;
      /* Fill in the last-edited time once the Supabase lookup resolves. */
      editTimesReady.then(function () {
        var el = document.getElementById('am-edited');
        if (el && cur.screenId === s.id) el.innerHTML = '<strong>Last edited:</strong> ' + esc(editTextPlain(s));
      });

      document.getElementById('am-title').addEventListener('change', function () {
        CMS.setScreenOverride(courseId, s.id, { title: this.value.trim() });
        flash('Title saved — live on the course.');
        syncScreenListItem(courseId, s.id);
      });
      document.getElementById('am-hours').addEventListener('change', function () {
        var h = parseFloat(this.value);
        CMS.setScreenOverride(courseId, s.id, { hours: isNaN(h) ? null : h });
        flash('Hours saved — live on the course.');
      });
      document.getElementById('am-delete-btn').addEventListener('click', function () { deleteScreen(courseId, s); });
      /* Save button is hidden until the WYSIWYG editor opens.
         Title and hours auto-save on change, and a course upload
         already commits content — there's nothing to save otherwise. */

      if (t.word) {
        var fileInput = document.getElementById('am-file');
        document.getElementById('am-upload-btn').addEventListener('click', function () { fileInput.click(); });
        fileInput.addEventListener('change', function () { if (fileInput.files[0]) importScreen(fileInput.files[0], courseId, s); });
        document.getElementById('am-edit-btn').addEventListener('click', function () { openEditor(courseId, s); });
        document.getElementById('am-dl-btn').addEventListener('click', function () { downloadScreen(s, idx); });
        wireDrop('am-zone', /\.(docx|doc|html?)$/i, function (f) { importScreen(f, courseId, s); });
      } else if (t.img) {
        var imgInput = document.getElementById('am-imgfile');
        document.getElementById('am-img-btn').addEventListener('click', function () { imgInput.click(); });
        imgInput.addEventListener('change', function () { if (imgInput.files[0]) uploadImage(imgInput.files[0], courseId, s); });
        wireDrop('am-zone', /^image\//i, function (f) { uploadImage(f, courseId, s); }, true);
      }
      renderPreview(s, document.getElementById('am-preview'));
    }

    function wireDrop(id, accept, onFile, byMime) {
      var dz = document.getElementById(id);
      if (!dz) return;
      ['dragenter', 'dragover'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
      });
      dz.addEventListener('drop', function (e) {
        var f = e.dataTransfer && e.dataTransfer.files[0];
        if (f && accept.test(byMime ? f.type : f.name)) onFile(f);
        else if (f) flash('That file type is not accepted here.', 'err');
      });
    }

    function flash(msg, kind) {
      var el = document.getElementById('am-status');
      if (!el) return;
      el.hidden = false;
      el.className = 'am-status' + (kind ? ' ' + kind : ' ok');
      el.innerHTML = msg;
      clearTimeout(el._t);
      if (!kind || kind === 'ok') el._t = setTimeout(function () { el.hidden = true; }, 4000);
    }

    async function renderPreview(s, box) {
      try {
        var ov = CMS.getHtmlOverride(s.src);
        if (s.type === 'document' || s.type === 'html') {
          box.innerHTML = '<div class="stage-doc"><div class="stage-doc-inner">' + enhance(await getScreenBody(s)) + '</div></div>';
        } else if (s.type === 'image') {
          var src = (ov && /^data:image\//.test(ov)) ? ov : s.src;
          box.innerHTML = '<div class="am-preview-img"><img src="' + esc(src) + '" alt="' + esc(s.title) + '"></div>';
        } else if (s.type === 'youtube') {
          var m = String(s.src || '').match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/);
          box.innerHTML = m ? '<div class="inline-youtube"><iframe src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen></iframe></div>'
                            : '<p class="stage-loading">Video: ' + esc(s.src) + '</p>';
        } else if (s.type === 'pdf') {
          box.innerHTML = '<iframe class="am-preview-frame" src="' + esc(s.src) + '"></iframe>';
        } else {
          box.innerHTML = '<p class="stage-loading">' + esc(typeOf(s.type).label) + ' — <a href="' + esc(s.src) + '" target="_blank" rel="noopener">open / download</a></p>';
        }
      } catch (err) {
        box.innerHTML = '<p class="stage-loading" style="color:var(--warn)">Could not render this screen: ' + esc(err.message) + '</p>';
      }
    }

    /* ---------- Import one screen (.docx verbatim, or .doc/.htm) ---------- */
    async function importScreen(file, courseId, s) {
      flash('Reading “' + esc(file.name) + '” and copying the text in word-for-word…');
      try {
        var bodyHtml = await fileToHtml(file);
        if (!bodyHtml.trim()) { flash('That file looks empty — nothing to import.', 'err'); return; }
        CMS.setHtmlOverride(s.src, wrapPage(bodyHtml));
        editTimes[s.src] = new Date().toISOString();
        flash('✓ Saved from “' + esc(file.name) + '” — live on the course now.');
        openScreen(courseId, s.id, 'replace');
      } catch (err) {
        flash('Could not import that file: ' + esc(err.message || err), 'err');
      }
    }

    /* ---------- Per-screen download (real Word .docx) ---------- */
    async function downloadScreen(s, idx) {
      flash('Preparing the Word file…');
      try {
        var body = markScreen(await getScreenBody(s), s.title, s.title);
        var blob = await htmlToDocxBlob(fullHtmlDoc(body, s.title));
        download(blob, pad2(idx + 1) + ' - ' + safeName(s.title) + '.docx');
        flash('✓ Downloaded as Word .docx — open it in Word, edit, then upload it back.');
      } catch (err) {
        flash('Could not build the Word file: ' + esc(err.message || err), 'err');
      }
    }

    /* ---------- Full-course download — ONE Word .docx ---------- */
    async function downloadCourse(courseId) {
      var c = merged(courseId);
      flash('Building the course download — rendering ' + c.screens.length + ' screens…');
      try {
        var parts = [];
        for (var i = 0; i < c.screens.length; i++) {
          var s = c.screens[i], t = typeOf(s.type);
          var content;
          if (t.word) {
            content = await getScreenBody(s);
          } else if (t.img) {
            var isrc = imageSrcOf(s);
            var durl = /^data:/i.test(isrc) ? isrc : (await toDataUri(isrc) || isrc);
            content = '<p><img src="' + esc(durl) + '" style="max-width:100%"></p>';
          } else {
            content = '<p><em>[' + esc(t.label) + ' screen — link kept as-is: ' +
              esc(s.src || '') + ']</em></p>';
          }
          /* Combined doc: exactly ONE heading per screen, "Screen N:
             Title" — the obvious editing label AND the re-upload split
             boundary. No more title-then-title repetition. */
          parts.push(markScreen(content, 'Screen ' + (i + 1) + ': ' + s.title, s.title));
        }
        /* A "Course contents" summary table at the very top — screen
           type, title, hours and source file for every screen. It sits
           BEFORE the first "Screen N:" heading, so the re-upload
           splitter ignores it (information only). */
        var sumRows = c.screens.map(function (s, i) {
          var t = typeOf(s.type);
          return '<tr><td>' + (i + 1) + '</td><td>' + esc(t.label) + '</td><td>' +
            esc(s.title || '') + '</td><td>' + esc(s.hours != null ? s.hours : '') +
            '</td><td>' + esc(s.src || '') + '</td></tr>';
        }).join('');
        var summary =
          '<h1>' + esc((c.code || c.id) + ' — ' + (c.title || '')) + '</h1>' +
          '<p><b>Course contents</b> — ' + c.screens.length + ' screens. This table is a ' +
          'summary only; edit each screen further down, under its “Screen N: Title” heading.</p>' +
          '<table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse">' +
          '<tr><th>#</th><th>Screen type</th><th>Title</th><th>Hours</th><th>Source file</th></tr>' +
          sumRows + '</table><br style="page-break-before:always">';
        /* The whole course as one real .docx — the contents table, then
           each screen under a "Screen N:" heading you edit and re-upload. */
        var combined = summary + parts.join('<br style="page-break-before:always">');
        /* Name files with the CP/CO course code up front — several
           courses share a title, so the code is what tells them apart. */
        var codeName = safeName((c.code || c.id) + ' - ' + c.title);
        var blob = await htmlToDocxBlob(fullHtmlDoc(combined, (c.code || c.id) + ' ' + c.title));
        download(blob, codeName + '.docx');
        flash('✓ Course downloaded as a single Word document.');
      } catch (err) {
        flash('Could not build the course download: ' + esc(err.message || err), 'err');
      }
    }

    /* ---------- Full-course upload — split a Word doc into screens ---------- */
    function splitOnHeadings(html) {
      var d = new DOMParser().parseFromString('<!DOCTYPE html><body>' + html + '</body>', 'text/html');
      var markerRe = /^\s*screen\s*\d+\s*[:.\-–—]/i;
      var kids = Array.prototype.filter.call(d.body.childNodes, function (n) { return n.nodeType === 1; });
      /* A screen boundary is any block whose text starts with
         "Screen N:" — our download marker. Detected on ANY element,
         because Word / Google Docs may re-import our <h1> as a heading
         of a different level or even a styled paragraph. Only if the
         document has no such markers at all (hand-made) do we fall
         back to treating every Heading 1 as a boundary. */
      var anyMarker = kids.some(function (n) { return markerRe.test((n.textContent || '').trim()); });
      var sections = [], curSec = null;
      kids.forEach(function (node) {
        var isBoundary = anyMarker
          ? markerRe.test((node.textContent || '').trim())
          : (node.tagName === 'H1');
        if (isBoundary) {
          curSec = { title: (node.textContent || '').trim(), body: '' };
          sections.push(curSec);
        } else if (curSec) {
          curSec.body += node.outerHTML || '';
        }
      });
      return sections;
    }
    async function uploadCourse(file, courseId) {
      var pane = document.getElementById('am-content');
      pane.innerHTML = '<p class="stage-loading">Reading “' + esc(file.name) + '” and splitting it into screens…</p>';
      try {
        var html = await fileToHtml(file);
        var sections = splitOnHeadings(html);
        if (!sections.length) {
          pane.innerHTML = '<div class="am-empty"><div class="am-empty-ico">⚠</div><h1>No screens found</h1>' +
            '<p>Each screen must start with a <strong>Heading&nbsp;1</strong> line — ideally ' +
            '“<strong>Screen&nbsp;N:&nbsp;Title</strong>”. Use “Download whole course” first to ' +
            'get a document already in the right format, edit it, then upload it back.</p>' +
            '<button class="btn btn-secondary" id="am-back2" type="button">Back</button></div>';
          document.getElementById('am-back2').addEventListener('click', function () { openCourse(courseId); });
          return;
        }
        /* THE DOCUMENT IS THE TRUTH.
           Section ORDER = course order. TITLE = the screen's identity
           (renaming in Word creates a new screen — rename via the
           admin title input if you want to preserve a screen's id).
           "Screen N:" numbers are display only and not used for
           matching, so the editor can renumber freely. */
        var c = merged(courseId);
        var allScreens = c.screens || [];
        var byTitle = {};
        allScreens.forEach(function (s) { byTitle[norm(s.title)] = s; });

        var updated = [], added = [], skipped = [], used = {};
        sections.forEach(function (sec, idx) {
          var newPos = idx;                       /* document order WINS */
          var rawTitle = stripScreenPrefix(sec.title) || sec.title || '';
          var s = byTitle[norm(rawTitle)] || byTitle[norm(sec.title)];
          if (s && used[s.id]) s = null;          /* don't double-map */

          if (s) {
            used[s.id] = true;
            var t = typeOf(s.type);
            if (t.word) {
              CMS.setHtmlOverride(s.src, wrapPage(sec.body));
              CMS.setScreenOverride(courseId, s.id, { position: newPos });
              updated.push(s.title);
            } else if (t.img) {
              var data = firstImageData(sec.body);
              if (data) CMS.setHtmlOverride(s.src, data);
              CMS.setScreenOverride(courseId, s.id, { position: newPos });
              updated.push(s.title);
            } else {
              /* Video / PDF / slides: keep the link, just reorder. */
              CMS.setScreenOverride(courseId, s.id, { position: newPos });
              skipped.push(s.title + ' (' + t.label + ' — reordered; link not editable in Word)');
            }
            return;
          }
          /* No title match — create a new text screen at this position. */
          var newTitle = rawTitle || ('Screen ' + (idx + 1));
          var newId = 'add-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6) + idx;
          var newSrc = 'content/' + (c.code || c.id) + '/' + newId + '.html';
          CMS.setScreenOverride(courseId, newId, { title: newTitle, type: 'html', src: newSrc, position: newPos });
          CMS.setHtmlOverride(newSrc, wrapPage(sec.body));
          added.push(newTitle);
        });
        /* Existing screens NOT in the document keep their original
           order, placed after the doc'd screens. (We don't auto-delete
           — use the 🗑 button on a screen if you want it gone.) */
        var tail = sections.length;
        allScreens.forEach(function (s) {
          if (used[s.id]) return;
          CMS.setScreenOverride(courseId, s.id, { position: tail++ });
        });

        var allFailed = updated.length === 0 && added.length === 0;
        pane.innerHTML =
          '<div class="am-empty"><div class="am-empty-ico">' + (allFailed ? '⚠' : '✓') + '</div>' +
          '<h1>' + (allFailed ? 'Nothing was updated' : 'Course updated') + '</h1>' +
          '<p>The document order is now the course order. ' +
            '<strong>' + updated.length + '</strong> screen(s) updated' +
            (added.length ? ' · <strong>' + added.length + '</strong> new' : '') +
            (skipped.length ? ' · <strong>' + skipped.length + '</strong> reordered (non-text)' : '') + '.</p>' +
          (updated.length ? '<p style="font-size:0.82rem;color:var(--success)">Updated: ' +
            esc(updated.join(', ')) + '</p>' : '') +
          (added.length ? '<p style="font-size:0.82rem;color:var(--success)">Added as new screens: ' +
            esc(added.join(', ')) + '</p>' : '') +
          (skipped.length ? '<p style="font-size:0.82rem;color:var(--text-muted)">Reordered only — videos, ' +
            'PDFs and slideshows are set by their link, not by document text: ' + esc(skipped.join('; ')) + '</p>' : '') +
          '<p style="font-size:0.78rem;color:var(--text-subtle);margin-top:0.6rem">Note: matching is by ' +
            '<b>title</b>. Renaming a title in Word creates a NEW screen rather than renaming the old one — ' +
            'rename via the title input in admin if you want a single screen with a new name.</p>' +
          '<button class="btn btn-primary" id="am-back2" type="button">Review screens</button></div>';
        document.getElementById('am-back2').addEventListener('click', function () { openCourse(courseId); });
      } catch (err) {
        pane.innerHTML = '<div class="am-empty"><div class="am-empty-ico">⚠</div><h1>Could not import</h1>' +
          '<p>' + esc(err.message || err) + '</p>' +
          '<button class="btn btn-secondary" id="am-back2" type="button">Back</button></div>';
        var b = document.getElementById('am-back2');
        if (b) b.addEventListener('click', function () { openCourse(courseId); });
      }
    }

    /* ---------- Image upload ---------- */
    function uploadImage(file, courseId, s) {
      if (!/^image\//i.test(file.type)) { flash('Please choose an image file.', 'err'); return; }
      flash('Reading “' + esc(file.name) + '”…');
      var fr = new FileReader();
      fr.onload = function () {
        CMS.setHtmlOverride(s.src, String(fr.result));
        editTimes[s.src] = new Date().toISOString();
        flash('✓ Image updated — live on the course now.');
        openScreen(courseId, s.id, 'replace');
      };
      fr.onerror = function () { flash('Could not read that image.', 'err'); };
      fr.readAsDataURL(file);
    }

    /* ---------- WYSIWYG editor ---------- */
    var TOOLBAR = [
      ['bold', '<b>B</b>', 'Bold'], ['italic', '<i>I</i>', 'Italic'], ['underline', '<u>U</u>', 'Underline'],
      ['sep'], ['h2', 'H1', 'Big heading'], ['h3', 'H2', 'Sub-heading'], ['p', '¶', 'Normal text'],
      ['sep'], ['ul', '• List', 'Bulleted list'], ['ol', '1. List', 'Numbered list'],
      ['sep'], ['link', '🔗 Link', 'Insert a link'], ['image', '🖼 Image', 'Insert an image'],
      ['sep'], ['clear', '✗ Clear', 'Clear formatting']
    ];
    async function openEditor(courseId, s) {
      var host = document.getElementById('am-editor-host');
      if (host.dataset.open === '1') {
        host.dataset.open = '0'; host.innerHTML = '';
        var ps = document.getElementById('am-preview-save');
        if (ps) ps.hidden = true;
        return;
      }
      host.dataset.open = '1';
      host.innerHTML = '<div class="am-editor"><p class="stage-loading" style="padding:1rem">Loading…</p></div>';
      var bodyHtml = '';
      try { bodyHtml = await getScreenBody(s); } catch (e) { bodyHtml = '<p>(could not load current text)</p>'; }

      var tb = TOOLBAR.map(function (b) {
        if (b[0] === 'sep') return '<span class="am-tool-sep"></span>';
        return '<button type="button" class="am-tool-btn" data-cmd="' + b[0] + '" title="' + b[2] + '">' + b[1] + '</button>';
      }).join('');
      host.innerHTML =
        '<div class="am-editor"><div class="am-toolbar">' + tb + '</div>' +
          '<div class="am-doc" id="am-doc" contenteditable="true"></div>' +
          '<div class="am-editor-actions">' +
            '<button class="btn btn-ghost" id="am-ed-close" type="button">Close</button>' +
          '</div></div><input type="file" id="am-ed-img" accept="image/*" hidden>';
      var doc = document.getElementById('am-doc');
      doc.innerHTML = enhance(bodyHtml);
      host.querySelectorAll('.am-tool-btn').forEach(function (btn) {
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btn.addEventListener('click', function () {
          doc.focus();
          var cmd = btn.dataset.cmd;
          if (cmd === 'bold' || cmd === 'italic' || cmd === 'underline') document.execCommand(cmd, false, null);
          else if (cmd === 'h2') document.execCommand('formatBlock', false, 'h1');
          else if (cmd === 'h3') document.execCommand('formatBlock', false, 'h2');
          else if (cmd === 'p') document.execCommand('formatBlock', false, 'p');
          else if (cmd === 'ul') document.execCommand('insertUnorderedList', false, null);
          else if (cmd === 'ol') document.execCommand('insertOrderedList', false, null);
          else if (cmd === 'clear') document.execCommand('removeFormat', false, null);
          else if (cmd === 'link') { var u = prompt('Link address (https://…):', 'https://'); if (u) document.execCommand('createLink', false, u); }
          else if (cmd === 'image') document.getElementById('am-ed-img').click();
        });
      });
      document.getElementById('am-ed-img').addEventListener('change', function (e) {
        var f = e.target.files[0]; if (!f) return;
        var fr = new FileReader();
        fr.onload = function () { doc.focus(); document.execCommand('insertImage', false, String(fr.result)); };
        fr.readAsDataURL(f); e.target.value = '';
      });
      var topSave = document.getElementById('am-preview-save');
      function closeEditor() {
        host.dataset.open = '0'; host.innerHTML = '';
        if (topSave) topSave.hidden = true;
      }
      function saveEditor() {
        CMS.setHtmlOverride(s.src, wrapPage(doc.innerHTML));
        editTimes[s.src] = new Date().toISOString();
        flash('✓ Saved — live on the course now.');
        closeEditor();
        openScreen(courseId, s.id, 'replace');
      }
      document.getElementById('am-ed-close').addEventListener('click', closeEditor);
      /* Reveal the Save on the Preview bar only while editing. */
      if (topSave) { topSave.hidden = false; topSave.onclick = saveEditor; }
    }

    /* ---------- Boot ---------- */
    /* Back / Forward re-render the matching view without touching history. */
    window.addEventListener('popstate', function () { routeFromUrl('none'); });

    fetch('data/courses.json').then(function (r) { return r.json(); }).then(async function (data) {
      /* Wait for Google Sheets to load (max 5s) so sheet-controlled
         courses fold in on the FIRST render. Without this the catalog
         briefly shows the Supabase / static version with admin-added
         extras before the sheet replaces it on a later reload. */
      if (window.MatrixSheets && window.MatrixSheets.refresh) {
        try {
          await Promise.race([
            window.MatrixSheets.refresh(),
            new Promise(function (r) { setTimeout(r, 5000); })
          ]);
        } catch (_) {}
      }
      /* Fold in any courses that live only in Supabase (e.g. added here). */
      courses = (window.MatrixCMS && window.MatrixCMS.mergeCourses)
        ? window.MatrixCMS.mergeCourses(data.courses || []) : (data.courses || []);
      /* Order by course code (CO0001 first) so the admin catalog matches the
         public catalog and never drifts with merge/load order. */
      courses.sort(function (a, b) {
        return String(a.id || a.code || '').localeCompare(String(b.id || b.code || ''));
      });
      routeFromUrl('replace');
    }).catch(function (err) {
      main.innerHTML = '<p class="stage-loading">Could not load courses: ' + esc(err.message) + '</p>';
    });
  })();
  </script>

  <!-- ===== Publish to live: Worker dispatch + live progress tracking ===== -->
  <script>
  (function () {
    'use strict';
    // Endpoint + soft key. The KEY must match the Worker's PUBLISH_KEY secret
    // (see worker/README.md). It's a gate, not a vault — the sync is harmless
    // to re-run, so exposure on this public page only risks an extra sync.
    var PUBLISH_ENDPOINT = 'https://matrix-course-sync.ad5046.workers.dev/';
    var PUBLISH_KEY = 'mcv-publish-9f3a2c';
    // Public read of the workflow's runs so we can show real progress. If the
    // unauthenticated GitHub API rate-limits us, we fall back to a timer.
    var RUNS_API = 'https://api.github.com/repos/Holopoint1/matrix-course-viewer/actions/workflows/sync-from-drive.yml/runs?per_page=5';
    var POLL_MS = 5000;          // how often we check the run
    var DEPLOY_WAIT_MS = 30000;  // rough GitHub Pages rebuild time after the sync commits

    // ---------- UI ----------
    var card = document.createElement('div');
    card.style.cssText = ['position:fixed', 'right:20px', 'bottom:78px', 'z-index:9999',
      'width:300px', 'padding:14px 16px', 'border-radius:12px', 'background:#0f172a', 'color:#fff',
      'font:400 13px/1.45 Segoe UI,Arial,sans-serif', 'box-shadow:0 8px 24px rgba(0,0,0,.35)', 'display:none'].join(';');
    card.innerHTML =
      '<div id="pub-status" style="font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px">Starting…</div>' +
      '<div style="height:8px;border-radius:6px;background:#1e293b;overflow:hidden">' +
        '<div id="pub-bar" style="height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#3b82f6,#22d3ee)"></div>' +
      '</div>' +
      '<div id="pub-note" style="margin-top:9px;color:#94a3b8;font-size:12px"></div>' +
      '<button id="pub-refresh" style="display:none;margin-top:11px;width:100%;padding:9px;border:0;border-radius:8px;cursor:pointer;font:600 13px Segoe UI,Arial,sans-serif;color:#fff;background:#16a34a">↻ Refresh to see changes</button>';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '🚀 Publish to live';
    btn.style.cssText = ['position:fixed', 'right:20px', 'bottom:20px', 'z-index:9999',
      'padding:12px 18px', 'border:0', 'border-radius:10px', 'cursor:pointer',
      'font:600 15px/1 Segoe UI,Arial,sans-serif', 'color:#fff', 'background:#2563eb', 'box-shadow:0 6px 18px rgba(0,0,0,.28)'].join(';');

    var elStatus, elBar, elNote, elRefresh;
    var target = 0, visible = 0, ease = null;

    function startEase() {
      if (ease) return;
      ease = setInterval(function () {
        visible += (target - visible) * 0.08;
        if (visible > 99) visible = 99;
        elBar.style.width = visible.toFixed(1) + '%';
      }, 180);
    }
    function stopEase() { if (ease) { clearInterval(ease); ease = null; } }
    function setBar(pct) { target = pct; startEase(); }
    function jumpBar(pct) { stopEase(); target = visible = pct; elBar.style.width = pct + '%'; }
    function status(txt, spin) {
      elStatus.innerHTML = (spin ? '<span style="display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:pubspin .8s linear infinite"></span>' : '') + txt;
    }
    function note(txt) { elNote.textContent = txt; }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function resetBtn() { btn.disabled = false; btn.textContent = '🚀 Publish to live'; btn.style.background = '#2563eb'; }

    function latestRuns() {
      return fetch(RUNS_API, { headers: { 'Accept': 'application/vnd.github+json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { return j && j.workflow_runs ? j.workflow_runs : null; })
        .catch(function () { return null; }); // null = unreachable / rate-limited
    }

    function finishOK() {
      jumpBar(100); elBar.style.background = '#16a34a';
      status('✅ Published — it’s live', false);
      note('Click refresh to load your changes.');
      elRefresh.style.display = 'block'; resetBtn();
    }
    function finishErr(msg) {
      stopEase(); elBar.style.background = '#dc2626';
      status('⚠️ ' + msg, false); note('Nothing was lost — you can press Publish again.');
      resetBtn();
    }

    // Watch one run by id until it completes, then wait for the Pages deploy.
    function trackRun(runId, t0) {
      function poll() {
        if (Date.now() - t0 > 4 * 60 * 1000) { // safety cap
          status('Still working…', false);
          note('Taking longer than usual — try refresh in a minute.');
          elRefresh.style.display = 'block'; resetBtn(); return;
        }
        latestRuns().then(function (runs) {
          if (runs === null) { setBar(95); return sleep(DEPLOY_WAIT_MS).then(finishOK); }
          var run = null;
          for (var i = 0; i < runs.length; i++) { if (runs[i].id === runId) { run = runs[i]; break; } }
          if (!run) { setBar(20); return sleep(POLL_MS).then(poll); }
          if (run.status === 'queued') { status('Queued at GitHub…', true); setBar(22); return sleep(POLL_MS).then(poll); }
          if (run.status === 'in_progress') { status('Syncing from Google Drive…', true); setBar(72); return sleep(POLL_MS).then(poll); }
          if (run.status === 'completed') {
            if (run.conclusion === 'success') {
              status('Deploying to the site…', true); jumpBar(90); setBar(98);
              return sleep(DEPLOY_WAIT_MS).then(finishOK);
            }
            return finishErr('Sync failed (' + run.conclusion + '). Check the Actions tab.');
          }
          return sleep(POLL_MS).then(poll);
        });
      }
      poll();
    }

    function publish() {
      btn.disabled = true; btn.textContent = '⏳ Publishing…'; btn.style.background = '#64748b';
      card.style.display = 'block'; elRefresh.style.display = 'none';
      elBar.style.background = 'linear-gradient(90deg,#3b82f6,#22d3ee)';
      jumpBar(6); status('Starting…', true);
      note('This takes about 1–2 minutes. You can keep working — it runs in the background.');

      latestRuns().then(function (before) {
        var baseId = before && before[0] ? before[0].id : null;
        return fetch(PUBLISH_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Publish-Key': PUBLISH_KEY } })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; }); })
          .then(function (res) {
            if (res.status === 401) return finishErr('Publish key rejected.');
            if (res.status !== 200 && res.status !== 429) return finishErr('Couldn’t start publish (' + res.status + ').');
            // 200 = we triggered it; 429 = one is already running. Either way, find the run and track it.
            status('Queued at GitHub…', true); setBar(18);
            var t0 = Date.now();
            (function find() {
              if (Date.now() - t0 > 45000) { setBar(95); return sleep(DEPLOY_WAIT_MS).then(finishOK); }
              latestRuns().then(function (runs) {
                if (runs === null) { setBar(95); return sleep(DEPLOY_WAIT_MS).then(finishOK); }
                var run = runs[0];
                if (run && run.id !== baseId) return trackRun(run.id, t0);                                   // our fresh run
                if (run && run.id === baseId && run.status !== 'completed') return trackRun(run.id, t0);      // 429: already running
                return sleep(3000).then(find);
              });
            })();
          });
      }).catch(function () { finishErr('Could not reach the publish service.'); });
    }

    document.body.appendChild(card);
    document.body.appendChild(btn);
    elStatus = card.querySelector('#pub-status');
    elBar = card.querySelector('#pub-bar');
    elNote = card.querySelector('#pub-note');
    elRefresh = card.querySelector('#pub-refresh');
    elRefresh.addEventListener('click', function () { location.reload(); });
    btn.addEventListener('click', publish);

    var sx = document.createElement('style');
    sx.textContent = '@keyframes pubspin{to{transform:rotate(360deg)}}';
    document.head.appendChild(sx);
  })();
  </script>
</body>
